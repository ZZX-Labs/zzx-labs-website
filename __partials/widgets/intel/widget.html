<!-- __partials/widgets/intel/widget.html -->
<div class="btc-card intel">
  <div class="intel__header">
    <div>
      <div class="btc-card__title">Bitcoin Intel · News</div>
      <div class="intel__eyebrow">public reporting · technology · discussion</div>
    </div>
    <span class="btc-card__status" data-intel-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="intel__hero">
    <span>active source</span>
    <strong data-intel-source>—</strong>
    <small data-intel-sub>rotating Bitcoin-related public reporting</small>
  </div>

  <div class="intel__controls">
    <label>
      <span>source</span>
      <select data-intel-select aria-label="Bitcoin Intel news source"></select>
    </label>
    <button class="zzx-widgets__btn" type="button" data-intel-next>Next source</button>
    <button class="zzx-widgets__btn" type="button" data-intel-refresh>Refresh</button>
  </div>

  <div class="intel__meta-line">
    <span data-intel-count>—</span>
    <span data-intel-age>—</span>
  </div>

  <div class="intel__list" data-intel-list aria-live="polite"></div>

  <div class="intel__footer">
    <span data-intel-meta>direct fetch first · proxy fallback only when browser CORS requires it</span>
  </div>
</div>
