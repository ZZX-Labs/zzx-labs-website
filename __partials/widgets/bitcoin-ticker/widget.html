<section class="bitcoin-ticker" data-bitcoin-ticker aria-label="Bitcoin price ticker">
  <header class="bitcoin-ticker__header">
    <div class="bitcoin-ticker__heading">
      <span class="bitcoin-ticker__eyebrow">ZZX-LABS / BITCOIN</span>
      <h2 class="bitcoin-ticker__title">Bitcoin Ticker</h2>
    </div>

    <div class="bitcoin-ticker__state">
      <span class="bitcoin-ticker__dot" data-state-dot aria-hidden="true"></span>
      <span data-state-text>Loading</span>
    </div>
  </header>

  <div class="bitcoin-ticker__controls" aria-label="Ticker controls">
    <label class="bitcoin-ticker__control">
      <span>Source</span>
      <select data-source-select aria-label="Bitcoin price source">
        <option value="zzx">ZZX Global BPI</option>
      </select>
    </label>

    <label class="bitcoin-ticker__control">
      <span>Quote</span>
      <select data-currency-select aria-label="Quote currency or unit">
        <option value="USD">USD — US Dollar</option>
      </select>
    </label>
  </div>

  <div class="bitcoin-ticker__hero" aria-live="polite">
    <div class="bitcoin-ticker__primary">
      <span class="bitcoin-ticker__unit">1 BTC</span>
      <span class="bitcoin-ticker__price">
        <span data-currency-symbol>$</span><span data-btc>—</span>
      </span>
      <span class="bitcoin-ticker__quote" data-currency-label>USD</span>
    </div>

    <div class="bitcoin-ticker__market">
      <span data-source-label>ZZX Global BPI</span>
      <span aria-hidden="true">·</span>
      <span data-update-age>waiting for data</span>
    </div>
  </div>

  <div class="bitcoin-ticker__denoms" aria-label="Bitcoin denomination values">
    <div class="bitcoin-ticker__denom">
      <span class="bitcoin-ticker__denom-label">1 mBTC</span>
      <strong><span data-mbtc-symbol>$</span><span data-mbtc>—</span></strong>
    </div>

    <div class="bitcoin-ticker__denom">
      <span class="bitcoin-ticker__denom-label">1 μBTC</span>
      <strong><span data-ubtc-symbol>$</span><span data-ubtc>—</span></strong>
    </div>

    <div class="bitcoin-ticker__denom">
      <span class="bitcoin-ticker__denom-label">1 sat</span>
      <strong><span data-sat-symbol>$</span><span data-sat>—</span></strong>
    </div>
  </div>

  <div class="bitcoin-ticker__stats" aria-label="24 hour market statistics">
    <div class="bitcoin-ticker__stat">
      <span>24h High</span>
      <strong data-high>—</strong>
    </div>

    <div class="bitcoin-ticker__stat">
      <span>24h Low</span>
      <strong data-low>—</strong>
    </div>

    <div class="bitcoin-ticker__stat">
      <span>24h Volume</span>
      <strong data-volume>—</strong>
    </div>

    <div class="bitcoin-ticker__stat">
      <span>Spread</span>
      <strong data-spread>—</strong>
    </div>
  </div>

  <footer class="bitcoin-ticker__footer">
    <span data-provider-detail>ZZX BPI</span>
    <span class="bitcoin-ticker__credit">Made by: <i>[0xdeadbeef]</i></span>
  </footer>
</section>
