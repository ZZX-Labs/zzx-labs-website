<!-- __partials/widgets/tip-drift/widget.html -->
<div class="btc-card tip-drift">
  <div class="tip-drift__header">
    <div>
      <div class="btc-card__title">Tip Drift</div>
      <div class="tip-drift__eyebrow">live tip age · recent block cadence</div>
    </div>

    <span
      class="btc-card__status"
      data-td-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <div class="tip-drift__hero">
    <span>current tip</span>
    <strong data-td-height>—</strong>
    <small data-td-sub>loading mempool chain tip…</small>
  </div>

  <div class="tip-drift__metrics">
    <div>
      <span>tip age</span>
      <strong data-td-age>—</strong>
    </div>

    <div>
      <span>mean interval</span>
      <strong data-td-avg>—</strong>
    </div>

    <div>
      <span>mean Δ10</span>
      <strong data-td-avg-drift>—</strong>
    </div>

    <div>
      <span>last Δ10</span>
      <strong data-td-last-drift>—</strong>
    </div>
  </div>

  <div class="tip-drift__details">
    <div class="tip-drift__row">
      <span>tip timestamp · UTC</span>
      <strong data-td-tip-utc>—</strong>
    </div>

    <div class="tip-drift__row">
      <span>tip timestamp · local</span>
      <strong data-td-tip-local>—</strong>
    </div>

    <div class="tip-drift__row">
      <span>last interval</span>
      <strong data-td-last>—</strong>
    </div>

    <div class="tip-drift__row">
      <span>sample</span>
      <strong data-td-sample>—</strong>
    </div>

    <div class="tip-drift__row">
      <span>source</span>
      <strong data-td-source>—</strong>
    </div>
  </div>

  <div class="tip-drift__footer">
    <span data-td-meta>
      tip drift = recent completed block cadence vs 10-minute target
    </span>

    <button
      type="button"
      class="zzx-widgets__btn"
      data-td-refresh
      aria-label="Refresh tip drift"
    >Refresh</button>
  </div>
</div>
