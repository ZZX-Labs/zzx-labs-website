<!-- __partials/widgets/node-network-mix/widget.html -->
<div class="btc-card node-network-mix">
  <div class="node-network-mix__header">
    <div>
      <div class="btc-card__title">Node Network Mix</div>
      <div class="node-network-mix__eyebrow">transport / address-family composition</div>
    </div>
    <span class="btc-card__status" data-node-network-mix-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="node-network-mix__hero">
    <span>known nodes</span>
    <strong data-node-network-mix-total>—</strong>
    <small data-node-network-mix-sub>ZZX /bitcoin/bitnodes/ aggregate API</small>
  </div>

  <div class="node-network-mix__metrics">
    <div><span>IPv4</span><strong data-node-network-mix-ipv4>—</strong></div>
    <div><span>IPv6</span><strong data-node-network-mix-ipv6>—</strong></div>
    <div><span>Tor</span><strong data-node-network-mix-tor>—</strong></div>
    <div><span>I2P / CJDNS</span><strong data-node-network-mix-overlay>—</strong></div>
  </div>


  <div class="node-network-mix__bars" data-node-network-mix-bars></div>

  <div class="node-network-mix__footer">
    <span data-node-network-mix-meta>local Bitnodes aggregate</span>
    <button class="zzx-widgets__btn" type="button" data-node-network-mix-refresh>Refresh</button>
  </div>
</div>
