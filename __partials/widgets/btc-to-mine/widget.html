<div class="btc-card btc-to-mine">
  <div class="btc-to-mine__header">
    <div><div class="btc-card__title">BTC To Mine</div><div class="btc-to-mine__eyebrow">remaining scheduled Bitcoin issuance</div></div>
    <span class="btc-card__status" data-tomine-status data-status="offline" aria-live="polite">loading</span>
  </div>
  <div class="btc-to-mine__hero"><span>BTC remaining to issue</span><strong data-tomine-btc>—</strong><small data-tomine-percent>—</small></div>
  <div class="btc-to-mine__metrics">
    <div><span>remaining sats</span><strong data-tomine-sats>—</strong></div>
    <div><span>current height</span><strong data-tomine-height>—</strong></div>
    <div><span>current subsidy</span><strong data-tomine-subsidy>—</strong></div>
    <div><span>next halving</span><strong data-tomine-next>—</strong></div>
    <div><span>blocks to halving</span><strong data-tomine-next-blocks>—</strong></div>
    <div><span>final subsidy block</span><strong data-tomine-final-height>—</strong></div>
    <div><span>positive-subsidy blocks left</span><strong data-tomine-blocks-left>—</strong></div>
    <div><span>terminal supply</span><strong data-tomine-terminal>—</strong></div>
  </div>
  <div class="btc-to-mine__footer">
    <span data-tomine-meta>exact remaining coinbase subsidy; not a wall-clock prediction</span>
    <button type="button" class="zzx-widgets__btn" data-tomine-refresh>Refresh</button>
  </div>
</div>
