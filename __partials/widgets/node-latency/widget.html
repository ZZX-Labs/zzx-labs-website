<!-- __partials/widgets/node-latency/widget.html -->
<div class="btc-card node-latency">
  <div class="node-latency__header">
    <div>
      <div class="btc-card__title">Node Latency</div>
      <div class="node-latency__eyebrow">snapshot percentile distribution</div>
    </div>
    <span class="btc-card__status" data-node-latency-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="node-latency__hero">
    <span>median latency</span>
    <strong data-node-latency-p50>—</strong>
    <small data-node-latency-sub>ZZX /bitcoin/bitnodes/ aggregate API</small>
  </div>

  <div class="node-latency__metrics">
    <div><span>average</span><strong data-node-latency-avg>—</strong></div>
    <div><span>p90</span><strong data-node-latency-p90>—</strong></div>
    <div><span>p95</span><strong data-node-latency-p95>—</strong></div>
    <div><span>p99</span><strong data-node-latency-p99>—</strong></div>
  </div>

  <div class="node-latency__footer">
    <span data-node-latency-meta>local Bitnodes aggregate</span>
    <button class="zzx-widgets__btn" type="button" data-node-latency-refresh>Refresh</button>
  </div>
</div>
