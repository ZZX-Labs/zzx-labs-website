<div class="btc-card btc-commits">
  <div class="btc-commits__header">
    <div><div class="btc-card__title">BTC Commits</div><div class="btc-commits__eyebrow">Bitcoin Core repository activity</div></div>
    <span class="btc-card__status" data-commits-status data-status="offline" aria-live="polite">loading</span>
  </div>
  <div class="btc-commits__hero"><span>latest commit</span><strong data-commits-sha>—</strong><small data-commits-message>—</small></div>
  <div class="btc-commits__metrics">
    <div><span>24h commits</span><strong data-commits-24h>—</strong></div>
    <div><span>7d commits</span><strong data-commits-7d>—</strong></div>
    <div><span>sample authors</span><strong data-commits-authors>—</strong></div>
    <div><span>sample size</span><strong data-commits-count>—</strong></div>
  </div>
  <div class="btc-commits__list" data-commits-list aria-label="Recent Bitcoin Core commits"></div>
  <div class="btc-commits__footer">
    <span data-commits-meta>local mirror → GitHub Bitcoin Core fallback</span>
    <button type="button" class="zzx-widgets__btn" data-commits-refresh>Refresh</button>
  </div>
</div>
