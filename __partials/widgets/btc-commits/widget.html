<!-- __partials/widgets/btc-commits/widget.html -->
<div class="btc-card btc-commits" data-widget-root="btc-commits">
  <div class="btc-commits__header">
    <div>
      <div class="btc-card__title">BTC Commits</div>
      <div class="btc-commits__eyebrow">Bitcoin Core repository activity</div>
    </div>
    <span class="btc-card__status" data-btc-commits-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-commits__hero">
    <span>latest commit</span>
    <a data-btc-commits-latest-link href="https://github.com/bitcoin/bitcoin/commits/master/" target="_blank" rel="noopener noreferrer">
      <strong data-btc-commits-latest-title>—</strong>
    </a>
    <small data-btc-commits-latest-meta>—</small>
  </div>

  <div class="btc-commits__metrics">
    <div><span>24h commits</span><strong data-btc-commits-24h>—</strong></div>
    <div><span>7d commits</span><strong data-btc-commits-7d>—</strong></div>
    <div><span>sample authors</span><strong data-btc-commits-authors>—</strong></div>
    <div><span>sample size</span><strong data-btc-commits-size>—</strong></div>
  </div>

  <div class="btc-commits__toolbar">
    <input type="search" data-btc-commits-search placeholder="Filter SHA / message / author" aria-label="Filter Bitcoin Core commits" autocomplete="off" spellcheck="false">
  </div>

  <div class="btc-commits__readout-head">
    <span>recent commits</span>
    <strong data-btc-commits-visible>—</strong>
  </div>

  <div class="btc-commits__scroll" data-btc-commits-scroll>
    <div data-btc-commits-list></div>
  </div>

  <div class="btc-commits__footer">
    <span data-btc-commits-source>local Bitcoin Core activity mirror</span>
    <button type="button" class="zzx-widgets__btn" data-btc-commits-refresh>Refresh</button>
  </div>
</div>
