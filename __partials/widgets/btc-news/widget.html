<!-- __partials/widgets/btc-news/widget.html -->
<div class="btc-card btc-news">
  <div class="btc-news__header">
    <div>
      <div class="btc-card__title">Bitcoin News</div>
      <div class="btc-news__eyebrow">bitcoin-only headlines · rotating sources</div>
    </div>
    <span class="btc-card__status" data-news-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-news__hero">
    <span>active source</span>
    <strong data-news-source>—</strong>
    <small data-news-sub>loading headlines…</small>
  </div>

  <div class="btc-news__controls">
    <label>
      <span>source</span>
      <select data-news-select aria-label="Bitcoin News source"></select>
    </label>
    <button class="zzx-widgets__btn" type="button" data-news-next>Next source</button>
    <button class="zzx-widgets__btn" type="button" data-news-refresh>Refresh</button>
  </div>

  <div class="btc-news__ticker" aria-label="Bitcoin news ticker">
    <div class="btc-news__track" data-news-track></div>
  </div>

  <div class="btc-news__meta-line">
    <span data-news-count>—</span>
    <span data-news-age>—</span>
  </div>

  <div class="btc-news__list" data-news-list></div>

  <div class="btc-news__footer">
    <span data-news-meta>direct fetch first · CORS fallback only where necessary</span>
  </div>
</div>
