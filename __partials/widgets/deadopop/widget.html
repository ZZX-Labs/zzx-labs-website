<!-- __partials/widgets/deadopop/widget.html -->
<div class="btc-card deadopop">
  <div class="deadopop__header">
    <div>
      <div class="btc-card__title">DeadOPop</div>
      <div class="deadopop__eyebrow">failed · collapsed · scam · bankrupt cryptoassets</div>
    </div>
    <span class="btc-card__status" data-deado-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="deadopop__hero">
    <span>combined estimated value lost</span>
    <strong data-deado-lost>—</strong>
    <small data-deado-sub>Bitcoin explicitly excluded</small>
  </div>

  <div class="deadopop__metrics">
    <div><span>dead assets</span><strong data-deado-count>—</strong></div>
    <div><span>valued / coverage</span><strong data-deado-coverage>—</strong></div>
    <div><span>combined peak cap</span><strong data-deado-peak>—</strong></div>
    <div><span>unvalued</span><strong data-deado-unvalued>—</strong></div>
  </div>

  <div class="deadopop__controls">
    <label>
      <span>status</span>
      <select data-deado-filter aria-label="DeadOPop status filter">
        <option value="all">all statuses</option>
      </select>
    </label>

    <input
      data-deado-search
      type="search"
      placeholder="filter asset / symbol / failure"
      aria-label="Filter DeadOPop dataset"
    >

    <button type="button" class="zzx-widgets__btn" data-deado-refresh>Refresh</button>
  </div>

  <div class="deadopop__table-wrap">
    <div class="deadopop__table" role="table" aria-label="Top dead cryptoassets by estimated value lost">
      <div class="deadopop__row deadopop__head" role="row">
        <div role="columnheader">#</div>
        <div role="columnheader">Asset</div>
        <div role="columnheader">Failure</div>
        <div role="columnheader">Method</div>
        <div class="deadopop__num" role="columnheader">Confidence</div>
        <div class="deadopop__num" role="columnheader">Est. Lost</div>
      </div>
      <div data-deado-body></div>
    </div>
  </div>

  <div class="deadopop__pager">
    <button type="button" class="zzx-widgets__btn" data-deado-prev>Prev</button>
    <span data-deado-page>page 1 / 1</span>
    <button type="button" class="zzx-widgets__btn" data-deado-next>Next</button>
  </div>

  <div class="deadopop__footer">
    <span data-deado-meta>archival DeadOPop API · Bitcoin excluded</span>
  </div>
</div>
