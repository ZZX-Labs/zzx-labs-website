<!-- __partials/widgets/node-health/widget.html -->
<div class="btc-card node-health">
  <div class="node-health__header">
    <div>
      <div class="btc-card__title">Node Health</div>
      <div class="node-health__eyebrow">reachability + synchronization snapshot</div>
    </div>
    <span class="btc-card__status" data-node-health-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="node-health__hero">
    <span>reachable nodes</span>
    <strong data-node-health-reach>—</strong>
    <small data-node-health-sub>ZZX /bitcoin/bitnodes/ aggregate API</small>
  </div>

  <div class="node-health__metrics">
    <div><span>reachable now</span><strong data-node-health-now>—</strong></div>
    <div><span>reachable 24h</span><strong data-node-health-24h>—</strong></div>
    <div><span>synced / behind</span><strong data-node-health-sync>—</strong></div>
    <div><span>duplicates</span><strong data-node-health-dup>—</strong></div>
  </div>

  <div class="node-health__footer">
    <span data-node-health-meta>local Bitnodes aggregate</span>
    <button class="zzx-widgets__btn" type="button" data-node-health-refresh>Refresh</button>
  </div>
</div>
