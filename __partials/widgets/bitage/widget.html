<!-- __partials/widgets/bitage/widget.html -->
<div class="btc-card bitage">
  <div class="bitage__header">
    <div>
      <div class="btc-card__title">BitAge · Block Cadence</div>
      <div class="bitage__eyebrow">recent interval statistics</div>
    </div>
    <span class="btc-card__status" data-bitage-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="bitage__hero">
    <span>mean interval</span>
    <strong data-bitage-mean>—</strong>
    <small data-bitage-sub>recent Bitcoin blocks</small>
  </div>

  <div class="bitage__metrics">
    <div><span>median interval</span><strong data-bitage-median>—</strong></div>
    <div><span>std deviation</span><strong data-bitage-std>—</strong></div>
    <div><span>projected blocks/day</span><strong data-bitage-day>—</strong></div>
    <div><span>vs 10m target</span><strong data-bitage-delta>—</strong></div>
  </div>

  <div class="bitage__footer">
    <span data-bitage-meta>—</span>
    <button class="zzx-widgets__btn" type="button" data-bitage-refresh>Refresh</button>
  </div>

  <div class="zzx-project-link"><a href="/projects/software/bitage/">BitAge project →</a></div>
</div>
