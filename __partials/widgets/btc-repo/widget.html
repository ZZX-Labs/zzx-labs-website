<!-- __partials/widgets/btc-repo/widget.html -->
<div class="btc-card btc-repo">
  <div class="btc-repo__header">
    <div>
      <div class="btc-card__title">Repo Updates</div>
      <div class="btc-repo__eyebrow">Bitcoin · BIPs · Lightning · LND</div>
    </div>
    <span class="btc-card__status" data-repo-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-repo__hero">
    <span>active repository</span>
    <strong data-repo-name>—</strong>
    <small data-repo-sub>loading repository activity…</small>
  </div>

  <div class="btc-repo__controls">
    <label>
      <span>repository</span>
      <select data-repo-select aria-label="Repository"></select>
    </label>
    <button class="zzx-widgets__btn" type="button" data-repo-next>Next repo</button>
    <button class="zzx-widgets__btn" type="button" data-repo-refresh>Refresh</button>
  </div>

  <div class="btc-repo__metrics">
    <div><span>stars</span><strong data-repo-stars>—</strong></div>
    <div><span>forks</span><strong data-repo-forks>—</strong></div>
    <div><span>open issues</span><strong data-repo-issues>—</strong></div>
    <div><span>default branch</span><strong data-repo-branch>—</strong></div>
  </div>

  <div class="btc-repo__release">
    <span>latest release</span>
    <a data-repo-release href="#" target="_blank" rel="noopener noreferrer">—</a>
  </div>

  <div class="btc-repo__list" data-repo-list></div>

  <div class="btc-repo__footer">
    <span data-repo-meta>GitHub public API · repository state + latest commits</span>
  </div>
</div>
