<!-- __partials/widgets/satoshi-quote/widget.html -->
<div class="btc-card satoshi-quote">
  <div class="satoshi-quote__header">
    <div>
      <div class="btc-card__title">Satoshi Quote</div>
      <div class="satoshi-quote__eyebrow">local archival corpus · forum · email · whitepaper</div>
    </div>

    <span
      class="btc-card__status"
      data-sq-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <blockquote class="satoshi-quote__quote">
    <span aria-hidden="true">“</span>
    <span data-sq-quote>—</span>
    <span aria-hidden="true">”</span>
  </blockquote>

  <div class="satoshi-quote__meta">
    <span data-sq-source>—</span>
    <span data-sq-date>—</span>
  </div>

  <div class="satoshi-quote__tags" data-sq-tags aria-label="Quote categories"></div>

  <div class="satoshi-quote__controls">
    <label>
      <span>source</span>
      <select data-sq-kind aria-label="Filter quote source">
        <option value="all">all sources</option>
        <option value="post">forum posts</option>
        <option value="email">emails</option>
        <option value="whitepaper">whitepaper</option>
      </select>
    </label>

    <label>
      <span>category</span>
      <select data-sq-category aria-label="Filter quote category">
        <option value="all">all categories</option>
      </select>
    </label>
  </div>

  <div class="satoshi-quote__actions">
    <button type="button" class="zzx-widgets__btn" data-sq-prev>Prev</button>
    <button type="button" class="zzx-widgets__btn" data-sq-next>Next</button>
    <button type="button" class="zzx-widgets__btn" data-sq-auto>Pause</button>

    <span class="satoshi-quote__spacer" aria-hidden="true"></span>

    <a
      class="satoshi-quote__source-link"
      data-sq-link
      href="https://satoshi.nakamotoinstitute.org/quotes/"
      target="_blank"
      rel="noopener noreferrer"
    >archive</a>
  </div>

  <div class="satoshi-quote__footer">
    <span data-sq-count>—</span>
    <span data-sq-rotation>45s rotation</span>
  </div>
</div>
