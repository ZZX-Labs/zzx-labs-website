<!-- __partials/widgets/volume-24h/widget.html -->
<div class="btc-card mini-history mini-history--volume-24h">
  <div class="mini-history__head">
    <div>
      <div class="mini-history__title">Volume · 24h</div>
      <div class="mini-history__eyebrow">interactive 24h BTC volume history</div>
    </div>
    <div class="mini-history__actions">
      <button type="button" class="zzx-widgets__btn" data-mini-refresh>Refresh</button>
      <button type="button" class="zzx-widgets__btn" data-mini-reset>Reset zoom</button>
    </div>
  </div>
  <div class="mini-history__stage">
    <canvas data-mini-canvas aria-label="Volume · 24h interactive chart"></canvas>
    <div class="mini-history__tooltip" data-mini-tooltip hidden></div>
  </div>
  <span class="mini-history__status" data-mini-status>history idle</span>
</div>
