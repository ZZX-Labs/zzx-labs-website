<!-- __partials/widgets/btc-gif/widget.html -->
<div class="btc-card btc-gif">
  <div class="btc-gif__header">
    <div>
      <div class="btc-card__title">BTC GIF</div>
      <div class="btc-gif__eyebrow">condition-driven Bitcoin GIF · no numeric overlay</div>
    </div>
    <span class="btc-card__status" data-gif-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-gif__state">
    <div>
      <span>trigger</span>
      <strong data-gif-condition>—</strong>
    </div>
    <div>
      <span>pool</span>
      <strong data-gif-pool>—</strong>
    </div>
    <div>
      <span>signals</span>
      <strong data-gif-signals>—</strong>
    </div>
  </div>

  <div class="btc-gif__stage">
    <canvas data-gif-canvas role="img" aria-label="Condition-driven Bitcoin GIF"></canvas>
    <img data-gif-image alt="" hidden>
  </div>

  <div class="btc-gif__meta">
    <span data-gif-name>—</span>
    <span data-gif-source>—</span>
  </div>

  <div class="btc-gif__controls">
    <button type="button" class="zzx-widgets__btn" data-gif-random>Random current condition</button>

    <label>
      <span>auto pool cycle</span>
      <select data-gif-auto aria-label="GIF condition-pool auto-cycle interval">
        <option value="0">off</option>
        <option value="15">15 sec</option>
        <option value="30" selected>30 sec</option>
        <option value="60">60 sec</option>
        <option value="300">5 min</option>
      </select>
    </label>

    <button type="button" class="zzx-widgets__btn" data-gif-refresh>Refresh signals</button>
  </div>

  <div class="btc-gif__footer">
    <span data-gif-updated>updated —</span>
    <span>widget-local GIF library</span>
  </div>
</div>
