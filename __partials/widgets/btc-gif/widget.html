<!-- __partials/widgets/btc-gif/widget.html -->
<div class="btc-card btc-gif">
  <div class="btc-gif__header">
    <div>
      <div class="btc-card__title">BTC GIF</div>
      <div class="btc-gif__eyebrow">animated market overlay · ZZX BPI</div>
    </div>
    <span class="btc-card__status" data-btcgif-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-gif__stage">
    <canvas data-btcgif-canvas role="img" aria-label="Animated Bitcoin GIF with live market overlay"></canvas>
    <img data-btcgif-image alt="" hidden>
  </div>

  <div class="btc-gif__meta">
    <span data-btcgif-name>—</span>
    <span data-btcgif-market>—</span>
  </div>

  <div class="btc-gif__controls">
    <button type="button" class="zzx-widgets__btn" data-btcgif-random>Random GIF</button>

    <label>
      <span>auto</span>
      <select data-btcgif-auto aria-label="GIF auto-cycle interval">
        <option value="0">off</option>
        <option value="30">30 sec</option>
        <option value="60">60 sec</option>
        <option value="300">5 min</option>
      </select>
    </label>

    <button type="button" class="zzx-widgets__btn" data-btcgif-refresh>Refresh price</button>
  </div>
</div>
