<!-- __partials/widgets/block-stats/widget.html -->
<div class="btc-card block-stats">
  <div class="block-stats__header">
    <div>
      <div class="btc-card__title">Recent Block Stats</div>
      <div class="block-stats__eyebrow">tip block + recent cadence</div>
    </div>
    <span class="btc-card__status" data-block-stats-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="block-stats__hero">
    <span>tip height</span>
    <strong data-block-stats-height>—</strong>
    <small data-block-stats-time>—</small>
  </div>

  <div class="block-stats__metrics">
    <div><span>transactions</span><strong data-block-stats-tx>—</strong></div>
    <div><span>weight / utilization</span><strong data-block-stats-weight>—</strong></div>
    <div><span>6-block mean interval</span><strong data-block-stats-interval>—</strong></div>
    <div><span>fees / avg fee rate</span><strong data-block-stats-fees>—</strong></div>
  </div>

  <div class="block-stats__footer">
    <span data-block-stats-meta>recent blocks</span>
    <button class="zzx-widgets__btn" type="button" data-block-stats-refresh>Refresh</button>
  </div>
</div>
