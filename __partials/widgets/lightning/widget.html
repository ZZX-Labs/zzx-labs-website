<!-- __partials/widgets/lightning/widget.html -->
<div class="btc-card lightning">
  <div class="lightning__header">
    <div>
      <div class="btc-card__title">Lightning</div>
      <div class="lightning__eyebrow">public network snapshot</div>
    </div>
    <span class="btc-card__status" data-ln-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="lightning__hero">
    <span>public channel capacity</span>
    <strong><span data-ln-capacity>—</span> BTC</strong>
    <small data-ln-sub>loading Lightning network statistics…</small>
  </div>

  <div class="lightning__metrics">
    <div><span>nodes</span><strong data-ln-nodes>—</strong></div>
    <div><span>channels</span><strong data-ln-channels>—</strong></div>
    <div><span>avg / channel</span><strong data-ln-avg-channel>—</strong></div>
    <div><span>mean channel degree</span><strong data-ln-degree>—</strong></div>
  </div>

  <div class="lightning__footer">
    <span data-ln-meta>configured mempool Lightning API</span>
    <button type="button" class="zzx-widgets__btn" data-ln-refresh>Refresh</button>
  </div>
</div>
