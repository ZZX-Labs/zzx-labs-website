<!-- __partials/widgets/difficulty-adjustment/widget.html -->
<div class="btc-card difficulty-adjustment">
  <div class="difficulty-adjustment__header">
    <div>
      <div class="btc-card__title">Difficulty Adjustment</div>
      <div class="difficulty-adjustment__eyebrow">Bitcoin 2,016-block retarget epoch</div>
    </div>
    <span class="btc-card__status" data-da-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="difficulty-adjustment__hero">
    <span>estimated adjustment</span>
    <strong data-da-change>—</strong>
    <small data-da-sub>mempool difficulty estimate</small>
  </div>

  <div class="difficulty-adjustment__progress">
    <div class="difficulty-adjustment__progress-meta">
      <span data-da-progress-label>epoch progress —</span>
      <span data-da-blocks>—</span>
    </div>
    <div class="difficulty-adjustment__track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-da-progress>
      <span data-da-bar></span>
    </div>
  </div>

  <div class="difficulty-adjustment__metrics">
    <div><span>blocks remaining</span><strong data-da-remaining>—</strong></div>
    <div><span>time remaining</span><strong data-da-time>—</strong></div>
    <div><span>estimated retarget</span><strong data-da-retarget>—</strong></div>
    <div><span>previous retarget</span><strong data-da-previous>—</strong></div>
  </div>

  <div class="difficulty-adjustment__footer">
    <span data-da-meta>configured mempool API</span>
    <button class="zzx-widgets__btn" type="button" data-da-refresh>Refresh</button>
  </div>
</div>
