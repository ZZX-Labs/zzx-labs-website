<!-- __partials/widgets/btc-burned/widget.html -->
<div class="btc-card btc-burned">
  <div class="btc-burned__header">
    <div>
      <div class="btc-card__title">Burned BTC</div>
      <div class="btc-burned__eyebrow">provable burns separated from claims</div>
    </div>
    <span
      class="btc-card__status"
      data-burn-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <div class="btc-burned__hero">
    <span>verified / provable total</span>
    <strong data-burn-total>—</strong>
    <small data-burn-total-sub>only verified records are counted</small>
  </div>

  <div class="btc-burned__metrics">
    <div>
      <span>verified records</span>
      <strong data-burn-verified>—</strong>
    </div>
    <div>
      <span>claimed / disputed</span>
      <strong data-burn-claimed>—</strong>
    </div>
    <div>
      <span>dataset records</span>
      <strong data-burn-count>—</strong>
    </div>
    <div>
      <span>updated</span>
      <strong data-burn-updated>—</strong>
    </div>
  </div>

  <div class="btc-burned__filters">
    <label>
      <span>show</span>
      <select data-burn-filter>
        <option value="verified">verified/provable</option>
        <option value="claims">claims/disputed</option>
        <option value="all">all records</option>
      </select>
    </label>

    <input
      data-burn-search
      type="search"
      placeholder="filter label / category / note"
      aria-label="Filter burned Bitcoin dataset"
    >
  </div>

  <div class="btc-burned__list" data-burn-list></div>

  <div class="btc-burned__pager">
    <button class="zzx-widgets__btn" type="button" data-burn-prev>Prev</button>
    <span data-burn-page>—</span>
    <button class="zzx-widgets__btn" type="button" data-burn-next>Next</button>
  </div>

  <div class="btc-burned__footer">
    <span data-burn-meta>local evidence dataset</span>
    <button class="zzx-widgets__btn" type="button" data-burn-refresh>Reload dataset</button>
  </div>

  <div class="btc-burned__note">
    Lost-key estimates and unverifiable claims are not treated as provably burned BTC.
  </div>
</div>
