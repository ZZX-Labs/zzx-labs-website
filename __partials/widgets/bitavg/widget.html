<!-- __partials/widgets/bitavg/widget.html -->
<div class="btc-card bitavg">
  <div class="bitavg__header">
    <div>
      <div class="btc-card__title">BitAvg · ZZX Global BPI</div>
      <div class="bitavg__eyebrow">volume-weighted exchange index</div>
    </div>
    <span class="btc-card__status" data-bitavg-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="bitavg__hero">
    <span>weighted BTC / USD</span>
    <strong data-bitavg-price>—</strong>
    <small data-bitavg-method>—</small>
  </div>

  <div class="bitavg__metrics">
    <div><span>included exchanges</span><strong data-bitavg-count>—</strong></div>
    <div><span>price spread</span><strong data-bitavg-spread>—</strong></div>
    <div><span>24h BTC volume</span><strong data-bitavg-volume>—</strong></div>
    <div><span>largest weight</span><strong data-bitavg-top>—</strong></div>
  </div>

  <div class="bitavg__table-wrap">
    <table class="bitavg__table">
      <thead>
        <tr><th>exchange</th><th>price</th><th>volume</th><th>weight</th><th>vs BPI</th></tr>
      </thead>
      <tbody data-bitavg-rows></tbody>
    </table>
  </div>

  <div class="bitavg__footer">
    <span data-bitavg-meta>—</span>
    <button type="button" class="zzx-widgets__btn" data-bitavg-refresh>Refresh</button>
  </div>

  <div class="zzx-project-link"><a href="/projects/software/bitavg/">BitAvg project →</a></div>
</div>
