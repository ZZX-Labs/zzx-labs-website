<!-- __partials/widgets/tip/widget.html -->
<div class="btc-card tip">
  <div class="tip__header">
    <div>
      <div class="btc-card__title">Tip</div>
      <div class="tip__eyebrow">current Bitcoin chain tip</div>
    </div>

    <span
      class="btc-card__status"
      data-tip-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <div class="tip__hero">
    <span>block height</span>
    <strong data-tip-height>—</strong>
    <small data-tip-sub>loading chain tip…</small>
  </div>

  <div class="tip__details">
    <div class="tip__row">
      <span>source</span>
      <strong data-tip-source>—</strong>
    </div>

    <div class="tip__row">
      <span>updated</span>
      <strong data-tip-updated>—</strong>
    </div>
  </div>

  <div class="tip__footer">
    <span data-tip-meta>live chain-tip height · 15s refresh</span>

    <button
      type="button"
      class="zzx-widgets__btn"
      data-tip-refresh
      aria-label="Refresh chain tip"
    >Refresh</button>
  </div>
</div>
