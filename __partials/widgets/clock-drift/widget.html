<!-- __partials/widgets/clock-drift/widget.html -->
<div class="btc-card clock-drift">
  <div class="clock-drift__header">
    <div>
      <div class="btc-card__title">Clock Drift</div>
      <div class="clock-drift__eyebrow">live block clock vs 10-minute target</div>
    </div>
    <span class="btc-card__status" data-clock-drift-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="clock-drift__hero">
    <span>current tip drift</span>
    <strong data-clock-drift-value>—</strong>
    <small data-clock-drift-sub>tip age − 10 minutes</small>
  </div>

  <div class="clock-drift__metrics">
    <div><span>tip age</span><strong data-clock-drift-age>—</strong></div>
    <div><span>last interval</span><strong data-clock-drift-last>—</strong></div>
    <div><span>rolling mean</span><strong data-clock-drift-mean>—</strong></div>
    <div><span>rolling median</span><strong data-clock-drift-median>—</strong></div>
  </div>

  <div class="clock-drift__footer">
    <span data-clock-drift-meta>recent Bitcoin block timestamps</span>
    <button class="zzx-widgets__btn" type="button" data-clock-drift-refresh>Refresh</button>
  </div>
</div>
