<div class="btc-card btc-mined">
  <div class="btc-mined__header">
    <div>
      <div class="btc-card__title">BTC Mined</div>
      <div class="btc-mined__eyebrow">consensus-issued supply through chain tip</div>
    </div>
    <span class="btc-card__status" data-mined-status data-status="offline" aria-live="polite">loading</span>
  </div>
  <div class="btc-mined__hero">
    <span>scheduled BTC issued</span>
    <strong data-mined-btc>—</strong>
    <small data-mined-percent>—</small>
  </div>
  <div class="btc-mined__metrics">
    <div><span>issued sats</span><strong data-mined-sats>—</strong></div>
    <div><span>chain height</span><strong data-mined-height>—</strong></div>
    <div><span>current subsidy</span><strong data-mined-subsidy>—</strong></div>
    <div><span>subsidy era</span><strong data-mined-era>—</strong></div>
    <div><span>next halving</span><strong data-mined-halving>—</strong></div>
    <div><span>blocks to halving</span><strong data-mined-halving-blocks>—</strong></div>
    <div><span>terminal supply</span><strong data-mined-terminal>—</strong></div>
    <div><span>remaining</span><strong data-mined-remaining>—</strong></div>
  </div>
  <div class="btc-mined__footer">
    <span data-mined-meta>coinbase subsidy schedule only; fees do not create BTC</span>
    <button type="button" class="zzx-widgets__btn" data-mined-refresh>Refresh</button>
  </div>
</div>
