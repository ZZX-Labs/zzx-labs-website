<!-- __partials/widgets/btc-prs/widget.html -->
<div class="btc-card btc-prs btc-prs--ledger" data-widget-root="btc-prs">
  <header class="btc-prs__topline">
    <div class="btc-prs__identity">
      <span class="btc-prs__kicker">GITHUB / BITCOIN CORE</span>
      <div class="btc-card__title">Pull Requests</div>
      <a class="btc-prs__repo" href="https://github.com/bitcoin/bitcoin/pulls" target="_blank" rel="noopener noreferrer">bitcoin / bitcoin</a>
    </div>
    <span class="btc-card__status" data-btc-prs-status data-status="offline">loading</span>
  </header>

  <div class="btc-prs__activity">
    <div><span>OPEN</span><strong data-btc-prs-open>—</strong></div>
    <div><span>MERGED</span><strong data-btc-prs-merged>—</strong></div>
    <div><span>CLOSED</span><strong data-btc-prs-closed>—</strong></div>
    <div><span>UPDATED / 24H</span><strong data-btc-prs-24h>—</strong></div>
  </div>

  <div class="btc-prs__toolbar">
    <input type="search" data-btc-prs-search placeholder="FILTER # / TITLE / AUTHOR / BRANCH" aria-label="Filter pull requests" autocomplete="off" spellcheck="false">
    <select data-btc-prs-filter aria-label="Filter pull request state">
      <option value="all">All activity</option>
      <option value="open">Open</option>
      <option value="merged">Merged</option>
      <option value="closed">Closed</option>
    </select>
  </div>

  <div class="btc-prs__readout-head">
    <span>RECENT ACTIVITY</span>
    <strong data-btc-prs-visible>—</strong>
  </div>

  <div class="btc-prs__scroll" data-btc-prs-scroll>
    <div class="btc-prs__list" data-btc-prs-list></div>
  </div>

  <footer class="btc-prs__footer">
    <span data-btc-prs-source>source —</span>
    <button type="button" class="zzx-widgets__btn" data-btc-prs-refresh>REFRESH</button>
  </footer>
</div>
