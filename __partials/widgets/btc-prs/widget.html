<!-- __partials/widgets/btc-prs/widget.html -->
<div class="btc-card btc-prs" data-widget-root="btc-prs">
  <div class="btc-prs__head">
    <div>
      <div class="btc-card__title">Bitcoin Core Pull Requests</div>
      <div class="btc-prs__eyebrow">github.com/bitcoin/bitcoin · pull-request activity</div>
    </div>
    <span class="btc-card__status" data-btc-prs-status data-status="offline">loading</span>
  </div>

  <div class="btc-prs__metrics">
    <div><span>open in feed</span><strong data-btc-prs-open>—</strong></div>
    <div><span>merged in feed</span><strong data-btc-prs-merged>—</strong></div>
    <div><span>closed in feed</span><strong data-btc-prs-closed>—</strong></div>
    <div><span>updated 24h</span><strong data-btc-prs-24h>—</strong></div>
  </div>

  <div class="btc-prs__controls">
    <input type="search" data-btc-prs-search placeholder="filter PR / author / branch" aria-label="Filter pull requests" autocomplete="off" spellcheck="false">
    <select data-btc-prs-filter aria-label="Filter pull request state">
      <option value="all">All activity</option>
      <option value="open">Open</option>
      <option value="merged">Merged</option>
      <option value="closed">Closed</option>
    </select>
  </div>

  <div class="btc-prs__readout-head">
    <span>recent pull-request activity</span>
    <strong data-btc-prs-visible>—</strong>
  </div>

  <div class="btc-prs__scroll" data-btc-prs-scroll>
    <div class="btc-prs__list" data-btc-prs-list></div>
  </div>

  <div class="btc-prs__footer">
    <span data-btc-prs-source>source —</span>
    <button type="button" class="zzx-widgets__btn" data-btc-prs-refresh>Refresh</button>
  </div>
</div>
