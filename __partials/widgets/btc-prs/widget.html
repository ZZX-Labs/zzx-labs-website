
<!-- __partials/widgets/btc-prs/widget.html -->
<div class="btc-card btc-prs" data-widget-root="btc-prs">
  <div class="btc-prs__header">
    <div>
      <div class="btc-card__title">BTC Pull Requests</div>
      <div class="btc-prs__eyebrow">Bitcoin Core · bitcoin/bitcoin</div>
    </div>
    <span class="btc-card__status" data-btc-prs-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="btc-prs__hero">
    <span>latest pull request</span>
    <a data-btc-prs-latest-link href="https://github.com/bitcoin/bitcoin/pulls" target="_blank" rel="noopener noreferrer">
      <strong data-btc-prs-latest>—</strong>
    </a>
    <small data-btc-prs-latest-meta>loading pull-request activity…</small>
  </div>

  <div class="btc-prs__controls">
    <label>
      <span>search</span>
      <input type="search" data-btc-prs-search placeholder="PR / title / author / branch" aria-label="Filter pull requests" autocomplete="off" spellcheck="false">
    </label>

    <label>
      <span>state</span>
      <select data-btc-prs-filter aria-label="Pull request state">
        <option value="all">all activity</option>
        <option value="open">open</option>
        <option value="merged">merged</option>
        <option value="closed">closed</option>
      </select>
    </label>

    <button class="zzx-widgets__btn" type="button" data-btc-prs-refresh>Refresh</button>
  </div>

  <div class="btc-prs__metrics">
    <div><span>open</span><strong data-btc-prs-open>—</strong></div>
    <div><span>merged</span><strong data-btc-prs-merged>—</strong></div>
    <div><span>closed</span><strong data-btc-prs-closed>—</strong></div>
    <div><span>updated 24h</span><strong data-btc-prs-24h>—</strong></div>
  </div>

  <div class="btc-prs__meta-line">
    <span data-btc-prs-visible>—</span>
    <span>pull-request feed</span>
  </div>

  <div class="btc-prs__list" data-btc-prs-scroll>
    <div data-btc-prs-list></div>
  </div>

  <div class="btc-prs__footer">
    <span data-btc-prs-source>Bitcoin Core first-party activity mirror</span>
  </div>
</div>
