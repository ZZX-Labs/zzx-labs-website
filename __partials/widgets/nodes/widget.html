<!-- __partials/widgets/nodes/widget.html -->
<div class="btc-card nodes">
  <div class="nodes__header">
    <div>
      <div class="btc-card__title">Bitcoin Nodes</div>
      <div class="nodes__eyebrow">reachable network snapshot · btcnodes.io mirror chain</div>
    </div>

    <span
      class="btc-card__status"
      data-nodes-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <div class="nodes__hero">
    <span>reachable nodes</span>
    <strong data-nodes-total>—</strong>
    <small data-nodes-sub>loading node snapshot…</small>
  </div>

  <div class="nodes__metrics">
    <div><span>latest height</span><strong data-nodes-height>—</strong></div>
    <div><span>Tor / Onion</span><strong data-nodes-tor>—</strong></div>
    <div><span>IPv4</span><strong data-nodes-ipv4>—</strong></div>
    <div><span>IPv6</span><strong data-nodes-ipv6>—</strong></div>
  </div>

  <div class="nodes__chart">
    <div class="nodes__chart-head">
      <span>reachable-node history</span>
      <span data-nodes-history>—</span>
    </div>
    <canvas
      data-nodes-canvas
      aria-label="Reachable Bitcoin node history"
    ></canvas>
  </div>

  <div class="nodes__details">
    <div class="nodes__row">
      <span>other / hidden network</span>
      <strong data-nodes-other>—</strong>
    </div>
    <div class="nodes__row">
      <span>snapshot age</span>
      <strong data-nodes-age>—</strong>
    </div>
    <div class="nodes__row">
      <span>updated</span>
      <strong data-nodes-updated>—</strong>
    </div>
    <div class="nodes__row">
      <span>source</span>
      <strong data-nodes-source>—</strong>
    </div>
  </div>

  <div class="nodes__footer">
    <span data-nodes-meta>local ZZX mirror preferred · btcnodes.io public fallback</span>
    <button
      type="button"
      class="zzx-widgets__btn"
      data-nodes-refresh
    >Refresh</button>
  </div>
</div>
