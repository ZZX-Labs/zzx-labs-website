<!-- __partials/widgets/bittrackit/widget.html -->
<div class="btc-card bittrackit">
  <div class="bittrackit__header">
    <div>
      <div class="btc-card__title">BitTrackIt · Address Snapshot</div>
      <div class="bittrackit__eyebrow">public Bitcoin address state</div>
    </div>
    <span class="btc-card__status" data-bittrackit-status data-status="offline" aria-live="polite">ready</span>
  </div>

  <form class="bittrackit__search" data-bittrackit-form>
    <input data-bittrackit-address type="text" autocomplete="off" spellcheck="false" placeholder="bc1… / 1… / 3…" aria-label="Bitcoin address">
    <button class="zzx-widgets__btn" type="submit">Lookup</button>
  </form>

  <div class="bittrackit__hero">
    <span>total balance incl. mempool delta</span>
    <strong data-bittrackit-balance>—</strong>
    <small data-bittrackit-sub>address is queried only when you submit</small>
  </div>

  <div class="bittrackit__metrics">
    <div><span>confirmed TXs</span><strong data-bittrackit-tx>—</strong></div>
    <div><span>mempool TXs</span><strong data-bittrackit-mtx>—</strong></div>
    <div><span>pending delta</span><strong data-bittrackit-pending>—</strong></div>
    <div><span>total funded</span><strong data-bittrackit-funded>—</strong></div>
  </div>

  <div class="bittrackit__footer">
    <span data-bittrackit-meta>not stored by widget</span>
    <a class="zzx-widgets__btn" data-bittrackit-external href="https://mempool.space/" target="_blank" rel="noopener noreferrer">Open explorer</a>
  </div>

  <div class="zzx-project-link"><a href="/projects/software/bittrackit/">BitTrackIt project →</a></div>
</div>
