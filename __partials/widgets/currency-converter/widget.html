<!-- __partials/widgets/currency-converter/widget.html -->
<div class="btc-card currency-converter">
  <div class="currency-converter__header">
    <div>
      <div class="btc-card__title">Currency Converter</div>
      <div class="currency-converter__eyebrow">154 fiat currencies + BTC</div>
    </div>
    <span class="btc-card__status" data-cc-status data-status="offline" aria-live="polite">loading</span>
  </div>

  <div class="currency-converter__hero">
    <span class="currency-converter__hero-label">converted value</span>
    <strong data-cc-output>—</strong>
    <span class="currency-converter__rate" data-cc-rate>—</span>
  </div>

  <div class="currency-converter__controls">
    <label>
      <span>amount</span>
      <input data-cc-amount type="number" inputmode="decimal" step="any" min="0" value="1" aria-label="Amount">
    </label>

    <label>
      <span>from</span>
      <select data-cc-from aria-label="From currency"></select>
    </label>

    <button type="button" class="zzx-widgets__btn currency-converter__swap" data-cc-swap aria-label="Swap currencies">⇄</button>

    <label>
      <span>to</span>
      <select data-cc-to aria-label="To currency"></select>
    </label>
  </div>

  <div class="currency-converter__footer">
    <span data-cc-meta>ZZX BPI / FX provider chain</span>
    <button type="button" class="zzx-widgets__btn" data-cc-refresh>Refresh rates</button>
  </div>
</div>
