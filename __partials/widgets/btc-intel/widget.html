<!-- __partials/widgets/btc-intel/widget.html -->
<div class="btc-card btc-intel">
  <div class="btc-intel__header">
    <div>
      <div class="btc-card__title">BTC Intel</div>
      <div class="btc-intel__eyebrow">protocol · Lightning · engineering · discussion</div>
    </div>
    <span
      class="btc-card__status"
      data-btc-intel-status
      data-status="offline"
      aria-live="polite"
    >loading</span>
  </div>

  <div class="btc-intel__hero">
    <span>Bitcoin network snapshot</span>
    <strong data-btc-intel-hero>—</strong>
    <small data-btc-intel-sub>—</small>
  </div>

  <div class="btc-intel__metrics">
    <div>
      <span>BTC / USD</span>
      <strong data-btc-intel-price>—</strong>
    </div>
    <div>
      <span>24h range</span>
      <strong data-btc-intel-range>—</strong>
    </div>
    <div>
      <span>feed items</span>
      <strong data-btc-intel-count>—</strong>
    </div>
    <div>
      <span>sources live</span>
      <strong data-btc-intel-sources>—</strong>
    </div>
  </div>

  <div class="btc-intel__controls">
    <label>
      <span>view</span>
      <select data-btc-intel-filter aria-label="BTC Intel source filter">
        <option value="all">all intelligence</option>
        <option value="protocol">Bitcoin Core / BIPs</option>
        <option value="lightning">Lightning / BOLTs / LND</option>
        <option value="discussion">community discussion</option>
      </select>
    </label>

    <button class="zzx-widgets__btn" type="button" data-btc-intel-rotate>Next source</button>
    <button class="zzx-widgets__btn" type="button" data-btc-intel-refresh>Refresh</button>
  </div>

  <div class="btc-intel__source-line">
    <span data-btc-intel-active-source>all sources</span>
    <span data-btc-intel-age>—</span>
  </div>

  <div class="btc-intel__list" data-btc-intel-list></div>

  <div class="btc-intel__footer">
    <span data-btc-intel-meta>local market snapshot + public engineering/discussion feeds</span>
  </div>

  <div class="zzx-project-link btc-intel__projects">
    <a href="/projects/software/aipdabe/">AIPDABE</a>
    <span>·</span>
    <a href="/projects/software/bitcoinscope/">BitcoinScope</a>
  </div>
</div>
