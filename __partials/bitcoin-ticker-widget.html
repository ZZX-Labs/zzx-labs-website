<!-- __partials/bitcoin-ticker-widget.html -->
<!-- ZZX-Labs Bitcoin HUD wrapper. Manifest IDs map 1:1 to data-widget slots. -->
<!-- Additive contract: existing slots are never silently renamed or removed. -->

<div class="zzx-hud-handle" data-hud-handle aria-hidden="true">
  <button type="button" class="zzx-hud-show" data-hud-show aria-label="Show Bitcoin HUD">HUD</button>
</div>

<div
  class="btc-rail"
  id="btc-rail"
  data-hud-root
  data-hud-state="full"
  role="region"
  aria-label="Bitcoin dashboard widgets">

  <!-- priority 0: Ticker -->
  <div class="btc-slot" data-widget="bitcoin-ticker"></div>

  <!-- priority 1: Currency Converter -->
  <div class="btc-slot" data-widget="currency-converter"></div>

  <!-- priority 2: Live BTC GIF -->
  <div class="btc-slot" data-widget="btc-gif"></div>

  <!-- priority 3: BitAvg -->
  <div class="btc-slot" data-widget="bitavg"></div>

  <!-- priority 4: BitBilling -->
  <div class="btc-slot" data-widget="bitbilling"></div>

  <!-- priority 5: I-Ching -->
  <div class="btc-slot" data-widget="iching"></div>

  <!-- priority 10: 24h Price -->
  <div class="btc-slot" data-widget="price-24h"></div>

  <!-- priority 11: 24h Volume -->
  <div class="btc-slot" data-widget="volume-24h"></div>

  <!-- priority 20: 24h High/Low -->
  <div class="btc-slot" data-widget="high-low-24h"></div>

  <!-- priority 21: Mining Pools/Miners -->
  <div class="btc-slot" data-widget="mining-rewards"></div>

  <!-- priority 30: Hashrate -->
  <div class="btc-slot" data-widget="hashrate"></div>

  <!-- priority 31: Hashrate by Nation -->
  <div class="btc-slot" data-widget="hashrate-by-nation"></div>

  <!-- priority 32: Difficulty Adjustment -->

  <!-- priority 40: Nodes -->
  <div class="btc-slot" data-widget="nodes"></div>

  <!-- priority 41: Nodes by Nation -->
  <div class="btc-slot" data-widget="nodes-by-nation"></div>

  <!-- priority 42: Nodes by City -->
  <div class="btc-slot" data-widget="nodes-by-city"></div>

  <!-- priority 43: Nodes by Version -->
  <div class="btc-slot" data-widget="nodes-by-version"></div>

  <!-- priority 44: Knots vs Core Nodes -->
  <div class="btc-slot" data-widget="knots-vs-core"></div>

  <!-- priority 45: Node Network Mix -->
  <div class="btc-slot" data-widget="node-network-mix"></div>

  <!-- priority 46: Node Latency -->
  <div class="btc-slot" data-widget="node-latency"></div>

  <!-- priority 47: Node Health -->
  <div class="btc-slot" data-widget="node-health"></div>

  <!-- priority 50: Fees -->

  <!-- priority 51: Mempool -->

  <!-- priority 52: Mempool Specs -->

  <!-- priority 53: TheMarketBTCCreated -->

  <!-- priority 54: Deadopop -->

  <!-- priority 60: Lightning -->
  <div class="btc-slot" data-widget="lightning"></div>

  <!-- priority 61: LN Detail -->
  <div class="btc-slot" data-widget="lightning-detail"></div>

  <!-- priority 70: Block Clock -->
  <div class="btc-slot" data-widget="block-clock"></div>

  <!-- priority 71: Tip -->
  <div class="btc-slot" data-widget="tip"></div>

  <!-- priority 72: Drift -->
  <div class="btc-slot" data-widget="drift"></div>

  <!-- priority 73: Clock Drift -->

  <!-- priority 83 disabled: Repo Commit Updates -->

  <!-- priority 84: Bitcoin News -->

  <!-- priority 90: Satoshi Quote -->

  <!-- priority 140: BitRNG -->

</div>
