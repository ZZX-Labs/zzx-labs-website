name: ZZX World Factbook Frontend Validation
on:
  workflow_dispatch:
  push:
    paths: ['worldfactbook/**', 'tools/worldfactbook/**', 'tests/**', '.github/workflows/zzx-worldfactbook*.yml']
  pull_request:
    paths: ['worldfactbook/**', 'tools/worldfactbook/**', 'tests/**', '.github/workflows/zzx-worldfactbook*.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y python3-pil python3-fitz
      - name: Check source and deterministic runtime behavior
        run: |
          python3 -m compileall -q tools/worldfactbook
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/worldfactbook_parser_selftest.py
          python3 tests/worldfactbook_workflow_selftest.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path("worldfactbook").rglob("*.js"):
              subprocess.run(["node","--check",str(path)],check=True)
          PY
          node tests/worldfactbook_runtime_selftest.js
