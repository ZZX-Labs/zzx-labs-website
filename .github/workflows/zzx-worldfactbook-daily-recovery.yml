name: ZZX World Factbook Daily Refresh
on:
  workflow_dispatch:
    inputs:
      start_year: {type: number, default: 1994}
      end_year: {type: number, default: 2026}
  schedule:
    - cron: '57 6 * * *'
permissions:
  contents: write
jobs:
  archive:
    uses: ./.github/workflows/zzx-worldfactbook-archive-sync.yml
    with:
      start_year: ${{ inputs.start_year || 1994 }}
      end_year: ${{ inputs.end_year || 2026 }}
      kind: daily
    secrets: inherit
