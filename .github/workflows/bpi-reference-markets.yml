name: Update BPI Reference Markets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpi-hourly-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  update-reference-markets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate reference-market updater
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/bpi/reference_updater.py \
            tools/bpi/collector.py
          python -m json.tool \
            __partials/widgets/bitcoin-ticker/reference-catalog.json \
            >/dev/null
          python -m json.tool \
            bitcoin/bpi/api/commodity_source_urls.json \
            >/dev/null
          python -m json.tool \
            bitcoin/bpi/api/reference_market_source_policy.json \
            >/dev/null

      - name: Update public reference markets
        shell: bash
        run: |
          set -euo pipefail
          python tools/bpi/reference_updater.py \
            --references-only

      - name: Validate generated reference contracts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          catalog_path = Path(
              "__partials/widgets/bitcoin-ticker/reference-catalog.json"
          )
          prices_path = Path(
              "bitcoin/bpi/api/reference_prices.json"
          )

          catalog = json.loads(
              catalog_path.read_text(encoding="utf-8")
          )
          prices = json.loads(
              prices_path.read_text(encoding="utf-8")
          )

          national = json.loads(
              Path(
                  "bitcoin/bpi/api/reference_national_averages.json"
              ).read_text(encoding="utf-8")
          )

          pages = catalog.get("pages")
          items = catalog.get("items")
          values = prices.get("prices")
          national_countries = national.get("countries")

          if not isinstance(pages, list) or len(pages) != 16:
              raise SystemExit(
                  "reference catalog must contain exactly 16 pages"
              )

          if not isinstance(items, list) or len(items) < 100:
              raise SystemExit(
                  "reference catalog is unexpectedly small"
              )

          page_ids = {
              str(page.get("id") or "")
              for page in pages
              if isinstance(page, dict)
          }

          for index, item in enumerate(items):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"reference item {index} is not an object"
                  )

              if item.get("page") not in page_ids:
                  raise SystemExit(
                      f"reference item {item.get('id')} has invalid page"
                  )

          if not isinstance(values, dict):
              raise SystemExit(
                  "reference_prices.json prices must be an object"
              )

          for item_id, row in values.items():
              if not isinstance(row, dict):
                  raise SystemExit(
                      f"reference price {item_id} must be an object"
                  )

              value = float(row.get("usd"))

              if not math.isfinite(value) or value <= 0:
                  raise SystemExit(
                      f"invalid reference price for {item_id}: {value}"
                  )

          if not isinstance(national_countries, dict):
              raise SystemExit(
                  "reference_national_averages.json countries must be an object"
              )

          for country_code, country in national_countries.items():
              if not isinstance(country, dict):
                  raise SystemExit(
                      f"national reference country {country_code} must be an object"
                  )

              item_rows = country.get("items")

              if not isinstance(item_rows, dict):
                  raise SystemExit(
                      f"national reference country {country_code} items must be an object"
                  )

              for item_id, row in item_rows.items():
                  if item_id not in {
                      str(item.get("id"))
                      for item in items
                      if isinstance(item, dict)
                  }:
                      raise SystemExit(
                          f"unknown national reference item {item_id}"
                      )

                  value = float(
                      row.get("national_average_usd")
                  )

                  if not math.isfinite(value) or value <= 0:
                      raise SystemExit(
                          f"invalid national average {country_code}/{item_id}"
                      )

                  if int(row.get("sample_count") or 0) < 1:
                      raise SystemExit(
                          f"national average {country_code}/{item_id} has no samples"
                      )

          print(
              "Reference contracts valid: "
              f"pages={len(pages)} "
              f"items={len(items)} "
              f"global_priced={len(values)} "
              f"national_countries={len(national_countries)}"
          )
          PY

      - name: Publish generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"
          python tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update BPI reference markets" \
            --path bitcoin/bpi/api/commodities.json \
            --path bitcoin/bpi/api/reference_prices.json \
            --attempts 5 \
            --sleep-seconds 5
