name: Update BPI Exchange Rates

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: bpi-exchange-rates
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  update-exchange-rates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate exchange-rate updater inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bpi/update_exchange_rates.py
          python -m py_compile \
            tools/bpi/update_exchange_rates.py

          for file in \
            bitcoin/bpi/api/currencies.json \
            bitcoin/bpi/api/exchange_rates.json \
            bitcoin/bpi/api/fx_source_urls.json
          do
            if [[ -f "${file}" ]]; then
              python -m json.tool "${file}" >/dev/null
            fi
          done

      - name: Update exchange rates
        shell: bash
        run: |
          set -euo pipefail
          python tools/bpi/update_exchange_rates.py

      - name: Validate generated exchange-rate contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          api = Path("bitcoin/bpi/api")
          path = api / "exchange_rates.json"

          if not path.is_file():
              raise SystemExit(
                  f"generated file missing: {path}"
              )

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"invalid JSON in {path}: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "exchange_rates.json must be an object"
              )

          rates = data.get("rates")

          if not isinstance(rates, dict):
              raise SystemExit(
                  "exchange_rates.json must contain a rates object"
              )

          if "USD" not in rates:
              raise SystemExit(
                  "exchange_rates.json is missing USD"
              )

          valid_rates = 0

          for code, value in rates.items():
              if not re.fullmatch(r"[A-Z]{3}", str(code)):
                  raise SystemExit(
                      f"invalid fiat currency code: {code!r}"
                  )

              try:
                  rate = float(value)
              except (TypeError, ValueError):
                  raise SystemExit(
                      f"invalid rate for {code}: {value!r}"
                  )

              if not math.isfinite(rate) or rate <= 0:
                  raise SystemExit(
                      f"non-positive/non-finite rate "
                      f"for {code}: {rate}"
                  )

              valid_rates += 1

          usd = float(rates["USD"])

          if abs(usd - 1.0) > 0.000001:
              raise SystemExit(
                  f"USD base rate must equal 1, got {usd}"
              )

          if valid_rates < 5:
              raise SystemExit(
                  "refusing exchange-rate dataset "
                  f"with only {valid_rates} valid rates"
              )

          currencies_path = api / "currencies.json"

          if currencies_path.exists():
              currencies = json.loads(
                  currencies_path.read_text(encoding="utf-8")
              )

              if isinstance(currencies, dict):
                  order = currencies.get("order")

                  if isinstance(order, list):
                      available = {
                          str(code)
                          for code in order
                          if re.fullmatch(
                              r"[A-Z]{3}",
                              str(code)
                          )
                      }

                      if "USD" not in available:
                          raise SystemExit(
                              "currencies.json order is missing USD"
                          )

                      overlap = available.intersection(rates)

                      if len(overlap) < 5:
                          raise SystemExit(
                              "too little overlap between "
                              "currencies.json and exchange_rates.json: "
                              f"{len(overlap)}"
                          )

          updated_at = data.get("updated_at")

          if updated_at:
              try:
                  stamp = datetime.fromisoformat(
                      str(updated_at).replace("Z", "+00:00")
                  )
              except ValueError:
                  raise SystemExit(
                      f"invalid exchange_rates.updated_at: "
                      f"{updated_at!r}"
                  )

              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)

              age = (
                  datetime.now(timezone.utc)
                  - stamp.astimezone(timezone.utc)
              ).total_seconds()

              if age < -300:
                  raise SystemExit(
                      "exchange-rate updated_at is in "
                      f"the future: {age}s"
                  )

              if age > 7200:
                  raise SystemExit(
                      "generated exchange rates are unexpectedly stale: "
                      f"{age:.0f}s"
                  )

          print(
              "Exchange-rate contract valid: "
              f"{valid_rates} rates"
          )
          PY

      - name: Commit and push exchange rates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          git add -- \
            bitcoin/bpi/api/exchange_rates.json

          if git diff --cached --quiet; then
            printf '%s\n' \
              "No BPI exchange-rate changes."
            exit 0
          fi

          git commit \
            -m "Update BPI exchange rates"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && \
               git push origin HEAD:main; then
              printf '%s\n' \
                "BPI exchange rates pushed."
              exit 0
            fi

            git rebase --abort || true

            printf '%s\n' \
              "BPI exchange-rate push attempt ${attempt} failed; retrying without force."

            sleep 5
          done

          printf '%s\n' \
            "Failed to push BPI exchange rates without rewriting main."

          exit 1
