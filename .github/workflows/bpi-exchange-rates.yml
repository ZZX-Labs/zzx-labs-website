name: Update BPI Exchange Rates

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: bpi-exchange-rates
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-exchange-rates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Set up Python (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              fetched=1
              break
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying."
            sleep "$(( attempt * 3 ))"
          done
          test "${fetched}" = "1"
          git reset --hard origin/main

      - name: Validate exchange-rate updater inputs
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bpi/update_exchange_rates.py
          test -f tools/bpi/bpi_git_publish.py

          python3 -m py_compile \
            tools/bpi/update_exchange_rates.py \
            tools/bpi/bpi_git_publish.py

          for file in \
            bitcoin/bpi/api/currencies.json \
            bitcoin/bpi/api/exchange_rates.json \
            bitcoin/bpi/api/fx_source_urls.json
          do
            if [[ -f "${file}" ]]; then
              python3 -m json.tool "${file}" >/dev/null
            fi
          done

      - name: Update exchange rates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpi/update_exchange_rates.py

      - name: Validate generated exchange-rate contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          api = Path("bitcoin/bpi/api")
          path = api / "exchange_rates.json"

          if not path.is_file():
              raise SystemExit(
                  f"generated file missing: {path}"
              )

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  f"invalid JSON in {path}: {exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "exchange_rates.json must be an object"
              )

          rates = data.get("rates")

          if not isinstance(rates, dict):
              raise SystemExit(
                  "exchange_rates.json must contain a rates object"
              )

          if "USD" not in rates:
              raise SystemExit(
                  "exchange_rates.json is missing USD"
              )

          valid_rates = 0

          for code, value in rates.items():
              if not re.fullmatch(r"[A-Z]{3}", str(code)):
                  raise SystemExit(
                      f"invalid fiat currency code: {code!r}"
                  )

              try:
                  rate = float(value)
              except (TypeError, ValueError):
                  raise SystemExit(
                      f"invalid rate for {code}: {value!r}"
                  )

              if not math.isfinite(rate) or rate <= 0:
                  raise SystemExit(
                      f"non-positive/non-finite rate "
                      f"for {code}: {rate}"
                  )

              valid_rates += 1

          usd = float(rates["USD"])

          if abs(usd - 1.0) > 0.000001:
              raise SystemExit(
                  f"USD base rate must equal 1, got {usd}"
              )

          if valid_rates < 5:
              raise SystemExit(
                  "refusing exchange-rate dataset "
                  f"with only {valid_rates} valid rates"
              )

          currencies_path = api / "currencies.json"

          if currencies_path.exists():
              currencies = json.loads(
                  currencies_path.read_text(encoding="utf-8")
              )

              if isinstance(currencies, dict):
                  order = currencies.get("order")

                  if isinstance(order, list):
                      available = {
                          str(code)
                          for code in order
                          if re.fullmatch(
                              r"[A-Z]{3}",
                              str(code)
                          )
                      }

                      if "USD" not in available:
                          raise SystemExit(
                              "currencies.json order is missing USD"
                          )

                      overlap = available.intersection(rates)

                      if len(overlap) < 5:
                          raise SystemExit(
                              "too little overlap between "
                              "currencies.json and exchange_rates.json: "
                              f"{len(overlap)}"
                          )

          updated_at = data.get("updated_at")

          if updated_at:
              try:
                  stamp = datetime.fromisoformat(
                      str(updated_at).replace("Z", "+00:00")
                  )
              except ValueError:
                  raise SystemExit(
                      f"invalid exchange_rates.updated_at: "
                      f"{updated_at!r}"
                  )

              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)

              age = (
                  datetime.now(timezone.utc)
                  - stamp.astimezone(timezone.utc)
              ).total_seconds()

              if age < -300:
                  raise SystemExit(
                      "exchange-rate updated_at is in "
                      f"the future: {age}s"
                  )

              if age > 7200:
                  raise SystemExit(
                      "generated exchange rates are unexpectedly stale: "
                      f"{age:.0f}s"
                  )

          print(
              "Exchange-rate contract valid: "
              f"{valid_rates} rates"
          )
          PY

      - name: Publish exchange rates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update BPI exchange rates" \
            --path bitcoin/bpi/api/exchange_rates.json \
            --attempts 5 \
            --sleep-seconds 5
