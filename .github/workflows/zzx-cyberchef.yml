name: ZZX-CyberChef

run-name: >-
  ZZX-CyberChef / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  schedule:
    - cron: "17 */12 * * *"

  workflow_dispatch:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Deploy the validated site to GitHub Pages"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or explicit version/tag"
        required: false
        type: string
        default: "latest"
      deploy_pages:
        description: "Deploy the validated site to GitHub Pages"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: zzx-cyberchef-controller
  cancel-in-progress: false

jobs:
  local_frontends:
    name: Preserve ZZX CyberChef Page + Install Latest Native Runtime
    uses: ./.github/workflows/cyberchef-instance.yml
    with:
      cyberchef_version: ${{ inputs.cyberchef_version || 'latest' }}
      deploy_pages: ${{ github.event_name == 'schedule' || inputs.deploy_pages }}
