name: ZZX-CyberChef v19

run-name: >-
  ZZX-CyberChef v19 / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  schedule:
    - cron: "17 */12 * * *"

  workflow_dispatch:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Publish generated /cyberchef/app/ to the current website branch"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: zzx-cyberchef-controller-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local_frontends:
    name: Update Local CyberChef Runtime v19
    uses: ./.github/workflows/cyberchef-instance.yml
    with:
      cyberchef_version: ${{ inputs.cyberchef_version || 'latest' }}
      deploy_pages: ${{ github.event_name == 'schedule' || inputs.deploy_pages }}
