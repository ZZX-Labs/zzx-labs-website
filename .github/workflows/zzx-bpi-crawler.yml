name: ZZX-BPI Crawler

run-name: >-
  ZZX-BPI Crawler / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  schedule:
    # GitHub-hosted continuity/checkpoint tier. Each collector runs for longer
    # than the five-minute launch cadence so adjacent runs overlap instead of
    # creating deliberate acquisition holes. The resident systemd service is
    # still the authoritative 2.5-second 24/7 collector.
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      capture_seconds:
        description: "Overlapping live BTC price/volume capture window"
        required: false
        default: "330"
        type: string
      poll_cycle_ms:
        description: "GitHub fallback poll cycle in ms; must be 2500-5000"
        required: false
        default: "2500"
        type: string
      run_archive_checkpoint:
        description: "Also run the legacy full archive/reference checkpoint"
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      capture_seconds:
        required: false
        type: string
        default: "330"
      poll_cycle_ms:
        required: false
        type: string
        default: "2500"
      run_archive_checkpoint:
        required: false
        type: boolean
        default: false
    secrets:
      BPI_MARIADB_HOST:
        required: false
      BPI_MARIADB_PORT:
        required: false
      BPI_MARIADB_USER:
        required: false
      BPI_MARIADB_PASSWORD:
        required: false
      BPI_MARIADB_DATABASE:
        required: false
      BPI_BACKUP_REPO:
        required: false
      BPI_BACKUP_TOKEN:
        required: false

permissions:
  contents: write

# Deliberately no workflow-level concurrency lock: overlapping collectors are
# the continuity mechanism. bpi_live_publish.py makes publication monotonic and
# publishes only lightweight current-state JSON on every fallback run.  The
# 1-minute history mirror is archived by the hourly checkpoint, avoiding a
# multi-megabyte Git commit every five minutes.

jobs:
  live_market:
    name: Continuous BTC Price + Volume Fallback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      BPI_CAPTURE_SECONDS: ${{ inputs.capture_seconds || '330' }}
      BPI_POLL_CYCLE_MS: ${{ inputs.poll_cycle_ms || '2500' }}
      BPI_COLLECTOR_GRACE_SECONDS: "90"
      BPI_PUBLISH_HARD_LIMIT_SECONDS: "180"

    steps:
      - name: Checkout newest main (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Set up Python 3.12 (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Sync main before live capture
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              git reset --hard origin/main
              git clean -fdx
              exit 0
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying"
            sleep "$(( attempt * 2 ))"
          done
          exit 1

      - name: Validate continuous BPI core stack
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "%s\n" "::error title=BPI core preflight failed::command=${BASH_COMMAND} exit=${rc}"; exit "${rc}"' ERR

          # Keep the live-market collector independent from optional/front-end
          # widget tests.  A missing or temporarily broken UI contract must not
          # disable the 24/7 price/volume continuity tier.
          python3 -m py_compile \
            tools/bpi/collector.py \
            tools/bpi/history_store.py \
            tools/bpi/bpi_index_engine.py \
            tools/bpi/index_sanity.py \
            tools/bpi/bpi_live_publish.py \
            tools/bpi/bpi_runtime_healthcheck.py \
            tools/bpi/workflow_contract_selftest.py

          printf '%s\n' 'CHECK bpi_live_publish self-test'
          python3 tools/bpi/bpi_live_publish.py --self-test
          printf '%s\n' 'CHECK runtime healthcheck self-test'
          python3 tools/bpi/bpi_runtime_healthcheck.py --self-test
          printf '%s\n' 'CHECK continuity self-test'
          python3 tools/bpi/bpi_continuity_selftest.py
          printf '%s\n' 'CHECK workflow contract self-test'
          python3 tools/bpi/workflow_contract_selftest.py
          printf '%s\n' 'CHECK JSON contracts'
          python3 -m json.tool tools/bpi/collector-config.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/provider_urls.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/exchanges.json >/dev/null

      - name: Validate Bitcoin widget integration contract
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          test_file='tools/bpi/widget_contract_selftest.py'
          if [ ! -f "${test_file}" ]; then
            printf '%s\n' '::warning title=BPI widget contract unavailable::tools/bpi/widget_contract_selftest.py is not present on this revision; live BPI collection will continue.'
            exit 0
          fi
          if ! python3 -m py_compile "${test_file}"; then
            printf '%s\n' '::warning title=BPI widget contract compile failure::tools/bpi/widget_contract_selftest.py does not compile; live BPI collection will continue.'
            exit 0
          fi
          if python3 "${test_file}"; then
            printf '%s\n' 'BPI widget integration contract: PASS'
          else
            # The checker itself emits one precise GitHub annotation per failed
            # static contract. Do not replace those diagnostics with an opaque
            # generic failure. Widget validation remains non-blocking for BPI.
            printf '%s\n' 'BPI widget integration contract reported one or more static mismatches; live BPI collection will continue.'
          fi

      - name: Enforce bounded live fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          cycle=int(os.environ["BPI_POLL_CYCLE_MS"])
          capture=int(float(os.environ["BPI_CAPTURE_SECONDS"]))
          grace=int(os.environ["BPI_COLLECTOR_GRACE_SECONDS"])
          if not 2500 <= cycle <= 5000:
              raise SystemExit(f"BPI_POLL_CYCLE_MS must be 2500-5000, got {cycle}")
          if not 60 <= capture <= 600:
              raise SystemExit(f"BPI_CAPTURE_SECONDS must be 60-600, got {capture}")
          if grace < 30:
              raise SystemExit(f"BPI_COLLECTOR_GRACE_SECONDS must be >=30, got {grace}")
          print(f"GitHub fallback market polling cycle: {cycle} ms")
          print(f"GitHub fallback capture window: {capture} s")
          print(f"Collector hard wall-clock limit: {capture + grace} s")
          PY

      - name: Run bounded overlapping live price and volume collector
        shell: bash
        run: |
          set -euo pipefail
          hard_limit="$(( BPI_CAPTURE_SECONDS + BPI_COLLECTOR_GRACE_SECONDS ))"
          timeout \
            --preserve-status \
            --signal=TERM \
            --kill-after=20s \
            "${hard_limit}s" \
            python3 tools/bpi/collector.py \
              --root . \
              --duration-seconds "${BPI_CAPTURE_SECONDS}" \
              --cycle-ms "${BPI_POLL_CYCLE_MS}" \
              --market-stale-after-ms 15000 \
              --status-file bitcoin/bpi/api/collector_run_status.json

      - name: Validate fresh live BPI output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, time
          from datetime import datetime
          from pathlib import Path

          api=Path('bitcoin/bpi/api')
          required=('latest.json','markets.json','provider_health.json','history-live.json','collector_run_status.json')
          for name in required:
              p=api/name
              if not p.is_file() or p.stat().st_size <= 0:
                  raise SystemExit(f'missing live BPI output: {p}')
              json.loads(p.read_text(encoding='utf-8'))

          latest=json.loads((api/'latest.json').read_text(encoding='utf-8'))

          def positive(value, label):
              try:
                  value=float(value)
              except Exception:
                  value=float('nan')
              if not math.isfinite(value) or value <= 0:
                  raise SystemExit(f'{label} is invalid: {value!r}')
              return value

          bpi=latest.get('bpi') if isinstance(latest.get('bpi'),dict) else {}
          global_bpi=latest.get('global_bpi') if isinstance(latest.get('global_bpi'),dict) else {}

          local_weighted=positive(
              bpi.get('weighted_price_usd') or latest.get('price_usd') or latest.get('bpi_usd'),
              'local weighted BPI',
          )
          local_unweighted=positive(
              bpi.get('unweighted_price_usd') or latest.get('unweighted_bpi_usd'),
              'local unweighted BPI',
          )
          global_weighted=positive(
              global_bpi.get('weighted_price_usd') or latest.get('global_bpi_usd'),
              'Global weighted BPI',
          )
          global_unweighted=positive(
              global_bpi.get('unweighted_price_usd') or latest.get('global_bpi_unweighted_usd'),
              'Global unweighted BPI',
          )
          price=local_weighted

          markets=json.loads((api/'markets.json').read_text(encoding='utf-8')).get('markets') or []
          good=[m for m in markets if isinstance(m,dict) and m.get('price_usd') is not None and m.get('volume_24h_btc') is not None]
          if len(good) < 2:
              raise SystemExit(f'insufficient live price+volume markets: {len(good)}')

          status=json.loads((api/'collector_run_status.json').read_text(encoding='utf-8'))
          if int(status.get('cycles') or 0) < 2:
              raise SystemExit(f'collector completed too few cycles: {status}')
          if int(status.get('provider_health_rows') or 0) < 1:
              raise SystemExit(f'collector produced no provider health rows: {status}')

          stamp=str(latest.get('updated_at') or '').replace('Z','+00:00')
          try: age=time.time()-datetime.fromisoformat(stamp).timestamp()
          except Exception as exc: raise SystemExit(f'invalid latest updated_at: {exc}')
          if age > 120:
              raise SystemExit(f'latest BPI state is stale at validation: age={age:.1f}s')

          print(
              'live BPI validation:',
              'markets=',len(good),
              'cycles=',status.get('cycles'),
              'local_weighted=',local_weighted,
              'local_unweighted=',local_unweighted,
              'global_weighted=',global_weighted,
              'global_unweighted=',global_unweighted,
          )
          PY

      - name: Publish monotonic live BPI checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-bpi-live-bot"
          git config user.email "actions@github.com"
          timeout \
            --preserve-status \
            --signal=TERM \
            --kill-after=10s \
            "${BPI_PUBLISH_HARD_LIMIT_SECONDS}s" \
            python3 tools/bpi/bpi_live_publish.py \
              --root . \
              --message "Update continuous live BPI checkpoint" \
              --attempts 4 \
              --sleep-seconds 2 \
              --keep-history 1440

  archive_checkpoint:
    name: Optional Full BPI Archive Checkpoint
    needs: [live_market]
    if: ${{ inputs.run_archive_checkpoint == true }}
    uses: ./.github/workflows/bpi-latest.yml
    with:
      capture_seconds: ${{ inputs.capture_seconds || '330' }}
    secrets:
      BPI_MARIADB_HOST: ${{ secrets.BPI_MARIADB_HOST }}
      BPI_MARIADB_PORT: ${{ secrets.BPI_MARIADB_PORT }}
      BPI_MARIADB_USER: ${{ secrets.BPI_MARIADB_USER }}
      BPI_MARIADB_PASSWORD: ${{ secrets.BPI_MARIADB_PASSWORD }}
      BPI_MARIADB_DATABASE: ${{ secrets.BPI_MARIADB_DATABASE }}
      BPI_BACKUP_REPO: ${{ secrets.BPI_BACKUP_REPO }}
      BPI_BACKUP_TOKEN: ${{ secrets.BPI_BACKUP_TOKEN }}

  wrapper_status:
    name: BPI Wrapper Status
    if: ${{ always() }}
    needs:
      - live_market
      - archive_checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report BPI continuity result
        shell: bash
        env:
          LIVE_RESULT: ${{ needs.live_market.result }}
          ARCHIVE_RESULT: ${{ needs.archive_checkpoint.result }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "ZZX-BPI continuity result" \
            "live_market=${LIVE_RESULT:-unknown}" \
            "archive_checkpoint=${ARCHIVE_RESULT:-skipped}"
          if [ "${LIVE_RESULT:-unknown}" != "success" ]; then
            printf '%s\n' "::error title=BPI continuity failure::live_market=${LIVE_RESULT:-unknown}"
            exit 1
          fi
          case "${ARCHIVE_RESULT:-skipped}" in
            success|skipped) ;;
            *)
              printf '%s\n' "::warning title=BPI archive checkpoint::optional archive checkpoint result=${ARCHIVE_RESULT}"
              ;;
          esac
          printf '%s\n' "Overlapping live price/volume capture and monotonic publication completed successfully."
