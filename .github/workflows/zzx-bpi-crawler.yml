name: ZZX-BPI Crawler

run-name: >-
  ZZX-BPI Crawler / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  schedule:
    # Redundant GitHub-hosted capture. The production server collector is resident.
    - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      capture_seconds:
        description: "Live BTC exchange price/volume collection window for this hourly run"
        required: false
        default: "3120"
        type: string

  workflow_call:
    inputs:
      capture_seconds:
        description: "Live BTC exchange price/volume collection window for this hourly run"
        required: false
        type: string
        default: "3120"
    secrets:
      BPI_MARIADB_HOST:
        required: false
      BPI_MARIADB_PORT:
        required: false
      BPI_MARIADB_USER:
        required: false
      BPI_MARIADB_PASSWORD:
        required: false
      BPI_MARIADB_DATABASE:
        required: false
      BPI_BACKUP_REPO:
        required: false
      BPI_BACKUP_TOKEN:
        required: false

permissions:
  contents: write

# One authoritative GitHub fallback capture at a time. Do not cancel a run that
# already contains observations that have not yet been sharded/published.
concurrency:
  group: zzx-bpi-crawler
  cancel-in-progress: false

jobs:
  live_market:
    name: Continuous BTC Price + Volume Fallback
    uses: ./.github/workflows/bpi-latest.yml
    with:
      capture_seconds: ${{ inputs.capture_seconds || '3120' }}
    secrets:
      BPI_MARIADB_HOST: ${{ secrets.BPI_MARIADB_HOST }}
      BPI_MARIADB_PORT: ${{ secrets.BPI_MARIADB_PORT }}
      BPI_MARIADB_USER: ${{ secrets.BPI_MARIADB_USER }}
      BPI_MARIADB_PASSWORD: ${{ secrets.BPI_MARIADB_PASSWORD }}
      BPI_MARIADB_DATABASE: ${{ secrets.BPI_MARIADB_DATABASE }}
      BPI_BACKUP_REPO: ${{ secrets.BPI_BACKUP_REPO }}
      BPI_BACKUP_TOKEN: ${{ secrets.BPI_BACKUP_TOKEN }}

  wrapper_status:
    name: BPI Wrapper Status
    if: ${{ always() }}
    needs:
      - live_market
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report authoritative BPI result
        shell: bash
        env:
          LIVE_MARKET_RESULT: ${{ needs.live_market.result }}
        run: |
          set -euo pipefail
          printf '%s\n' "ZZX-BPI authoritative hourly result=${LIVE_MARKET_RESULT}"
          if [ "${LIVE_MARKET_RESULT}" != "success" ]; then
            printf '%s\n' "Critical BPI live-market fallback did not complete successfully."
            exit 1
          fi
          printf '%s\n' "BPI live-market capture/finalization/publication completed successfully."
