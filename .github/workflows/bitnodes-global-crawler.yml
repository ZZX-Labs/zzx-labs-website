name: ZZX-Labs Bitnodes Global Node Crawler

on:
  workflow_dispatch:
    inputs:
      crawl_profile:
        description: "Crawl profile"
        required: false
        default: "hourly"
        type: choice
        options:
          - hourly
          - deep
      run_ayeowch_compat:
        description: "Also run the optional Ayeowch/Bitnodes compatibility crawler after production publication"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      crawl_profile:
        required: false
        type: string
        default: "hourly"
      run_ayeowch_compat:
        required: false
        type: boolean
        default: false
    secrets:
      BITNODES_BACKUP_REPO:
        required: false
      BITNODES_BACKUP_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: zzx-bitnodes-global-crawler
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

  BITNODES_ROOT: bitcoin/bitnodes
  BITNODES_API: bitcoin/bitnodes/api
  BITNODES_DATA: bitcoin/bitnodes/data
  BITNODES_ARCHIVE: bitcoin/bitnodes/archive
  BITNODES_GEO: bitcoin/bitnodes/data/geo
  BITNODES_GEOIP: bitcoin/bitnodes/data/geoip

  MAX_PUBLIC_JSON_BYTES: "24000000"
  MAX_COMMIT_FILES: "600"
  MAX_DELETIONS: "2500000"

jobs:
  crawl-bitnodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync repo before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Set crawl profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="${{ inputs.crawl_profile || 'hourly' }}"

          case "${PROFILE}" in
            hourly|deep)
              ;;
            *)
              printf '%s\n' "Unsupported crawl profile: ${PROFILE}"
              exit 1
              ;;
          esac

          if [ "${PROFILE}" = "deep" ]; then
            printf '%s\n' "run_seconds=3000" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "workers=256" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "batch_size=4096" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "getaddr_rounds=48" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "dns_seed_limit=12000" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "archive_replay_files=1500" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' "run_seconds=1500" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "workers=192" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "batch_size=2048" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "getaddr_rounds=24" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "dns_seed_limit=8192" >> "${GITHUB_OUTPUT}"
            printf '%s\n' "archive_replay_files=500" >> "${GITHUB_OUTPUT}"
          fi

          printf '%s\n' "Using crawl profile: ${PROFILE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/bitnodes/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/bitnodes/requirements.txt
          python - <<'PY'
          import geoip2.database
          import maxminddb
          print("geoip2/maxminddb imports OK")
          PY

      - name: Validate production Bitnodes tools
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=(
            tools/bitnodes/crawl.py
            tools/bitnodes/zzxbitnodes.py
            tools/bitnodes/collector.py
            tools/bitnodes/update_snapshot.py
            tools/bitnodes/merge_sources.py
            tools/bitnodes/geo_contract.py
            tools/bitnodes/geo_contract_selftest.py
            tools/bitnodes/enrich.py
            tools/bitnodes/aggregate.py
            tools/bitnodes/ip_db.py
            tools/bitnodes/push_ipdb.py
            tools/bitnodes/export_db.py
            tools/bitnodes/export_db_selftest.py
            tools/bitnodes/public_artifacts.py
            tools/bitnodes/public_artifacts_selftest.py
            tools/bitnodes/publish_generated_commit.py
            tools/bitnodes/publish_generated_commit_selftest.py
            tools/bitnodes/build_geo_indexes.py
            tools/bpi/bpi_git_publish.py
          )

          MODULES=(
            tools/bitnodes/network/ipv4.py
            tools/bitnodes/network/ipv6.py
            tools/bitnodes/network/tor.py
            tools/bitnodes/network/i2p.py
            tools/bitnodes/network/proxy.py
            tools/bitnodes/network/vpn.py
            tools/bitnodes/geoclass/isp.py
            tools/bitnodes/geoclass/organization.py
            tools/bitnodes/geoclass/provider.py
            tools/bitnodes/geoclass/datacenter.py
            tools/bitnodes/geoclass/government.py
            tools/bitnodes/geoclass/military.py
            tools/bitnodes/geoclass/sanctioned_nodes.py
            tools/bitnodes/threat-detection/knownmalactor.py
            tools/bitnodes/threat-detection/tagattribution.py
          )

          for FILE in "${REQUIRED[@]}" "${MODULES[@]}"; do
            test -f "${FILE}"
            python -m py_compile "${FILE}"
          done

          python tools/bitnodes/crawl.py --help >/dev/null
          python tools/bitnodes/collector.py --help >/dev/null
          python tools/bitnodes/merge_sources.py --help >/dev/null
          python tools/bitnodes/geo_contract.py --help >/dev/null
          python tools/bitnodes/geo_contract_selftest.py
          python tools/bitnodes/export_db_selftest.py
          python tools/bitnodes/public_artifacts_selftest.py
          python tools/bitnodes/publish_generated_commit_selftest.py
          python -m json.tool "${BITNODES_API}/sources.json" >/dev/null

      - name: Prepare Bitnodes directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BITNODES_API}/btcnodes/normalized" \
            "${BITNODES_API}/zzxbitnodes" \
            "${BITNODES_API}/enriched/btcnodes" \
            "${BITNODES_API}/enriched/zzxbitnodes" \
            "${BITNODES_API}/aggregate/btcnodes" \
            "${BITNODES_API}/aggregate/btcnodes-enriched" \
            "${BITNODES_API}/aggregate/zzxbitnodes" \
            "${BITNODES_API}/aggregate/canonical" \
            "${BITNODES_API}/snapshots/btcnodes" \
            "${BITNODES_API}/data" \
            "${BITNODES_DATA}/runtime/state/btcnodes" \
            "${BITNODES_DATA}/runtime/state/zzxbitnodes" \
            "${BITNODES_DATA}/runtime/seeders/zzxbitnodes" \
            "${BITNODES_DATA}/runtime/snapshots/24h/zzxbitnodes" \
            "${BITNODES_DATA}/geo/manifests" \
            "${BITNODES_GEOIP}/current" \
            "${BITNODES_GEOIP}/current/shards" \
            "${BITNODES_GEOIP}/archive" \
            "${BITNODES_GEOIP}/published" \
            "${BITNODES_ARCHIVE}/runtime/zzxbitnodes"

      - name: Download DB-IP GeoIP databases
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${BITNODES_GEOIP}"

          MONTHS="$(
            python - <<'PY'
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          year, month = now.year, now.month
          for _ in range(6):
              print(f"{year:04d}-{month:02d}")
              month -= 1
              if month == 0:
                  month = 12
                  year -= 1
          PY
          )"

          for DB in city asn country; do
            OK="0"
            for DBIP_MONTH in ${MONTHS}; do
              URL="https://download.db-ip.com/free/dbip-${DB}-lite-${DBIP_MONTH}.mmdb.gz"
              OUT="${BITNODES_GEOIP}/dbip-${DB}-lite.mmdb.gz"

              if curl \
                --proto '=https' \
                --tlsv1.2 \
                --fail \
                --location \
                --retry 3 \
                --retry-all-errors \
                --retry-delay 5 \
                --output "${OUT}" \
                "${URL}"
              then
                OK="1"
                break
              fi

              rm -f "${OUT}"
            done

            if [ "${OK}" != "1" ]; then
              printf '%s\n' "Failed to download DB-IP ${DB} Lite database."
              exit 1
            fi
          done

          gunzip -f "${BITNODES_GEOIP}"/*.gz

          for DB in \
            "${BITNODES_GEOIP}/dbip-city-lite.mmdb" \
            "${BITNODES_GEOIP}/dbip-asn-lite.mmdb" \
            "${BITNODES_GEOIP}/dbip-country-lite.mmdb"
          do
            test -s "${DB}"
          done

      - name: Verify DB-IP GeoIP databases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import geoip2.database
          from pathlib import Path

          city = Path("bitcoin/bitnodes/data/geoip/dbip-city-lite.mmdb")
          asn = Path("bitcoin/bitnodes/data/geoip/dbip-asn-lite.mmdb")
          country = Path("bitcoin/bitnodes/data/geoip/dbip-country-lite.mmdb")

          with geoip2.database.Reader(str(city)) as reader:
              result = reader.city("8.8.8.8")
              print("city smoke:", result.country.iso_code, result.location.latitude, result.location.longitude)

          with geoip2.database.Reader(str(asn)) as reader:
              result = reader.asn("8.8.8.8")
              print("asn smoke:", result.autonomous_system_number, result.autonomous_system_organization)

          with geoip2.database.Reader(str(country)) as reader:
              result = reader.country("8.8.8.8")
              print("country smoke:", result.country.iso_code)
          PY

      - name: Build local GeoNames indexes
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout 540 python tools/bitnodes/build_geo_indexes.py \
            --geo-root "${BITNODES_GEO}" \
            --download \
            --download-timeout 60 \
            --download-retries 3 \
            --copy-source-manifest

      - name: Mirror btcnodes.io and seed ZZX crawler
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/update_snapshot.py

          test -s "${BITNODES_API}/btcnodes/latest.json"
          test -s "${BITNODES_API}/btcnodes/normalized/latest.json"

          cp -f \
            "${BITNODES_API}/btcnodes/latest.json" \
            "${BITNODES_DATA}/runtime/seeders/zzxbitnodes/btcnodes-latest.json"

          python - <<'PY'
          import json
          from pathlib import Path

          raw = Path("bitcoin/bitnodes/api/btcnodes/latest.json")
          normalized = Path("bitcoin/bitnodes/api/btcnodes/normalized/latest.json")
          data = json.loads(normalized.read_text(encoding="utf-8"))
          nodes = data.get("nodes")
          count = len(nodes) if isinstance(nodes, list) else 0

          if data.get("source") != "btcnodes.io" and not str(data.get("source", "")).strip():
              raise SystemExit("btcnodes normalized snapshot has no source provenance")
          if count <= 0:
              raise SystemExit("btcnodes.io mirror normalized to zero node rows")

          print(
              "btcnodes.io mirror seeded:",
              f"nodes={count}",
              f"reachable={data.get('reachable_nodes')}",
              f"raw_bytes={raw.stat().st_size}",
          )
          PY

      - name: Run ZZX Bitnodes crawler window
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/crawl.py \
            --crawler zzxbitnodes \
            --daemon \
            --run-seconds "${{ steps.profile.outputs.run_seconds }}" \
            --interval 20 \
            --output "${BITNODES_API}/zzxbitnodes" \
            --archive-dir "${BITNODES_ARCHIVE}/runtime/zzxbitnodes" \
            --state-dir "${BITNODES_DATA}/runtime/state/zzxbitnodes" \
            --snapshot-24h-dir "${BITNODES_DATA}/runtime/snapshots/24h/zzxbitnodes" \
            --seeder-dir "${BITNODES_DATA}/runtime/seeders/zzxbitnodes" \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --timeout 5 \
            --limit 750000 \
            --batch-size "${{ steps.profile.outputs.batch_size }}" \
            --workers "${{ steps.profile.outputs.workers }}" \
            --getaddr-rounds "${{ steps.profile.outputs.getaddr_rounds }}" \
            --dns-seed-limit "${{ steps.profile.outputs.dns_seed_limit }}" \
            --archive-replay-files "${{ steps.profile.outputs.archive_replay_files }}" \
            --export-mode reachable_24h \
            --no-enrich-after \
            --no-aggregate-after \
            --no-export-all-after \
            --compact

      - name: Validate ZZX crawler output
        shell: bash
        run: |
          set -euo pipefail
          test -s "${BITNODES_API}/zzxbitnodes/latest.json"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bitcoin/bitnodes/api/zzxbitnodes/latest.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          nodes = payload.get("nodes") if isinstance(payload, dict) else None
          count = len(nodes) if isinstance(nodes, (dict, list)) else 0
          print(f"ZZX latest node count: {count}")
          if count <= 0:
              raise SystemExit("ZZX crawler produced zero nodes")
          PY

      - name: Enrich production node sources
        shell: bash
        run: |
          set -euo pipefail

          # City must run before county: the GeoNames city resolver supplies
          # admin2_code, which the county resolver then maps to the proper
          # county/district/admin-2 name.
          MODULES="geoip,geoloc,boundary_zone,continent,region,country,territory,city,county,zip,timezone,land_parcel,building_perimeter,asn_footprint,isp,organization,provider,datacenter,government,military,sanctioned_nodes,knownmalactor,tagattribution,w3w_lookup,geohashid_lookup,peers,peer_index,peer_health,dns_seeder_health"

          enrich_source() {
            SOURCE="$1"
            INPUT="$2"

            python tools/bitnodes/enrich.py \
              --input "${INPUT}" \
              --output "${BITNODES_API}/enriched/${SOURCE}/latest.json" \
              --report "${BITNODES_API}/enriched/${SOURCE}/enrichment-report.json" \
              --source "${SOURCE}" \
              --api-dir "${BITNODES_API}" \
              --state-dir "${BITNODES_DATA}/runtime/state/${SOURCE}" \
              --geoip-dir "${BITNODES_GEOIP}" \
              --city-db "${BITNODES_GEOIP}/dbip-city-lite.mmdb" \
              --asn-db "${BITNODES_GEOIP}/dbip-asn-lite.mmdb" \
              --country-db "${BITNODES_GEOIP}/dbip-country-lite.mmdb" \
              --geo-root "${BITNODES_GEO}" \
              --modules "${MODULES}" \
              --compact
          }

          enrich_source zzxbitnodes "${BITNODES_API}/zzxbitnodes/latest.json"
          enrich_source btcnodes "${BITNODES_API}/btcnodes/normalized/latest.json"

      - name: Normalize real IP geolocation contract
        shell: bash
        run: |
          set -euo pipefail

          normalize_geo() {
            SOURCE="$1"

            python tools/bitnodes/geo_contract.py \
              --input "${BITNODES_API}/enriched/${SOURCE}/latest.json" \
              --output "${BITNODES_API}/enriched/${SOURCE}/latest.geo.json" \
              --report "${BITNODES_API}/enriched/${SOURCE}/geo-contract-report.json" \
              --city-db "${BITNODES_GEOIP}/dbip-city-lite.mmdb" \
              --country-db "${BITNODES_GEOIP}/dbip-country-lite.mmdb" \
              --asn-db "${BITNODES_GEOIP}/dbip-asn-lite.mmdb" \
              --geo-root "${BITNODES_GEO}" \
              --minimum-country 1 \
              --minimum-city 0 \
              --minimum-county 0 \
              --minimum-coordinates 1 \
              --compact
          }

          normalize_geo zzxbitnodes
          normalize_geo btcnodes

      - name: Validate enriched production sources
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def nodes(payload):
              rows = payload.get("nodes") if isinstance(payload, dict) else None
              if isinstance(rows, dict):
                  return list(rows.values())
              if isinstance(rows, list):
                  return rows
              return []

          def get(obj, *names):
              for name in names:
                  cur = obj
                  for part in name.split("."):
                      if not isinstance(cur, dict):
                          cur = None
                          break
                      cur = cur.get(part)
                  if cur not in (None, ""):
                      return cur
              return None

          for source in ("zzxbitnodes", "btcnodes"):
              path = Path(f"bitcoin/bitnodes/api/enriched/{source}/latest.geo.json")
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = nodes(payload)
              if not rows:
                  raise SystemExit(f"{source} enrichment contains zero nodes")

              countries = 0
              cities = 0
              counties = 0
              coordinates = 0
              synthetic = 0

              for row in rows:
                  if not isinstance(row, dict):
                      continue

                  contract = row.get("geo_contract") if isinstance(row.get("geo_contract"), dict) else {}
                  country = get(row, "country", "country_code", "geo_contract.country_code")
                  city = get(row, "city", "geo_contract.city")
                  county = get(row, "county", "geo_contract.county")
                  admin2 = get(row, "admin2_code", "geo_contract.admin2_code")
                  lat = get(row, "latitude", "lat", "geo_contract.latitude")
                  lon = get(row, "longitude", "lon", "lng", "geo_contract.longitude")

                  if contract.get("synthetic") is True:
                      synthetic += 1
                  if isinstance(country, str) and len(country.strip()) == 2:
                      countries += 1
                  if city and country:
                      cities += 1
                  if county and admin2 and country:
                      counties += 1

                  try:
                      lat = float(lat)
                      lon = float(lon)
                  except Exception:
                      continue

                  if -90 <= lat <= 90 and -180 <= lon <= 180:
                      coordinates += 1

              print(
                  source,
                  "nodes=", len(rows),
                  "countries=", countries,
                  "cities=", cities,
                  "counties=", counties,
                  "coordinates=", coordinates,
                  "synthetic=", synthetic,
              )

              if countries == 0:
                  raise SystemExit(f"{source} geo contract produced zero country-bearing rows")
              if coordinates == 0:
                  raise SystemExit(f"{source} geo contract produced zero coordinate-bearing rows")
              if synthetic != 0:
                  raise SystemExit(f"{source} geo contract retained synthetic rows")
          PY

      - name: Aggregate production sources
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/aggregate.py \
            --input "${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" \
            --output "${BITNODES_API}/aggregate/zzxbitnodes/latest.json" \
            --api-dir "${BITNODES_API}" \
            --state-dir "${BITNODES_DATA}/runtime/state/zzxbitnodes" \
            --source zzxbitnodes \
            --compact

          # Keep the enriched external aggregate separate from the 5-minute
          # mirror-owned aggregate/btcnodes/latest.json path.
          python tools/bitnodes/aggregate.py \
            --input "${BITNODES_API}/enriched/btcnodes/latest.geo.json" \
            --output "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            --api-dir "${BITNODES_API}" \
            --state-dir "${BITNODES_DATA}/runtime/state/btcnodes" \
            --source btcnodes.io \
            --compact

      - name: Build canonical merged widget snapshot
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/merge_sources.py \
            --input "zzxbitnodes=${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" \
            --input "btcnodes.io=${BITNODES_API}/enriched/btcnodes/latest.geo.json" \
            --output "${BITNODES_API}/snapshots/latest.json" \
            --aggregate-output "${BITNODES_API}/aggregate/canonical/latest.json" \
            --compact

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bitcoin/bitnodes/api/snapshots/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data.get("nodes")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("canonical snapshot has zero normalized node rows")

          addresses = {str(row.get("address") or "") for row in rows if isinstance(row, dict)}
          if "" in addresses:
              addresses.remove("")
          if len(addresses) != len(rows):
              raise SystemExit("canonical snapshot contains duplicate or missing node addresses")

          countries = sum(1 for row in rows if isinstance(row, dict) and row.get("country"))
          cities = sum(1 for row in rows if isinstance(row, dict) and row.get("city"))
          counties = sum(1 for row in rows if isinstance(row, dict) and row.get("county") and row.get("admin2_code"))
          coordinates = sum(1 for row in rows if isinstance(row, dict) and row.get("latitude") is not None and row.get("longitude") is not None)
          uas = sum(1 for row in rows if isinstance(row, dict) and row.get("user_agent"))

          if countries <= 0:
              raise SystemExit("canonical snapshot contains no country-geolocated nodes")
          if cities <= 0:
              raise SystemExit("canonical snapshot contains no city-geolocated nodes")
          if counties <= 0:
              raise SystemExit("canonical snapshot contains no county/admin2-geolocated nodes")
          if coordinates <= 0:
              raise SystemExit("canonical snapshot contains no real-coordinate nodes")
          if uas <= 0:
              raise SystemExit("canonical snapshot contains no user-agent rows")

          print(
              "canonical snapshot valid:",
              f"nodes={len(rows)}",
              f"countries={countries}",
              f"cities={cities}",
              f"counties={counties}",
              f"coordinates={coordinates}",
              f"user_agents={uas}",
              f"sources={data.get('source_counts')}",
          )
          PY

      - name: Update IPDB artifacts from canonical snapshot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${BITNODES_GEOIP}/current" "${BITNODES_GEOIP}/archive" "${BITNODES_GEOIP}/published"

          python tools/bitnodes/ip_db.py \
            --input "${BITNODES_API}/snapshots/latest.json" \
            --output "${BITNODES_API}/snapshots/latest.ipdb-enriched.json" \
            --ipdb-dir "${BITNODES_GEOIP}" \
            --latest "${BITNODES_GEOIP}/current/ip_db.latest.json" \
            --index "${BITNODES_GEOIP}/current/ip_db.index.json" \
            --stats "${BITNODES_GEOIP}/current/ip_db.stats.json" \
            --archive-dir "${BITNODES_GEOIP}/archive" \
            --max-segment-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --source zzx-canonical \
            --update-db \
            --compact \
            --report "${BITNODES_GEOIP}/ip_db.run-report.json"

          python tools/bitnodes/push_ipdb.py \
            --ipdb-dir "${BITNODES_GEOIP}" \
            --latest "${BITNODES_GEOIP}/current/ip_db.latest.json" \
            --index "${BITNODES_GEOIP}/current/ip_db.index.json" \
            --stats "${BITNODES_GEOIP}/current/ip_db.stats.json" \
            --archive-dir "${BITNODES_GEOIP}/archive" \
            --output-dir "${BITNODES_GEOIP}/published" \
            --report "${BITNODES_GEOIP}/ip_db.push-report.json" \
            --include-latest \
            --copy-only \
            --compact

      - name: Build bounded public aggregate and IPDB contracts
        shell: bash
        run: |
          set -euo pipefail

          IPDB_SOURCE="${BITNODES_API}/snapshots/latest.ipdb-enriched.json"
          IPDB_LATEST="${BITNODES_GEOIP}/current/ip_db.latest.json"

          test -s "${IPDB_SOURCE}"
          test -s "${IPDB_LATEST}"

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("bitcoin/bitnodes/api/snapshots/latest.ipdb-enriched.json").read_text(encoding="utf-8"))
          latest = json.loads(Path("bitcoin/bitnodes/data/geoip/current/ip_db.latest.json").read_text(encoding="utf-8"))
          nodes = source.get("nodes") if isinstance(source, dict) else None
          if not isinstance(nodes, (list, dict)) or not nodes:
              raise SystemExit("node-bearing IPDB source contains no nodes")
          if isinstance(latest, dict) and isinstance(latest.get("nodes"), (list, dict)):
              print("IPDB latest currently contains nodes; it will be replaced by the bounded pointer contract")
          else:
              print(
                  "IPDB contracts before public sharding:",
                  f"source_nodes={len(nodes)}",
                  f"latest_schema={latest.get('schema') if isinstance(latest, dict) else None}",
                  f"latest_record_count={latest.get('record_count') if isinstance(latest, dict) else None}",
              )
          PY

          python tools/bitnodes/public_artifacts.py \
            --aggregate "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            --canonical-url "/bitcoin/bitnodes/api/snapshots/latest.json" \
            --ipdb-source "${IPDB_SOURCE}" \
            --ipdb-latest "${IPDB_LATEST}" \
            --ipdb-shard-dir "${BITNODES_GEOIP}/current/shards" \
            --ipdb-manifest "${BITNODES_GEOIP}/current/ip_db.public-manifest.json" \
            --max-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --rows-per-shard 5000 \
            --gzip-level 6 \
            --report "${BITNODES_GEOIP}/public-artifacts-report.json"

          test -s "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json"
          test -s "${BITNODES_GEOIP}/current/ip_db.public-manifest.json"
          test -s "${BITNODES_GEOIP}/current/ip_db.latest.json"
          python -m json.tool "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" >/dev/null
          python -m json.tool "${BITNODES_GEOIP}/current/ip_db.public-manifest.json" >/dev/null
          python -m json.tool "${BITNODES_GEOIP}/current/ip_db.latest.json" >/dev/null

          python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path("bitcoin/bitnodes/data/geoip/current")
          manifest = json.loads((root / "ip_db.public-manifest.json").read_text(encoding="utf-8"))
          seen = 0
          for item in manifest.get("shards", []):
              path = root / item["path"]
              blob = path.read_bytes()
              if hashlib.sha256(blob).hexdigest() != item["sha256"]:
                  raise SystemExit(f"IPDB shard digest mismatch: {path}")
              payload = json.loads(gzip.decompress(blob).decode("utf-8"))
              nodes = payload.get("nodes")
              if not isinstance(nodes, (list, dict)):
                  raise SystemExit(f"IPDB shard has invalid nodes contract: {path}")
              seen += len(nodes)
          if seen != int(manifest.get("node_count") or 0):
              raise SystemExit(f"IPDB public shard row mismatch: {seen} != {manifest.get('node_count')}")
          print(f"bounded public contracts valid: ipdb_nodes={seen} shards={manifest.get('shard_count')}")
          PY

      - name: Export canonical MariaDB gzip shards
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          timeout --signal=TERM --kill-after=30s 12m python tools/bitnodes/export_db.py \
            --input "${BITNODES_API}/snapshots/latest.json" \
            --output-dir "${BITNODES_API}/data" \
            --database zzx_bitnodes \
            --max-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --gzip-level 6 \
            --sql-plain-factor 4 \
            --sql-rows-per-shard 5000 \
            --mariadb-only \
            --compact \
            --strict \
            --no-sqlite

          test -s "${BITNODES_API}/data/mariadb_manifest.json"
          python -m json.tool "${BITNODES_API}/data/mariadb_manifest.json" >/dev/null

          shopt -s nullglob
          SHARDS=("${BITNODES_API}/data/mariadb/"*.sql.gz)
          shopt -u nullglob
          if [ "${#SHARDS[@]}" -eq 0 ]; then
            printf '%s\n' "No MariaDB SQL shards were generated."
            exit 1
          fi
          for SHARD in "${SHARDS[@]}"; do
            gzip -t "${SHARD}"
            test "$(stat -c '%s' "${SHARD}")" -le "${MAX_PUBLIC_JSON_BYTES}"
          done

      - name: Backup MariaDB shards to private repo when configured
        continue-on-error: true
        shell: bash
        env:
          BITNODES_BACKUP_REPO: ${{ secrets.BITNODES_BACKUP_REPO }}
          BITNODES_BACKUP_TOKEN: ${{ secrets.BITNODES_BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BITNODES_BACKUP_REPO:-}" ] || [ -z "${BITNODES_BACKUP_TOKEN:-}" ]; then
            printf '%s\n' "Private Bitnodes backup not configured; skipping."
            exit 0
          fi

          if ! [[ "${BITNODES_BACKUP_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf '%s\n' "BITNODES_BACKUP_REPO must be owner/repository."
            exit 1
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TMP="$(mktemp -d)"
          ASKPASS="$(mktemp)"
          trap 'rm -rf "${TMP}"; rm -f "${ASKPASS}"' EXIT

          cat > "${ASKPASS}" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "${BITNODES_BACKUP_TOKEN}" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}"
          export GIT_TERMINAL_PROMPT=0

          git clone --filter=blob:none --single-branch --branch main \
            "https://github.com/${BITNODES_BACKUP_REPO}.git" "${TMP}"

          mkdir -p "${TMP}/bitnodes/mariadb/${TODAY}/${RUN_ID}" "${TMP}/bitnodes/latest"
          cp -av "${BITNODES_API}/data/mariadb/"*.sql.gz "${TMP}/bitnodes/mariadb/${TODAY}/${RUN_ID}/"
          cp -av "${BITNODES_API}/data/"*.json "${TMP}/bitnodes/latest/" || true

          git -C "${TMP}" config user.name "zzx-labs-bitnodes-bot"
          git -C "${TMP}" config user.email "actions@github.com"
          git -C "${TMP}" add bitnodes

          if git -C "${TMP}" diff --cached --quiet; then
            printf '%s\n' "No private backup changes."
            exit 0
          fi

          git -C "${TMP}" commit -m "Backup Bitnodes MariaDB shards ${TODAY} ${RUN_ID}"
          git -C "${TMP}" push origin HEAD:main

      - name: Build public API index
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import time
          from pathlib import Path

          api = Path("bitcoin/bitnodes/api")
          index = {
              "schema": "zzx-bitnodes-public-api-index-v2",
              "generated_at": int(time.time()),
              "canonical": "snapshots/latest.json",
              "sources": {
                  "btcnodes_raw": "btcnodes/latest.json",
                  "btcnodes_normalized": "btcnodes/normalized/latest.json",
                  "zzxbitnodes_latest": "zzxbitnodes/latest.json",
                  "btcnodes_enrichment_report": "enriched/btcnodes/enrichment-report.json",
                  "zzxbitnodes_enrichment_report": "enriched/zzxbitnodes/enrichment-report.json",
                  "btcnodes_geo_contract_report": "enriched/btcnodes/geo-contract-report.json",
                  "zzxbitnodes_geo_contract_report": "enriched/zzxbitnodes/geo-contract-report.json",
                  "btcnodes_mirror_aggregate": "aggregate/btcnodes/latest.json",
                  "btcnodes_enriched_aggregate": "aggregate/btcnodes-enriched/latest.json",
                  "zzxbitnodes_aggregate": "aggregate/zzxbitnodes/latest.json",
                  "canonical_aggregate": "aggregate/canonical/latest.json",
                  "database_latest": "data/latest.json",
                  "database_index": "data/index.json",
                  "database_manifest": "data/mariadb_manifest.json",
              },
              "optional_sources": {
                  "ayeowch_original": "originalbitnodes/latest.json"
              },
              "policy": {
                  "primary_external": "btcnodes.io",
                  "primary_crawler": "zzxbitnodes",
                  "ayeowch": "optional/manual compatibility crawler; never gates production publication",
                  "browser": "local canonical JSON only; no direct btcnodes.io widget fetches",
                  "database": "24MB-safe gzipped MariaDB SQL shards",
              },
          }
          api.mkdir(parents=True, exist_ok=True)
          (api / "index.json").write_text(json.dumps(index, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Prune private and transient crawler data
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${BITNODES_GEOIP}"/*.mmdb "${BITNODES_GEOIP}"/*.mmdb.gz || true
          rm -rf "${BITNODES_DATA}/runtime" || true
          rm -rf "${BITNODES_ARCHIVE}/runtime" || true
          rm -f "${BITNODES_API}/snapshots/latest.ipdb-enriched.json" || true
          rm -f "${BITNODES_API}/enriched/btcnodes/latest.json" || true
          rm -f "${BITNODES_API}/enriched/zzxbitnodes/latest.json" || true
          rm -f "${BITNODES_API}/enriched/btcnodes/latest.geo.json" || true
          rm -f "${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" || true
          find "${BITNODES_ROOT}" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find tools/bitnodes -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true

      - name: Validate public artifact policy
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          max_bytes = int(os.environ["MAX_PUBLIC_JSON_BYTES"])
          roots = [
              Path(os.environ["BITNODES_API"]),
              Path(os.environ["BITNODES_GEOIP"]) / "current",
          ]
          bad = []

          for root in roots:
              if not root.exists():
                  bad.append((0, root, "missing artifact root"))
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix == ".gz":
                      if path.stat().st_size > max_bytes:
                          bad.append((path.stat().st_size, path, "gzip shard too large"))
                  elif path.suffix in {".json", ".geojson"} and path.stat().st_size > max_bytes:
                      bad.append((path.stat().st_size, path, "public JSON too large"))

          required = [
              Path(os.environ["BITNODES_API"]) / "aggregate" / "btcnodes-enriched" / "latest.json",
              Path(os.environ["BITNODES_GEOIP"]) / "current" / "ip_db.public-manifest.json",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size <= 0:
                  bad.append((0, path, "required bounded public contract missing"))

          latest = Path(os.environ["BITNODES_GEOIP"]) / "current" / "ip_db.latest.json"
          try:
              import json
              latest_payload = json.loads(latest.read_text(encoding="utf-8"))
              if latest_payload.get("schema") != "zzx-bitnodes-ipdb-public-latest-v1":
                  bad.append((latest.stat().st_size, latest, "IPDB latest must be bounded pointer contract"))
          except Exception:
              bad.append((latest.stat().st_size if latest.exists() else 0, latest, "invalid IPDB latest pointer contract"))

          if bad:
              for size, path, reason in bad:
                  print(reason, size, path)
              raise SystemExit(1)

          print("public artifact filesystem policy passed")
          PY

      - name: Stage crawler-owned public Bitnodes outputs
        shell: bash
        run: |
          set -euo pipefail

          git reset

          git add -A \
            "${BITNODES_API}/index.json" \
            "${BITNODES_API}/sources.json" \
            "${BITNODES_API}/zzxbitnodes/latest.json" \
            "${BITNODES_API}/snapshots/latest.json" \
            "${BITNODES_API}/enriched/btcnodes/enrichment-report.json" \
            "${BITNODES_API}/enriched/zzxbitnodes/enrichment-report.json" \
            "${BITNODES_API}/enriched/btcnodes/geo-contract-report.json" \
            "${BITNODES_API}/enriched/zzxbitnodes/geo-contract-report.json" \
            "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            "${BITNODES_API}/aggregate/zzxbitnodes/latest.json" \
            "${BITNODES_API}/aggregate/canonical/latest.json" \
            "${BITNODES_API}/data" \
            "${BITNODES_DATA}/geo/manifests" \
            "${BITNODES_GEOIP}/current" \
            "${BITNODES_GEOIP}/ip_db.run-report.json" \
            "${BITNODES_GEOIP}/ip_db.push-report.json" \
            "${BITNODES_GEOIP}/public-artifacts-report.json"

          # Map Host owns maps/** and live-map/** publication.
          MAP_STAGE_VIOLATIONS="$(git diff --cached --name-only | grep -E '^bitcoin/bitnodes/(maps|live-map)/' || true)"
          if [ -n "${MAP_STAGE_VIOLATIONS}" ]; then
            printf '%s\n' "Refusing crawler commit that overlaps Map Host-owned paths:"
            printf '%s\n' "${MAP_STAGE_VIOLATIONS}"
            exit 1
          fi

      - name: Guard against destructive or bloated commit
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          DELETIONS="$(git diff --cached --numstat | awk '{d += $2} END {print d + 0}')"

          printf '%s\n' "Staged files: ${CHANGED}"
          printf '%s\n' "Staged deletions: ${DELETIONS}"

          test "${CHANGED}" -le "${MAX_COMMIT_FILES}"
          test "${DELETIONS}" -le "${MAX_DELETIONS}"

          if git diff --cached --name-only | grep -E '/(cities|asns|countries|agents|geohashes|providers|organizations|versions)/.+\.json$'; then
            printf '%s\n' "Refusing exploded JSON fanout."
            exit 1
          fi

      - name: Commit and push production Bitnodes artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-labs-bitnodes-bot"
          git config user.email "actions@github.com"

          if git diff --cached --quiet; then
            printf '%s\n' "No Bitnodes public artifact changes."
            exit 0
          fi

          # First commit freezes the exact generated artifact payload in the local Git object store.
          # We do NOT rebase this machine-generated commit: generated JSON/DB files have no useful
          # line-level merge semantics and a concurrent main update can make the same rebase conflict
          # forever.  publish_generated_commit.py replays only these crawler-owned paths on top of
          # the newest origin/main and performs a normal fast-forward push.
          git commit -m "Update btcnodes.io mirror and ZZX Bitnodes crawler artifacts"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"
          printf '%s\n' "Frozen crawler publication payload: ${PAYLOAD_COMMIT}"

          python tools/bitnodes/publish_generated_commit.py \
            --payload-commit "${PAYLOAD_COMMIT}" \
            --remote origin \
            --branch main \
            --message "Update btcnodes.io mirror and ZZX Bitnodes crawler artifacts" \
            --attempts 5 \
            --sleep-seconds 10 \
            --allowed-prefix "${BITNODES_API}" \
            --allowed-prefix "${BITNODES_DATA}/geo/manifests" \
            --allowed-prefix "${BITNODES_GEOIP}/current" \
            --allowed-prefix "${BITNODES_GEOIP}/ip_db.run-report.json" \
            --allowed-prefix "${BITNODES_GEOIP}/ip_db.push-report.json" \
            --allowed-prefix "${BITNODES_GEOIP}/public-artifacts-report.json" \
            --forbidden-prefix "${BITNODES_ROOT}/maps" \
            --forbidden-prefix "${BITNODES_ROOT}/live-map" \
            --clean

  ayeowch-compat:
    name: Optional Ayeowch compatibility crawl
    needs: crawl-bitnodes
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
        inputs.run_ayeowch_compat == true
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout newly published main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ZZX Bitnodes dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/bitnodes/requirements.txt
          python -m py_compile tools/bitnodes/originalbitnodes.py tools/bitnodes/run_original_bitnodes.py

      - name: Run time-bounded Ayeowch compatibility crawler
        id: compat
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            bitcoin/bitnodes/api/originalbitnodes \
            bitcoin/bitnodes/archive/runtime/originalbitnodes \
            bitcoin/bitnodes/data/runtime/state/originalbitnodes \
            bitcoin/bitnodes/data/runtime/seeders/originalbitnodes \
            bitcoin/bitnodes/data/runtime/snapshots/24h/originalbitnodes

          timeout --signal=TERM --kill-after=30s 1200s \
            python tools/bitnodes/originalbitnodes.py \
              --original-mode classic \
              --classic-timeout-seconds 1100 \
              --run-seconds 0 \
              --timeout 5 \
              --limit 250000 \
              --batch-size 2048 \
              --workers 96 \
              --getaddr-rounds 16 \
              --dns-seed-limit 4096 \
              --archive-replay-files 0 \
              --disable-archive-replay \
              --export-mode reachable \
              --no-enrich-after \
              --no-aggregate-after \
              --no-export-all-after \
              --compact

      - name: Publish Ayeowch compatibility snapshot when available
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s bitcoin/bitnodes/api/originalbitnodes/latest.json ]; then
            printf '%s\n' "Ayeowch compatibility crawler produced no latest.json; production data is unaffected."
            exit 0
          fi

          python -m json.tool bitcoin/bitnodes/api/originalbitnodes/latest.json >/dev/null

          git config user.name "zzx-labs-bitnodes-bot"
          git config user.email "actions@github.com"
          git add -- bitcoin/bitnodes/api/originalbitnodes/latest.json

          if git diff --cached --quiet; then
            printf '%s\n' "No Ayeowch compatibility changes."
            exit 0
          fi

          git commit -m "Update optional Ayeowch Bitnodes compatibility snapshot"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"

          python tools/bitnodes/publish_generated_commit.py \
            --payload-commit "${PAYLOAD_COMMIT}" \
            --remote origin \
            --branch main \
            --message "Update optional Ayeowch Bitnodes compatibility snapshot" \
            --attempts 3 \
            --sleep-seconds 5 \
            --allowed-prefix "bitcoin/bitnodes/api/originalbitnodes/latest.json" \
            --forbidden-prefix "${BITNODES_ROOT}/maps" \
            --forbidden-prefix "${BITNODES_ROOT}/live-map" \
            --clean
