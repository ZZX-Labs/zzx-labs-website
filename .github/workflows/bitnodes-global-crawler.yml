      - name: Build canonical merged widget snapshot
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/merge_sources.py \
            --input "zzxbitnodes=${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" \
            --input "btcnodes.io=${BITNODES_API}/enriched/btcnodes/latest.geo.json" \
            --output "${BITNODES_API}/snapshots/latest.json" \
            --aggregate-output "${BITNODES_API}/aggregate/canonical/latest.json" \
            --compact

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bitcoin/bitnodes/api/snapshots/latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          rows = data.get("nodes")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("canonical snapshot has zero normalized node rows")

          addresses = {str(row.get("address") or "") for row in rows if isinstance(row, dict)}
          if "" in addresses:
              addresses.remove("")
          if len(addresses) != len(rows):
              raise SystemExit("canonical snapshot contains duplicate or missing node addresses")

          countries = sum(1 for row in rows if isinstance(row, dict) and row.get("country"))
          cities = sum(1 for row in rows if isinstance(row, dict) and row.get("city"))
          counties = sum(1 for row in rows if isinstance(row, dict) and row.get("county") and row.get("admin2_code"))
          coordinates = sum(1 for row in rows if isinstance(row, dict) and row.get("latitude") is not None and row.get("longitude") is not None)
          uas = sum(1 for row in rows if isinstance(row, dict) and row.get("user_agent"))

          if countries <= 0:
              raise SystemExit("canonical snapshot contains no country-geolocated nodes")
          if cities <= 0:
              raise SystemExit("canonical snapshot contains no city-geolocated nodes")
          if counties <= 0:
              raise SystemExit("canonical snapshot contains no county/admin2-geolocated nodes")
          if coordinates <= 0:
              raise SystemExit("canonical snapshot contains no real-coordinate nodes")
          if uas <= 0:
              raise SystemExit("canonical snapshot contains no user-agent rows")

          print(
              "canonical snapshot valid:",
              f"nodes={len(rows)}",
              f"countries={countries}",
              f"cities={cities}",
              f"counties={counties}",
              f"coordinates={coordinates}",
              f"user_agents={uas}",
              f"sources={data.get('source_counts')}",
          )
          PY

