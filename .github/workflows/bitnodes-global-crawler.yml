      - name: Build bounded public aggregate and IPDB contracts
        shell: bash
        run: |
          set -euo pipefail

          IPDB_SOURCE="${BITNODES_API}/snapshots/latest.ipdb-enriched.json"
          IPDB_LATEST="${BITNODES_GEOIP}/current/ip_db.latest.json"

          test -s "${IPDB_SOURCE}"
          test -s "${IPDB_LATEST}"

          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("bitcoin/bitnodes/api/snapshots/latest.ipdb-enriched.json").read_text(encoding="utf-8"))
          latest = json.loads(Path("bitcoin/bitnodes/data/geoip/current/ip_db.latest.json").read_text(encoding="utf-8"))
          nodes = source.get("nodes") if isinstance(source, dict) else None
          if not isinstance(nodes, (list, dict)) or not nodes:
              raise SystemExit("node-bearing IPDB source contains no nodes")
          if isinstance(latest, dict) and isinstance(latest.get("nodes"), (list, dict)):
              print("IPDB latest currently contains nodes; it will be replaced by the bounded pointer contract")
          else:
              print(
                  "IPDB contracts before public sharding:",
                  f"source_nodes={len(nodes)}",
                  f"latest_schema={latest.get('schema') if isinstance(latest, dict) else None}",
                  f"latest_record_count={latest.get('record_count') if isinstance(latest, dict) else None}",
              )
          PY

          python tools/bitnodes/public_artifacts.py \
            --aggregate "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            --canonical-url "/bitcoin/bitnodes/api/snapshots/latest.json" \
            --ipdb-source "${IPDB_SOURCE}" \
            --ipdb-latest "${IPDB_LATEST}" \
            --ipdb-shard-dir "${BITNODES_GEOIP}/current/shards" \
            --ipdb-manifest "${BITNODES_GEOIP}/current/ip_db.public-manifest.json" \
            --max-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --rows-per-shard 5000 \
            --gzip-level 6 \
            --report "${BITNODES_GEOIP}/public-artifacts-report.json"

          test -s "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json"
          test -s "${BITNODES_GEOIP}/current/ip_db.public-manifest.json"
          test -s "${BITNODES_GEOIP}/current/ip_db.latest.json"
          python -m json.tool "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" >/dev/null
          python -m json.tool "${BITNODES_GEOIP}/current/ip_db.public-manifest.json" >/dev/null
          python -m json.tool "${BITNODES_GEOIP}/current/ip_db.latest.json" >/dev/null

          python - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path("bitcoin/bitnodes/data/geoip/current")
          manifest = json.loads((root / "ip_db.public-manifest.json").read_text(encoding="utf-8"))
          seen = 0
          for item in manifest.get("shards", []):
              path = root / item["path"]
              blob = path.read_bytes()
              if hashlib.sha256(blob).hexdigest() != item["sha256"]:
                  raise SystemExit(f"IPDB shard digest mismatch: {path}")
              payload = json.loads(gzip.decompress(blob).decode("utf-8"))
              nodes = payload.get("nodes")
              if not isinstance(nodes, (list, dict)):
                  raise SystemExit(f"IPDB shard has invalid nodes contract: {path}")
              seen += len(nodes)
          if seen != int(manifest.get("node_count") or 0):
              raise SystemExit(f"IPDB public shard row mismatch: {seen} != {manifest.get('node_count')}")
          print(f"bounded public contracts valid: ipdb_nodes={seen} shards={manifest.get('shard_count')}")
          PY

      - name: Export canonical MariaDB gzip shards
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          timeout --signal=TERM --kill-after=30s 12m python tools/bitnodes/export_db.py \
            --input "${BITNODES_API}/snapshots/latest.json" \
            --output-dir "${BITNODES_API}/data" \
            --database zzx_bitnodes \
            --max-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --gzip-level 6 \
            --sql-plain-factor 4 \
            --sql-rows-per-shard 5000 \
            --mariadb-only \
            --compact \
            --strict \
            --no-sqlite

          test -s "${BITNODES_API}/data/mariadb_manifest.json"
          python -m json.tool "${BITNODES_API}/data/mariadb_manifest.json" >/dev/null

          shopt -s nullglob
          SHARDS=("${BITNODES_API}/data/mariadb/"*.sql.gz)
          shopt -u nullglob
          if [ "${#SHARDS[@]}" -eq 0 ]; then
            printf '%s\n' "No MariaDB SQL shards were generated."
            exit 1
          fi
          for SHARD in "${SHARDS[@]}"; do
            gzip -t "${SHARD}"
            test "$(stat -c '%s' "${SHARD}")" -le "${MAX_PUBLIC_JSON_BYTES}"
          done

      - name: Backup MariaDB shards to private repo when configured
        continue-on-error: true
        shell: bash
        env:
          BITNODES_BACKUP_REPO: ${{ secrets.BITNODES_BACKUP_REPO }}
          BITNODES_BACKUP_TOKEN: ${{ secrets.BITNODES_BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BITNODES_BACKUP_REPO:-}" ] || [ -z "${BITNODES_BACKUP_TOKEN:-}" ]; then
            printf '%s\n' "Private Bitnodes backup not configured; skipping."
            exit 0
          fi

          if ! [[ "${BITNODES_BACKUP_REPO}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf '%s\n' "BITNODES_BACKUP_REPO must be owner/repository."
            exit 1
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TMP="$(mktemp -d)"
          ASKPASS="$(mktemp)"
          trap 'rm -rf "${TMP}"; rm -f "${ASKPASS}"' EXIT

          cat > "${ASKPASS}" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "${BITNODES_BACKUP_TOKEN}" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}"
          export GIT_TERMINAL_PROMPT=0

          cloned=0
          for attempt in 1 2 3 4 5; do
            rm -rf "${TMP:?}"/* "${TMP:?}"/.[!.]* "${TMP:?}"/..?* 2>/dev/null || true
            if git clone --filter=blob:none --no-checkout --single-branch --branch main \
              "https://github.com/${BITNODES_BACKUP_REPO}.git" "${TMP}"; then
              git -C "${TMP}" sparse-checkout init --cone
              git -C "${TMP}" sparse-checkout set bitnodes/latest
              git -C "${TMP}" checkout main
              cloned=1
              break
            fi
            sleep "$((attempt * 5))"
          done
          test "${cloned}" = "1"

          mkdir -p "${TMP}/bitnodes/mariadb/${TODAY}/${RUN_ID}" "${TMP}/bitnodes/latest"
          cp -av "${BITNODES_API}/data/mariadb/"*.sql.gz "${TMP}/bitnodes/mariadb/${TODAY}/${RUN_ID}/"
          cp -av "${BITNODES_API}/data/"*.json "${TMP}/bitnodes/latest/" || true

          git -C "${TMP}" config user.name "zzx-labs-bitnodes-bot"
          git -C "${TMP}" config user.email "actions@github.com"
          git -C "${TMP}" add --sparse "bitnodes/mariadb/${TODAY}/${RUN_ID}" bitnodes/latest

          if git -C "${TMP}" diff --cached --quiet; then
            printf '%s\n' "No private backup changes."
            exit 0
          fi

          git -C "${TMP}" commit -m "Backup Bitnodes MariaDB shards ${TODAY} ${RUN_ID}"

          pushed=0
          for attempt in 1 2 3 4 5; do
            if git -C "${TMP}" pull --rebase origin main && git -C "${TMP}" push origin HEAD:main; then
              pushed=1
              break
            fi
            git -C "${TMP}" rebase --abort 2>/dev/null || true
            sleep "$((attempt * 7))"
          done
          test "${pushed}" = "1"

      - name: Build public API index
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import time
          from pathlib import Path

          api = Path("bitcoin/bitnodes/api")
          index = {
              "schema": "zzx-bitnodes-public-api-index-v2",
              "generated_at": int(time.time()),
              "canonical": "snapshots/latest.json",
              "sources": {
                  "btcnodes_raw": "btcnodes/latest.json",
                  "btcnodes_normalized": "btcnodes/normalized/latest.json",
                  "zzxbitnodes_latest": "zzxbitnodes/latest.json",
                  "btcnodes_enrichment_report": "enriched/btcnodes/enrichment-report.json",
                  "zzxbitnodes_enrichment_report": "enriched/zzxbitnodes/enrichment-report.json",
                  "btcnodes_geo_contract_report": "enriched/btcnodes/geo-contract-report.json",
                  "zzxbitnodes_geo_contract_report": "enriched/zzxbitnodes/geo-contract-report.json",
                  "btcnodes_mirror_aggregate": "aggregate/btcnodes/latest.json",
                  "btcnodes_enriched_aggregate": "aggregate/btcnodes-enriched/latest.json",
                  "zzxbitnodes_aggregate": "aggregate/zzxbitnodes/latest.json",
                  "canonical_aggregate": "aggregate/canonical/latest.json",
                  "database_latest": "data/latest.json",
                  "database_index": "data/index.json",
                  "database_manifest": "data/mariadb_manifest.json",
              },
              "optional_sources": {
                  "ayeowch_original": "originalbitnodes/latest.json"
              },
              "policy": {
                  "primary_external": "btcnodes.io",
                  "primary_crawler": "zzxbitnodes",
                  "ayeowch": "optional/manual compatibility crawler; never gates production publication",
                  "browser": "local canonical JSON only; no direct btcnodes.io widget fetches",
                  "database": "24MB-safe gzipped MariaDB SQL shards",
              },
          }
          api.mkdir(parents=True, exist_ok=True)
          (api / "index.json").write_text(json.dumps(index, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Prune private and transient crawler data
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${BITNODES_GEOIP}"/*.mmdb "${BITNODES_GEOIP}"/*.mmdb.gz || true
          rm -rf "${BITNODES_DATA}/runtime" || true
          rm -rf "${BITNODES_ARCHIVE}/runtime" || true
          rm -f "${BITNODES_API}/snapshots/latest.ipdb-enriched.json" || true
          rm -f "${BITNODES_API}/enriched/btcnodes/latest.json" || true
          rm -f "${BITNODES_API}/enriched/zzxbitnodes/latest.json" || true
          rm -f "${BITNODES_API}/enriched/btcnodes/latest.geo.json" || true
          rm -f "${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" || true
          find "${BITNODES_ROOT}" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find tools/bitnodes -type d -name '__pycache__' -prune -exec rm -rf {} + || true
          find . -type f -name '*.pyc' -delete || true

      - name: Validate public artifact policy
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          max_bytes = int(os.environ["MAX_PUBLIC_JSON_BYTES"])
          roots = [
              Path(os.environ["BITNODES_API"]),
              Path(os.environ["BITNODES_GEOIP"]) / "current",
          ]
          bad = []

          for root in roots:
              if not root.exists():
                  bad.append((0, root, "missing artifact root"))
                  continue
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix == ".gz":
                      if path.stat().st_size > max_bytes:
                          bad.append((path.stat().st_size, path, "gzip shard too large"))
                  elif path.suffix in {".json", ".geojson"} and path.stat().st_size > max_bytes:
                      bad.append((path.stat().st_size, path, "public JSON too large"))

          required = [
              Path(os.environ["BITNODES_API"]) / "aggregate" / "btcnodes-enriched" / "latest.json",
              Path(os.environ["BITNODES_GEOIP"]) / "current" / "ip_db.public-manifest.json",
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size <= 0:
                  bad.append((0, path, "required bounded public contract missing"))

          latest = Path(os.environ["BITNODES_GEOIP"]) / "current" / "ip_db.latest.json"
          try:
              import json
              latest_payload = json.loads(latest.read_text(encoding="utf-8"))
              if latest_payload.get("schema") != "zzx-bitnodes-ipdb-public-latest-v1":
                  bad.append((latest.stat().st_size, latest, "IPDB latest must be bounded pointer contract"))
          except Exception:
              bad.append((latest.stat().st_size if latest.exists() else 0, latest, "invalid IPDB latest pointer contract"))

          if bad:
              for size, path, reason in bad:
                  print(reason, size, path)
              raise SystemExit(1)

          print("public artifact filesystem policy passed")
          PY

      - name: Stage crawler-owned public Bitnodes outputs
        shell: bash
        run: |
          set -euo pipefail

          git reset

          git add -A \
            "${BITNODES_API}/index.json" \
            "${BITNODES_API}/sources.json" \
            "${BITNODES_API}/zzxbitnodes/latest.json" \
            "${BITNODES_API}/snapshots/latest.json" \
            "${BITNODES_API}/enriched/btcnodes/enrichment-report.json" \
            "${BITNODES_API}/enriched/zzxbitnodes/enrichment-report.json" \
            "${BITNODES_API}/enriched/btcnodes/geo-contract-report.json" \
            "${BITNODES_API}/enriched/zzxbitnodes/geo-contract-report.json" \
            "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            "${BITNODES_API}/aggregate/zzxbitnodes/latest.json" \
            "${BITNODES_API}/aggregate/canonical/latest.json" \
            "${BITNODES_API}/data" \
            "${BITNODES_DATA}/geo/manifests" \
            "${BITNODES_GEOIP}/current" \
            "${BITNODES_GEOIP}/ip_db.run-report.json" \
            "${BITNODES_GEOIP}/ip_db.push-report.json" \
            "${BITNODES_GEOIP}/public-artifacts-report.json"

          # Map Host owns maps/** and live-map/** publication.
          MAP_STAGE_VIOLATIONS="$(git diff --cached --name-only | grep -E '^bitcoin/bitnodes/(maps|live-map)/' || true)"
          if [ -n "${MAP_STAGE_VIOLATIONS}" ]; then
            printf '%s\n' "Refusing crawler commit that overlaps Map Host-owned paths:"
            printf '%s\n' "${MAP_STAGE_VIOLATIONS}"
            exit 1
          fi

      - name: Guard against destructive or bloated commit
        shell: bash
        run: |
          set -euo pipefail

          CHANGED="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          DELETIONS="$(git diff --cached --numstat | awk '{d += $2} END {print d + 0}')"

          printf '%s\n' "Staged files: ${CHANGED}"
          printf '%s\n' "Staged deletions: ${DELETIONS}"

          test "${CHANGED}" -le "${MAX_COMMIT_FILES}"
          test "${DELETIONS}" -le "${MAX_DELETIONS}"

          if git diff --cached --name-only | grep -E '/(cities|asns|countries|agents|geohashes|providers|organizations|versions)/.+\.json$'; then
            printf '%s\n' "Refusing exploded JSON fanout."
            exit 1
          fi

      - name: Commit and push production Bitnodes artifacts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-labs-bitnodes-bot"
          git config user.email "actions@github.com"

          if git diff --cached --quiet; then
            printf '%s\n' "No Bitnodes public artifact changes."
            exit 0
          fi

          # First commit freezes the exact generated artifact payload in the local Git object store.
          # We do NOT rebase this machine-generated commit: generated JSON/DB files have no useful
          # line-level merge semantics and a concurrent main update can make the same rebase conflict
          # forever.  publish_generated_commit.py replays only these crawler-owned paths on top of
          # the newest origin/main and performs a normal fast-forward push.
          git commit -m "Update btcnodes.io mirror and ZZX Bitnodes crawler artifacts"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"
          printf '%s\n' "Frozen crawler publication payload: ${PAYLOAD_COMMIT}"

          python tools/bitnodes/publish_generated_commit.py \
            --payload-commit "${PAYLOAD_COMMIT}" \
            --remote origin \
            --branch main \
            --message "Update btcnodes.io mirror and ZZX Bitnodes crawler artifacts" \
            --attempts 5 \
            --sleep-seconds 10 \
            --allowed-prefix "${BITNODES_API}" \
            --allowed-prefix "${BITNODES_DATA}/geo/manifests" \
            --allowed-prefix "${BITNODES_GEOIP}/current" \
            --allowed-prefix "${BITNODES_GEOIP}/ip_db.run-report.json" \
            --allowed-prefix "${BITNODES_GEOIP}/ip_db.push-report.json" \
            --allowed-prefix "${BITNODES_GEOIP}/public-artifacts-report.json" \
            --forbidden-prefix "${BITNODES_ROOT}/maps" \
            --forbidden-prefix "${BITNODES_ROOT}/live-map" \
            --monotonic-json-path "${BITNODES_API}/zzxbitnodes/latest.json" \
            --monotonic-field timestamp \
            --clean

  ayeowch-compat:
    name: Optional Ayeowch compatibility crawl
    needs: crawl-bitnodes
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
        inputs.run_ayeowch_compat == true
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout newly published main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ZZX Bitnodes dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --retries 5 --timeout 60 --upgrade pip
          python -m pip install --retries 5 --timeout 60 -r tools/bitnodes/requirements.txt
          python -m py_compile tools/bitnodes/originalbitnodes.py tools/bitnodes/run_original_bitnodes.py

      - name: Run time-bounded Ayeowch compatibility crawler
        id: compat
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            bitcoin/bitnodes/api/originalbitnodes \
            bitcoin/bitnodes/archive/runtime/originalbitnodes \
            bitcoin/bitnodes/data/runtime/state/originalbitnodes \
            bitcoin/bitnodes/data/runtime/seeders/originalbitnodes \
            bitcoin/bitnodes/data/runtime/snapshots/24h/originalbitnodes

          timeout --signal=TERM --kill-after=30s 1200s \
            python tools/bitnodes/originalbitnodes.py \
              --original-mode classic \
              --classic-timeout-seconds 1100 \
              --run-seconds 0 \
              --timeout 5 \
              --limit 250000 \
              --batch-size 2048 \
              --workers 96 \
              --getaddr-rounds 16 \
              --dns-seed-limit 4096 \
              --archive-replay-files 0 \
              --disable-archive-replay \
              --export-mode reachable \
              --no-enrich-after \
              --no-aggregate-after \
              --no-export-all-after \
              --compact

      - name: Publish Ayeowch compatibility snapshot when available
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s bitcoin/bitnodes/api/originalbitnodes/latest.json ]; then
            printf '%s\n' "Ayeowch compatibility crawler produced no latest.json; production data is unaffected."
            exit 0
          fi

          python -m json.tool bitcoin/bitnodes/api/originalbitnodes/latest.json >/dev/null

          git config user.name "zzx-labs-bitnodes-bot"
          git config user.email "actions@github.com"
          git add -- bitcoin/bitnodes/api/originalbitnodes/latest.json

          if git diff --cached --quiet; then
            printf '%s\n' "No Ayeowch compatibility changes."
            exit 0
          fi

          git commit -m "Update optional Ayeowch Bitnodes compatibility snapshot"
          PAYLOAD_COMMIT="$(git rev-parse HEAD)"

          python tools/bitnodes/publish_generated_commit.py \
            --payload-commit "${PAYLOAD_COMMIT}" \
            --remote origin \
            --branch main \
            --message "Update optional Ayeowch Bitnodes compatibility snapshot" \
            --attempts 3 \
            --sleep-seconds 5 \
            --allowed-prefix "bitcoin/bitnodes/api/originalbitnodes/latest.json" \
            --forbidden-prefix "${BITNODES_ROOT}/maps" \
            --forbidden-prefix "${BITNODES_ROOT}/live-map" \
            --clean
