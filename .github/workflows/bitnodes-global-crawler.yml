      - name: Normalize real IP geolocation contract
        shell: bash
        run: |
          set -euo pipefail

          normalize_geo() {
            SOURCE="$1"

            python tools/bitnodes/geo_contract.py \
              --input "${BITNODES_API}/enriched/${SOURCE}/latest.json" \
              --output "${BITNODES_API}/enriched/${SOURCE}/latest.geo.json" \
