      - name: Enrich production node sources
        shell: bash
        run: |
          set -euo pipefail

          # City must run before county: the GeoNames city resolver supplies
          # admin2_code, which the county resolver then maps to the proper
          # county/district/admin-2 name.
          MODULES="geoip,geoloc,boundary_zone,continent,region,country,territory,city,county,zip,timezone,land_parcel,building_perimeter,asn_footprint,isp,organization,provider,datacenter,government,military,sanctioned_nodes,knownmalactor,tagattribution,w3w_lookup,geohashid_lookup,peers,peer_index,peer_health,dns_seeder_health"

          enrich_source() {
            SOURCE="$1"
