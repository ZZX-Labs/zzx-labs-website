      - name: Validate enriched production sources
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          def nodes(payload):
              rows = payload.get("nodes") if isinstance(payload, dict) else None
              if isinstance(rows, dict):
                  return list(rows.values())
              if isinstance(rows, list):
                  return rows
              return []

          def get(obj, *names):
              for name in names:
                  cur = obj
                  for part in name.split("."):
                      if not isinstance(cur, dict):
                          cur = None
                          break
                      cur = cur.get(part)
                  if cur not in (None, ""):
                      return cur
              return None

          for source in ("zzxbitnodes", "btcnodes"):
              path = Path(f"bitcoin/bitnodes/api/enriched/{source}/latest.geo.json")
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = nodes(payload)
              if not rows:
                  raise SystemExit(f"{source} enrichment contains zero nodes")

              countries = 0
              cities = 0
              counties = 0
              coordinates = 0
              synthetic = 0

              for row in rows:
                  if not isinstance(row, dict):
                      continue

                  contract = row.get("geo_contract") if isinstance(row.get("geo_contract"), dict) else {}
                  country = get(row, "country", "country_code", "geo_contract.country_code")
                  city = get(row, "city", "geo_contract.city")
                  county = get(row, "county", "geo_contract.county")
                  admin2 = get(row, "admin2_code", "geo_contract.admin2_code")
                  lat = get(row, "latitude", "lat", "geo_contract.latitude")
                  lon = get(row, "longitude", "lon", "lng", "geo_contract.longitude")

                  if contract.get("synthetic") is True:
                      synthetic += 1
                  if isinstance(country, str) and len(country.strip()) == 2:
                      countries += 1
                  if city and country:
                      cities += 1
                  if county and admin2 and country:
                      counties += 1

                  try:
                      lat = float(lat)
                      lon = float(lon)
                  except Exception:
                      continue

                  if -90 <= lat <= 90 and -180 <= lon <= 180:
                      coordinates += 1

              print(
                  source,
                  "nodes=", len(rows),
                  "countries=", countries,
                  "cities=", cities,
                  "counties=", counties,
                  "coordinates=", coordinates,
                  "synthetic=", synthetic,
              )

              if countries == 0:
                  raise SystemExit(f"{source} geo contract produced zero country-bearing rows")
              if coordinates == 0:
                  raise SystemExit(f"{source} geo contract produced zero coordinate-bearing rows")
              if synthetic != 0:
                  raise SystemExit(f"{source} geo contract retained synthetic rows")
          PY

      - name: Aggregate production sources
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/aggregate.py \
            --input "${BITNODES_API}/enriched/zzxbitnodes/latest.geo.json" \
            --output "${BITNODES_API}/aggregate/zzxbitnodes/latest.json" \
            --api-dir "${BITNODES_API}" \
            --state-dir "${BITNODES_DATA}/runtime/state/zzxbitnodes" \
            --source zzxbitnodes \
            --compact

          # Keep the enriched external aggregate separate from the 5-minute
          # mirror-owned aggregate/btcnodes/latest.json path.
          python tools/bitnodes/aggregate.py \
            --input "${BITNODES_API}/enriched/btcnodes/latest.geo.json" \
            --output "${BITNODES_API}/aggregate/btcnodes-enriched/latest.json" \
            --api-dir "${BITNODES_API}" \
