name: ZZX-Bitnodes Crawler

run-name: >-
  ZZX-Bitnodes Crawler / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  schedule:
    # Fast public node-snapshot checkpoint. The resident daemon polls continuously;
    # GitHub can only provide a checkpoint/fallback cadence, not hard real-time SLA.
    - cron: "*/5 * * * *"
    # Map publication is intentionally decoupled from the fast snapshot path.
    - cron: "2,17,32,47 * * * *"
    # Daily deeper independent Addy Yeow-style crawl.
    - cron: "7 3 * * *"

  workflow_dispatch:
    inputs:
      crawl_profile:
        description: "Original crawler profile when the fallback/deep crawler is requested"
        required: false
        default: "hourly"
        type: choice
        options: [hourly, deep]
      run_ayeowch_compat:
        description: "Also run the independent original Bitnodes-compatible crawler"
        required: false
        default: false
        type: boolean
      build_maps:
        description: "Build maps/live-map after the fresh snapshot"
        required: false
        default: true
        type: boolean
      map_max_points:
        description: "Maximum real-coordinate node points published to maps"
        required: false
        default: "5000"
        type: string
      include_ayeowch_map:
        description: "Build originalbitnodes compatibility map when available"
        required: false
        default: false
        type: boolean
      enable_registry_backup:
        description: "Attempt private registry backup"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      crawl_profile:
        required: false
        type: string
        default: "hourly"
      run_ayeowch_compat:
        required: false
        type: boolean
        default: false
      build_maps:
        required: false
        type: boolean
        default: true
      map_max_points:
        required: false
        type: string
        default: "5000"
      include_ayeowch_map:
        required: false
        type: boolean
        default: false
      enable_registry_backup:
        required: false
        type: boolean
        default: true
    secrets:
      BITNODES_BACKUP_REPO:
        required: false
      BITNODES_BACKUP_TOKEN:
        required: false
      BITNODES_REGISTRY_PAT:
        required: false
      BITNODES_REGISTRY_SSH_KEY:
        required: false

permissions:
  contents: write

jobs:
  plan:
    name: Resolve Bitnodes Crawl Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      crawl_profile: ${{ steps.plan.outputs.crawl_profile }}
      run_original: ${{ steps.plan.outputs.run_original }}
      build_maps: ${{ steps.plan.outputs.build_maps }}
      backup_registry: ${{ steps.plan.outputs.backup_registry }}
    steps:
      - name: Resolve fast, map, deep and manual paths
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_PROFILE: ${{ inputs.crawl_profile || 'hourly' }}
          INPUT_ORIGINAL: ${{ inputs.run_ayeowch_compat || false }}
          INPUT_MAPS: ${{ inputs.build_maps || false }}
          INPUT_BACKUP: ${{ inputs.enable_registry_backup || false }}
        run: |
          set -euo pipefail

          PROFILE="${INPUT_PROFILE:-hourly}"
          RUN_ORIGINAL="${INPUT_ORIGINAL:-false}"
          BUILD_MAPS="${INPUT_MAPS:-false}"
          BACKUP_REGISTRY="${INPUT_BACKUP:-false}"

          if [ "${EVENT_NAME}" = "schedule" ]; then
            case "${EVENT_SCHEDULE}" in
              "*/5 * * * *")
                PROFILE="hourly"
                RUN_ORIGINAL="false"
                BUILD_MAPS="false"
                BACKUP_REGISTRY="false"
                ;;
              "2,17,32,47 * * * *")
                PROFILE="hourly"
                RUN_ORIGINAL="false"
                BUILD_MAPS="true"
                BACKUP_REGISTRY="false"
                ;;
              "7 3 * * *")
                PROFILE="deep"
                RUN_ORIGINAL="true"
                BUILD_MAPS="true"
                BACKUP_REGISTRY="true"
                ;;
              *)
                printf '%s\n' "::error title=Unknown Bitnodes schedule::${EVENT_SCHEDULE}"
                exit 1
                ;;
            esac
          fi

          case "${PROFILE}" in hourly|deep) ;; *) exit 1 ;; esac
          case "${RUN_ORIGINAL}" in true|false) ;; *) RUN_ORIGINAL=false ;; esac
          case "${BUILD_MAPS}" in true|false) ;; *) BUILD_MAPS=false ;; esac
          case "${BACKUP_REGISTRY}" in true|false) ;; *) BACKUP_REGISTRY=false ;; esac

          printf '%s\n' \
            "crawl_profile=${PROFILE}" \
            "run_original=${RUN_ORIGINAL}" \
            "build_maps=${BUILD_MAPS}" \
            "backup_registry=${BACKUP_REGISTRY}" >> "${GITHUB_OUTPUT}"

          printf '%s\n' \
            "Bitnodes plan:" \
            "  profile=${PROFILE}" \
            "  original=${RUN_ORIGINAL}" \
            "  maps=${BUILD_MAPS}" \
            "  registry=${BACKUP_REGISTRY}"

  snapshot_mirror:
    name: ZZX Bitnodes Snapshot (btcnodes.io / Bitnodes fallback)
    needs: [plan]
    uses: ./.github/workflows/bitnodes-latest.yml

  original_crawler:
    name: Original Bitnodes Fallback Crawler
    needs: [plan, snapshot_mirror]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (
          needs.snapshot_mirror.result != 'success' ||
          needs.plan.outputs.run_original == 'true'
        )
      }}
    uses: ./.github/workflows/bitnodes-original-crawler.yml
    with:
      crawl_profile: ${{ needs.plan.outputs.crawl_profile }}

  map_host:
    name: Bitnodes Map Host (Primary ZZX Snapshot)
    needs: [plan, snapshot_mirror]
    if: >-
      ${{
        needs.plan.outputs.build_maps == 'true' &&
        needs.snapshot_mirror.result == 'success'
      }}
    uses: ./.github/workflows/bitnodes-maphost.yml
    with:
      max_points: ${{ inputs.map_max_points || '5000' }}
      include_ayeowch_compat: ${{ inputs.include_ayeowch_map || false }}

  map_host_fallback:
    name: Bitnodes Map Host (Original Fallback)
    needs: [plan, snapshot_mirror, original_crawler]
    if: >-
      ${{
        always() &&
        needs.plan.outputs.build_maps == 'true' &&
        needs.snapshot_mirror.result != 'success' &&
        needs.original_crawler.result == 'success'
      }}
    uses: ./.github/workflows/bitnodes-maphost.yml
    with:
      max_points: ${{ inputs.map_max_points || '5000' }}
      include_ayeowch_compat: true

  registry_backup:
    name: Private Bitnodes Registry Backup
    needs: [plan, snapshot_mirror]
    if: >-
      ${{
        always() &&
        needs.snapshot_mirror.result == 'success' &&
        needs.plan.outputs.backup_registry == 'true'
      }}
    uses: ./.github/workflows/bitnodes-registry-backup.yml
    secrets:
      BITNODES_REGISTRY_PAT: ${{ secrets.BITNODES_REGISTRY_PAT }}
      BITNODES_REGISTRY_SSH_KEY: ${{ secrets.BITNODES_REGISTRY_SSH_KEY }}

  wrapper_status:
    name: Bitnodes Wrapper Status
    if: ${{ always() }}
    needs: [plan, snapshot_mirror, original_crawler, map_host, map_host_fallback, registry_backup]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report child workflow results
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SNAPSHOT_RESULT: ${{ needs.snapshot_mirror.result }}
          ORIGINAL_RESULT: ${{ needs.original_crawler.result }}
          MAPHOST_RESULT: ${{ needs.map_host.result }}
          MAPHOST_FALLBACK_RESULT: ${{ needs.map_host_fallback.result }}
          REGISTRY_RESULT: ${{ needs.registry_backup.result }}
          REGISTRY_STATUS: ${{ needs.registry_backup.outputs.backup_status }}
          MAP_REQUIRED: ${{ needs.plan.outputs.build_maps }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            "============================================================" \
            "ZZX-Bitnodes Crawler results" \
            "============================================================" \
            "plan=${PLAN_RESULT:-unknown}" \
            "snapshot_mirror=${SNAPSHOT_RESULT:-unknown}" \
            "original_crawler=${ORIGINAL_RESULT:-skipped}" \
            "map_required=${MAP_REQUIRED:-false}" \
            "map_host=${MAPHOST_RESULT:-skipped}" \
            "map_host_fallback=${MAPHOST_FALLBACK_RESULT:-skipped}" \
            "registry_backup=${REGISTRY_RESULT:-skipped}" \
            "registry_status=${REGISTRY_STATUS:-not-run}" \
            "============================================================"

          failed=0
          if [ "${PLAN_RESULT:-unknown}" != "success" ]; then
            printf '%s\n' "::error title=Bitnodes planning failed::plan=${PLAN_RESULT:-unknown}"
            failed=1
          fi

          # Primary snapshot success is sufficient for the fast five-minute API
          # path. If it fails, the independent original crawler must succeed.
          if [ "${SNAPSHOT_RESULT:-unknown}" != "success" ] && [ "${ORIGINAL_RESULT:-unknown}" != "success" ]; then
            printf '%s\n' "::error title=Bitnodes acquisition unavailable::primary=${SNAPSHOT_RESULT:-unknown}, original=${ORIGINAL_RESULT:-unknown}"
            failed=1
          fi

          if [ "${MAP_REQUIRED:-false}" = "true" ]; then
            if [ "${SNAPSHOT_RESULT:-unknown}" = "success" ]; then
              if [ "${MAPHOST_RESULT:-unknown}" != "success" ]; then
                printf '%s\n' "::error title=Bitnodes map publication failed::primary map_host=${MAPHOST_RESULT:-unknown}"
                failed=1
              fi
            elif [ "${MAPHOST_FALLBACK_RESULT:-unknown}" != "success" ]; then
              printf '%s\n' "::error title=Bitnodes fallback map publication failed::map_host_fallback=${MAPHOST_FALLBACK_RESULT:-unknown}"
              failed=1
            fi
          fi

          case "${REGISTRY_RESULT:-skipped}" in
            success|skipped) ;;
            *) printf '%s\n' "::warning title=Bitnodes private registry::backup result=${REGISTRY_RESULT}; public data is unaffected" ;;
          esac

          if (( failed )); then
            printf '%s\n' "ZZX-Bitnodes public pipeline failed."
            exit 1
          fi

          printf '%s\n' \
            "ZZX-Bitnodes public pipeline successful." \
            "Fast snapshots are independent from map generation and private backup."
