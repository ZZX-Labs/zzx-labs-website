name: BPI Hourly Master

on:
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: "Maximum live price/volume collection time inside this hourly run"
        required: false
        default: "3120"
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: bpi-hourly-master
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  BPI_CAPTURE_SECONDS: ${{ github.event.inputs.capture_seconds || '3120' }}
  ZZX_MARIADB_HOST: ${{ secrets.BPI_MARIADB_HOST }}
  ZZX_MARIADB_PORT: ${{ secrets.BPI_MARIADB_PORT }}
  ZZX_MARIADB_USER: ${{ secrets.BPI_MARIADB_USER }}
  ZZX_MARIADB_PASSWORD: ${{ secrets.BPI_MARIADB_PASSWORD }}
  ZZX_MARIADB_DATABASE: ${{ secrets.BPI_MARIADB_DATABASE }}

jobs:
  hourly-bpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync repository before hourly capture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate hourly BPI stack
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bpi/run-bpi-master.py
          test -f tools/bpi/bpi_hourly_master.py
          test -f tools/bpi/bpi_hourly_shard.py
          test -f tools/bpi/bpi_archive_rehydrate.py
          test -f tools/bpi/bpi_hourly_validate.py
          test -f tools/bpi/collector.py
          test -f tools/bpi/history_store.py

          python -m py_compile \
            tools/bpi/run-bpi-master.py \
            tools/bpi/bpi_hourly_master.py \
            tools/bpi/bpi_hourly_shard.py \
            tools/bpi/bpi_archive_rehydrate.py \
            tools/bpi/bpi_hourly_validate.py \
            tools/bpi/bpi_mariadb_sync.py \
            tools/bpi/orderbook_store.py \
            tools/bpi/bpi_orderbook_ingest.py \
            tools/bpi/collector.py \
            tools/bpi/history_store.py \
            tools/bpi/update_latest.py \
            tools/bpi/reference_updater.py \
            tools/bpi/update_reference_national_averages.py \
            tools/bpi/update_sovereign_data.py

          python tools/bpi/run-bpi-master.py --hourly --self-test
          python tools/bpi/update_latest.py --self-test
          python tools/bpi/update_sovereign_data.py --self-test
          python tools/bpi/update_reference_national_averages.py --self-test

          python -m json.tool tools/bpi/hourly-config.json >/dev/null
          python -m json.tool tools/bpi/collector-config.json >/dev/null
          python -m json.tool bitcoin/bpi/api/provider_urls.json >/dev/null
          python -m json.tool bitcoin/bpi/api/exchanges.json >/dev/null
          python -m json.tool bitcoin/bpi/api/bpi_index_policy.json >/dev/null
          python -m json.tool bitcoin/bpi/api/orderbook_source_registry.json >/dev/null

      - name: Run hourly BPI acquisition and sequential finalization
        shell: bash
        run: |
          set -euo pipefail

          python tools/bpi/run-bpi-master.py \
            --hourly \
            --capture-seconds "${BPI_CAPTURE_SECONDS}" \
            --finalize-margin-seconds 180 \
            --chunk-rows 50000

      - name: Validate finalized BPI and archive shards
        shell: bash
        run: |
          set -euo pipefail
          python tools/bpi/bpi_hourly_validate.py --root .

          python -m json.tool bitcoin/bpi/api/hourly_status.json >/dev/null
          python -m json.tool bitcoin/bpi/archive/archive-index.json >/dev/null

      - name: Optionally sync finalized SQL shards to MariaDB
        if: ${{ env.ZZX_MARIADB_HOST != '' && env.ZZX_MARIADB_USER != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          python tools/bpi/bpi_mariadb_sync.py --root .

      - name: Commit hourly BPI mirrors and archive shards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          # history.sqlite3 is an ephemeral working database on hosted runners.
          # Long-term recovery is provided by immutable JSONL + MariaDB SQL shards.
          git add -- \
            bitcoin/bpi/api \
            bitcoin/bpi/archive

          git reset -- \
            bitcoin/bpi/history.sqlite3 \
            bitcoin/bpi/history.sqlite3-wal \
            bitcoin/bpi/history.sqlite3-shm \
            bitcoin/bpi/orderbooks.sqlite3 \
            bitcoin/bpi/orderbooks.sqlite3-wal \
            bitcoin/bpi/orderbooks.sqlite3-shm \
            2>/dev/null || true

          if git diff --cached --quiet; then
            printf '%s\n' "No BPI/archive changes to commit."
            exit 0
          fi

          hour_id="$(date -u +'%Y-%m-%dT%H:00Z')"
          git commit -m "Archive BPI hour ${hour_id}"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              printf '%s\n' "Hourly BPI archive pushed."
              exit 0
            fi

            git rebase --abort || true
            printf '%s\n' "Push attempt ${attempt} failed; retrying without force."
            sleep 5
          done

          printf '%s\n' "Failed to push hourly BPI archive without rewriting main."
          exit 1
