name: BPI Hourly Master

on:
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: "Maximum live price/volume collection time inside this hourly run"
        required: false
        default: "3120"
  workflow_call:
    inputs:
      capture_seconds:
        description: "Maximum live price/volume collection time inside this hourly run"
        required: false
        type: string
        default: "3120"
    secrets:
      BPI_MARIADB_HOST:
        required: false
      BPI_MARIADB_PORT:
        required: false
      BPI_MARIADB_USER:
        required: false
      BPI_MARIADB_PASSWORD:
        required: false
      BPI_MARIADB_DATABASE:
        required: false
      BPI_BACKUP_REPO:
        required: false
      BPI_BACKUP_TOKEN:
        required: false
permissions:
  contents: write

concurrency:
  group: bpi-live-market-capture
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BPI_CAPTURE_SECONDS: ${{ inputs.capture_seconds || '3120' }}
  ZZX_MARIADB_HOST: ${{ secrets.BPI_MARIADB_HOST }}
  ZZX_MARIADB_PORT: ${{ secrets.BPI_MARIADB_PORT }}
  ZZX_MARIADB_USER: ${{ secrets.BPI_MARIADB_USER }}
  ZZX_MARIADB_PASSWORD: ${{ secrets.BPI_MARIADB_PASSWORD }}
  ZZX_MARIADB_DATABASE: ${{ secrets.BPI_MARIADB_DATABASE }}

jobs:
  hourly-bpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Checkout repository (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Set up Python (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Sync repository before hourly capture
        shell: bash
        run: |
          set -euo pipefail
          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              fetched=1
              break
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying."
            sleep "$(( attempt * 3 ))"
          done
          test "${fetched}" = "1"
          git reset --hard origin/main

      - name: Validate hourly BPI stack
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bpi/run-bpi-master.py
          test -f tools/bpi/bpi_hourly_master.py
          test -f tools/bpi/bpi_hourly_shard.py
          test -f tools/bpi/bpi_archive_rehydrate.py
          test -f tools/bpi/bpi_hourly_validate.py
          test -f tools/bpi/bpi_git_publish.py
          test -f tools/bpi/collector.py
          test -f tools/bpi/history_store.py
          test -f tools/bpi/master_daemon.py
          test -f tools/bpi/bpi_finalize_completed.py
          test -f tools/bpi/bpi_continuity_selftest.py
          test -f tools/bpi/bpi_private_backup.py

          python3 -m py_compile \
            tools/bpi/run-bpi-master.py \
            tools/bpi/bpi_hourly_master.py \
            tools/bpi/bpi_hourly_shard.py \
            tools/bpi/bpi_archive_rehydrate.py \
            tools/bpi/bpi_hourly_validate.py \
            tools/bpi/bpi_mariadb_sync.py \
            tools/bpi/orderbook_store.py \
            tools/bpi/bpi_orderbook_ingest.py \
            tools/bpi/collector.py \
            tools/bpi/history_store.py \
            tools/bpi/master_daemon.py \
            tools/bpi/bpi_finalize_completed.py \
            tools/bpi/bpi_continuity_selftest.py \
            tools/bpi/bpi_runtime_healthcheck.py \
            tools/bpi/workflow_contract_selftest.py \
            tools/bpi/bpi_private_backup.py \
            tools/bpi/bpi_git_publish.py \
            tools/bpi/update_latest.py \
            tools/bpi/reference_updater.py \
            tools/bpi/update_reference_national_averages.py \
            tools/bpi/update_sovereign_data.py

          if test -f tools/bpi/update_exchange_rates.py; then
            python3 -m py_compile tools/bpi/update_exchange_rates.py
          fi

          if test -f tools/bpi/update_deadopop.py; then
            python3 -m py_compile tools/bpi/update_deadopop.py
          fi

          if test -f tools/bpi/update_themarketbtccreated.py; then
            python3 -m py_compile tools/bpi/update_themarketbtccreated.py
          fi

          python3 tools/bpi/run-bpi-master.py --hourly --self-test
          python3 tools/bpi/bpi_continuity_selftest.py
          python3 tools/bpi/bpi_runtime_healthcheck.py --self-test
          python3 tools/bpi/workflow_contract_selftest.py
          python3 tools/bpi/bpi_private_backup.py --self-test
          python3 tools/bpi/update_latest.py --self-test
          python3 tools/bpi/update_sovereign_data.py --self-test
          python3 tools/bpi/update_reference_national_averages.py --self-test

          python3 -m json.tool tools/bpi/hourly-config.json >/dev/null
          python3 -m json.tool tools/bpi/collector-config.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/provider_urls.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/exchanges.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/bpi_index_policy.json >/dev/null
          python3 -m json.tool bitcoin/bpi/api/orderbook_source_registry.json >/dev/null

      - name: Run hourly BPI acquisition and sequential finalization
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/bpi/run-bpi-master.py \
            --hourly \
            --capture-seconds "${BPI_CAPTURE_SECONDS}" \
            --finalize-margin-seconds 90 \
            --no-hour-boundary \
            --chunk-rows 10000

      - name: Validate finalized BPI and archive shards
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/bpi/bpi_hourly_validate.py --root .

          python3 -m json.tool bitcoin/bpi/api/hourly_status.json >/dev/null
          python3 -m json.tool bitcoin/bpi/archive/archive-index.json >/dev/null

      - name: Stage immutable BPI run for private retention
        shell: bash
        run: |
          set -euo pipefail

          STAGE="${RUNNER_TEMP}/bpi-private-run"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/archive" "${STAGE}/api"

          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path('.')
          stage=Path(os.environ['RUNNER_TEMP'])/'bpi-private-run'
          status=json.loads((root/'bitcoin/bpi/api/hourly_status.json').read_text(encoding='utf-8'))
          manifests=[]
          for rel in status.get('archive_manifests') or []:
              src=(root/rel).resolve()
              if not src.is_file():
                  continue
              hour=src.parent
              dst=stage/'archive'/Path(rel).parent.relative_to('bitcoin/bpi/archive')
              if dst.exists(): shutil.rmtree(dst)
              shutil.copytree(hour,dst)
              manifests.append(rel)
          # Current public state is useful for point-in-time reconstruction, but
          # the immutable hourly shards above are the historical source of truth.
          for name in ('prices.json','markets.json','latest.json','history-live.json','hourly_status.json'):
              src=root/'bitcoin/bpi/api'/name
              if src.is_file(): shutil.copy2(src,stage/'api'/name)
          (stage/'run-manifest.json').write_text(json.dumps({
              'schema':'zzx-bpi-private-run-v1',
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'archive_manifests':manifests,
          },indent=2)+'\n',encoding='utf-8')
          PY

      - name: Resolve private BPI backup availability
        id: private_backup_preflight
        shell: bash
        env:
          BPI_BACKUP_REPO: ${{ secrets.BPI_BACKUP_REPO }}
          BPI_BACKUP_TOKEN: ${{ secrets.BPI_BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          repo_set=false
          token_set=false
          [ -n "${BPI_BACKUP_REPO:-}" ] && repo_set=true
          [ -n "${BPI_BACKUP_TOKEN:-}" ] && token_set=true

          if [ "${repo_set}" = true ] && [ "${token_set}" = true ]; then
            printf '%s\n' \
              "enabled=true" \
              "status=ready" \
              >> "${GITHUB_OUTPUT}"
            printf '%s\n' "Private BPI backup repository is configured."
            exit 0
          fi

          printf '%s\n' \
            "enabled=false" \
            "status=skipped-auth" \
            >> "${GITHUB_OUTPUT}"

          if [ "${repo_set}" = false ] && [ "${token_set}" = false ]; then
            printf '%s\n' \
              "Private BPI backup is not configured; optional private retention is skipped."
          else
            printf '%s\n' \
              "::warning title=BPI private backup configuration::Private backup configuration is incomplete. Configure both BPI_BACKUP_REPO and BPI_BACKUP_TOKEN, or leave both unset."
          fi

      - name: Backup immutable BPI run to private repository
        id: private_backup
        if: ${{ steps.private_backup_preflight.outputs.enabled == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          BPI_BACKUP_REPO: ${{ secrets.BPI_BACKUP_REPO }}
          BPI_BACKUP_TOKEN: ${{ secrets.BPI_BACKUP_TOKEN }}
        run: |
          set -euo pipefail

          # Credentials were validated by private_backup_preflight. Treat any
          # failure below as a non-critical backup-sink failure; acquisition,
          # public publication, hourly archives and MariaDB remain independent.
          test -n "${BPI_BACKUP_REPO}"
          test -n "${BPI_BACKUP_TOKEN}"

          TMP="$(mktemp -d)"
          ASKPASS="$(mktemp)"
          trap 'rm -rf "${TMP}"; rm -f "${ASKPASS}"' EXIT
          cat > "${ASKPASS}" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "${BPI_BACKUP_TOKEN}" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS
          chmod 700 "${ASKPASS}"
          export GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0

          git clone --filter=blob:none --no-checkout --single-branch --branch main \
            "https://github.com/${BPI_BACKUP_REPO}.git" "${TMP}"
          git -C "${TMP}" sparse-checkout init --cone
          git -C "${TMP}" sparse-checkout set bpi/latest bpi/history-runs
          git -C "${TMP}" checkout main

          RUN_DIR="bpi/history-runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${TMP}/${RUN_DIR}"
          cp -a "${RUNNER_TEMP}/bpi-private-run/." "${TMP}/${RUN_DIR}/"
          rm -rf "${TMP}/bpi/latest"
          mkdir -p "${TMP}/bpi/latest"
          cp -a "${RUNNER_TEMP}/bpi-private-run/." "${TMP}/bpi/latest/"

          git -C "${TMP}" config user.name "zzx-bpi-backup-bot"
          git -C "${TMP}" config user.email "actions@github.com"
          git -C "${TMP}" add --sparse "${RUN_DIR}" bpi/latest
          if git -C "${TMP}" diff --cached --quiet; then
            printf '%s\n' "Private BPI backup already contains this run."
            exit 0
          fi
          git -C "${TMP}" commit -m "BPI immutable run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for attempt in 1 2 3 4 5; do
            if git -C "${TMP}" push origin HEAD:main; then
              printf '%s\n' "Private BPI run backup pushed successfully."
              exit 0
            fi

            printf '%s\n' \
              "Private BPI push attempt ${attempt}/5 failed; replaying on newest main."

            if git -C "${TMP}" fetch --prune origin main; then
              git -C "${TMP}" rebase origin/main || {
                git -C "${TMP}" rebase --abort || true
                # Keep the immutable run files and replay the generated commit
                # without force-pushing or rewriting remote history.
                git -C "${TMP}" reset --soft origin/main
                git -C "${TMP}" commit -m \
                  "BPI immutable run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
              }
            fi

            sleep "$(( attempt * 3 ))"
          done

          printf '%s\n' \
            "::warning title=BPI private backup::Private Git backup failed after retries. The public BPI pipeline remains valid; no remote artifact fallback is attempted; configure the private backup sink for durable retention."
          exit 1

      - name: Create local BPI emergency archive after configured backup failure
        if: >-
          ${{
            always() &&
            steps.private_backup_preflight.outputs.enabled == 'true' &&
            steps.private_backup.outcome != 'success'
          }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/bpi-private-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          if [ -d "${RUNNER_TEMP}/bpi-private-run" ]; then
            tar -C "${RUNNER_TEMP}" -czf "${ARCHIVE}" bpi-private-run
            sha256sum "${ARCHIVE}"
            printf '%s\n' "Local BPI emergency archive created after configured private-backup failure: ${ARCHIVE}"
          fi
      - name: Report private BPI retention status
        if: ${{ always() }}
        shell: bash
        env:
          PREFLIGHT_STATUS: ${{ steps.private_backup_preflight.outputs.status }}
          BACKUP_OUTCOME: ${{ steps.private_backup.outcome }}
        run: |
          set -euo pipefail

          case "${PREFLIGHT_STATUS:-unknown}" in
            ready)
              if [ "${BACKUP_OUTCOME:-}" = "success" ]; then
                printf '%s\n' "Private BPI retention: repository backup successful."
              else
                printf '%s\n' \
                  "::warning title=BPI private retention::Private repository backup outcome=${BACKUP_OUTCOME:-unknown}. This does not gate live capture, public archives, publication or MariaDB."
              fi
              ;;
            skipped-auth)
              printf '%s\n' \
                "Private BPI retention is disabled because backup credentials are not configured."
              ;;
            *)
              printf '%s\n' \
                "::warning title=BPI private retention::Unexpected private-backup preflight status=${PREFLIGHT_STATUS:-unknown}. Live/public BPI is unaffected."
              ;;
          esac

      - name: Optionally sync finalized SQL shards to MariaDB
        if: ${{ env.ZZX_MARIADB_HOST != '' && env.ZZX_MARIADB_USER != '' }}
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client

          python3 tools/bpi/bpi_mariadb_sync.py --root .

      - name: Publish hourly BPI mirrors and archive shards
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          hour_id="$(date -u +'%Y-%m-%dT%H:00Z')"

          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Archive BPI hour ${hour_id}" \
            --path bitcoin/bpi/api \
            --path bitcoin/bpi/archive \
            --attempts 5 \
            --sleep-seconds 5
