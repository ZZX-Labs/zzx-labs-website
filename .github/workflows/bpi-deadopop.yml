name: Update DeadOPop

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: bpi-deadopop
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  update-deadopop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate DeadOPop updater
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/bpi/update_deadopop.py
          python tools/bpi/update_deadopop.py --help

      - name: Generate DeadOPop from archival registry
        shell: bash
        run: |
          set -euo pipefail

          # The updater owns registry discovery. Do not independently gate on
          # one hardcoded path and do not overwrite the last valid API output
          # with a zero/unavailable marker when discovery fails.
          python tools/bpi/update_deadopop.py \
            --output bitcoin/bpi/api/deadopop.json

      - name: Validate DeadOPop contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path("bitcoin/bpi/api/deadopop.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if data.get("source") != "zzx_deadcoins_archival_registry":
              raise SystemExit(
                  "refusing legacy/non-archival DeadOPop source"
              )

          if data.get("available") is not True:
              raise SystemExit(
                  "generated DeadOPop must be available=true"
              )

          if data.get("bitcoin_excluded") is not True:
              raise SystemExit(
                  "DeadOPop did not explicitly exclude Bitcoin"
              )

          registry_source = str(
              data.get("registry_source_path") or ""
          ).strip()

          if not registry_source:
              raise SystemExit(
                  "DeadOPop did not record the loaded registry path"
              )

          count = int(data.get("total_dead_coins", 0))
          lost = float(
              data.get("combined_estimated_value_lost_usd", 0)
          )
          peak = float(
              data.get("combined_peak_market_cap_usd", 0)
          )
          top = data.get("top_dead_coins")

          if count < 1:
              raise SystemExit(
                  "DeadOPop contains zero dead coins"
              )

          if not math.isfinite(lost) or lost <= 0:
              raise SystemExit(
                  "DeadOPop combined lost value is invalid"
              )

          if not math.isfinite(peak) or peak < 0:
              raise SystemExit(
                  "DeadOPop combined peak market cap is invalid"
              )

          if not isinstance(top, list) or not top:
              raise SystemExit(
                  "DeadOPop top_dead_coins must be non-empty"
              )

          print(
              "DeadOPop archival contract valid: "
              f"registry={registry_source} "
              f"dead_coins={count} "
              f"combined_lost_usd={lost:.2f} "
              f"top={len(top)}"
          )
          PY

      - name: Commit and push DeadOPop data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          git add bitcoin/bpi/api/deadopop.json

          if git diff --cached --quiet; then
            printf '%s\n' "No DeadOPop changes."
            exit 0
          fi

          git commit -m "Update DeadOPop data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                printf '%s\n' "DeadOPop data pushed."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            git reset --hard HEAD
            git clean -fdx
            printf '%s\n' \
              "DeadOPop push attempt ${attempt} failed; retrying without force."
            sleep 5
          done

          printf '%s\n' \
            "Failed to push DeadOPop data without rewriting main."
          exit 1
