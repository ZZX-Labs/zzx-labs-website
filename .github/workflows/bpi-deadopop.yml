name: Update DeadOPop + TheMarketBTCCreated

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "DeadOPop scan mode"
        required: true
        default: "current"
        type: choice
        options:
          - current
          - backfill
      start_year:
        description: "Historical backfill start year"
        required: false
        default: "2009"
        type: string
      end_year:
        description: "Historical backfill end year; blank = current year"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      mode:
        description: "DeadOPop scan mode"
        required: false
        type: string
        default: "current"
      start_year:
        description: "Historical backfill start year"
        required: false
        type: string
        default: "2009"
      end_year:
        description: "Historical backfill end year; blank = current year"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: bpi-deadopop
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  DEADOPOP_REGISTRY: bitcoin/bpi/data/deadcoins_registry.json
  DEADOPOP_CANDIDATES: bitcoin/bpi/data/deadcoins_candidates.json
  DEADOPOP_STATE: bitcoin/bpi/data/deadcoins_scan_state.json
  DEADOPOP_SOURCES: bitcoin/bpi/data/deadcoins_sources.json
  DEADOPOP_API: bitcoin/bpi/api/deadopop.json
  MARKET_CREATED_API: bitcoin/bpi/api/themarketbtccreated.json

jobs:
  deadopop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              fetched=1
              break
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying."
            sleep "$(( attempt * 3 ))"
          done
          test "${fetched}" = "1"
          git reset --hard origin/main

      - name: Validate DeadOPop programs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/bpi/deadopop_scan.py \
            tools/bpi/update_deadopop.py \
            tools/bpi/update_themarketbtccreated.py \
            tools/bpi/bpi_git_publish.py

          python tools/bpi/deadopop_scan.py --help >/dev/null
          python tools/bpi/update_deadopop.py --help >/dev/null
          python tools/bpi/update_themarketbtccreated.py --help >/dev/null

          test -s "${DEADOPOP_REGISTRY}"
          test -s "${DEADOPOP_SOURCES}"

      - name: Ensure scanner state files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s "${DEADOPOP_CANDIDATES}" ]; then
            printf '%s\n' \
              '{"schema":"zzx-deadopop-candidates-v1","candidates":[]}' \
              > "${DEADOPOP_CANDIDATES}"
          fi

          if [ ! -s "${DEADOPOP_STATE}" ]; then
            printf '%s\n' \
              '{"schema":"zzx-deadopop-scan-state-v1","seen_evidence_ids":[],"backfill_year":2009}' \
              > "${DEADOPOP_STATE}"
          fi

      - name: Discover and promote failed/dead/scam assets
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode || 'current' }}
          INPUT_START_YEAR: ${{ inputs.start_year || '2009' }}
          INPUT_END_YEAR: ${{ inputs.end_year || '' }}
        run: |
          set -euo pipefail

          MODE="${INPUT_MODE}"
          START_YEAR="${INPUT_START_YEAR}"
          END_YEAR="${INPUT_END_YEAR}"

          ARGS=(
            --registry "${DEADOPOP_REGISTRY}"
            --candidates "${DEADOPOP_CANDIDATES}"
            --state "${DEADOPOP_STATE}"
            --sources "${DEADOPOP_SOURCES}"
            --mode "${MODE}"
            --start-year "${START_YEAR}"
            --promote
          )

          if [ -n "${END_YEAR}" ]; then
            ARGS+=(--end-year "${END_YEAR}")
          fi

          if [ "${MODE}" = "current" ]; then
            ARGS+=(--rolling-backfill)
          fi

          python tools/bpi/deadopop_scan.py "${ARGS[@]}"

      - name: Build DeadOPop API
        shell: bash
        run: |
          set -euo pipefail

          python tools/bpi/update_deadopop.py \
            --registry "${DEADOPOP_REGISTRY}" \
            --output "${DEADOPOP_API}" \
            --top 100

      - name: Build TheMarketBTCCreated appraisal
        shell: bash
        run: |
          set -euo pipefail

          python tools/bpi/update_themarketbtccreated.py \
            --deadopop "${DEADOPOP_API}" \
            --output "${MARKET_CREATED_API}"

      - name: Validate DeadOPop and appraisal contracts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          dead = json.loads(
              Path(os.environ["DEADOPOP_API"]).read_text(encoding="utf-8")
          )
          market = json.loads(
              Path(os.environ["MARKET_CREATED_API"]).read_text(encoding="utf-8")
          )

          if dead.get("source") != "zzx_deadcoins_archival_registry":
              raise SystemExit("invalid DeadOPop source")

          if dead.get("bitcoin_excluded") is not True:
              raise SystemExit("Bitcoin must be excluded from DeadOPop")

          total = int(dead.get("total_dead_coins", 0))
          valued = int(dead.get("valued_dead_coins", 0))
          unvalued = int(dead.get("unvalued_dead_coins", 0))
          lost = float(dead.get("combined_estimated_value_lost_usd", 0))

          if total < 1 or valued < 1:
              raise SystemExit("DeadOPop registry is unexpectedly empty")

          if valued + unvalued != total:
              raise SystemExit("DeadOPop valuation counts do not reconcile")

          if not math.isfinite(lost) or lost <= 0:
              raise SystemExit("DeadOPop cumulative loss is invalid")

          outputs = market.get("outputs") or {}
          appraised = float(
              outputs.get("deadopop_adjusted_appraised_btc_price_usd", 0)
          )
          market_created = float(
              outputs.get("the_market_btc_created_price_usd", 0)
          )

          if not math.isfinite(appraised) or appraised <= 0:
              raise SystemExit("DeadOPop-adjusted BTC appraisal invalid")

          if appraised < market_created:
              raise SystemExit(
                  "DeadOPop-adjusted appraisal cannot be below "
                  "TheMarketBTCCreated baseline"
              )

          capture = float(
              outputs.get(
                  "btc_capture_percent_of_created_market_plus_deadopop",
                  -1,
              )
          )
          inverse = float(
              outputs.get("inverse_unabsorbed_percent", -1)
          )

          if abs((capture + inverse) - 100.0) > 1e-6:
              raise SystemExit(
                  "capture and inverse/unabsorbed percentages do not sum to 100"
              )

          print(
              "DeadOPop/TheMarketBTCCreated contract valid:",
              f"dead={total}",
              f"valued={valued}",
              f"unvalued={unvalued}",
              f"lost_usd={lost:.2f}",
              f"appraised_btc_usd={appraised:.2f}",
          )
          PY

      - name: Publish DeadOPop state without rebasing generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-deadopop-bot"
          git config user.email "actions@github.com"
          python tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update DeadOPop registry and BTC appraisal" \
            --path "${DEADOPOP_REGISTRY}" \
            --path "${DEADOPOP_CANDIDATES}" \
            --path "${DEADOPOP_STATE}" \
            --path "${DEADOPOP_API}" \
            --path "${MARKET_CREATED_API}" \
            --attempts 5 \
            --sleep-seconds 5
