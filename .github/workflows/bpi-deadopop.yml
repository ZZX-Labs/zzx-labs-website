name: Update DeadOPop

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: bpi-deadopop
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  update-deadopop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate DeadOPop updater and registry
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile tools/bpi/update_deadopop.py

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bitcoin/bpi/data/deadcoins_registry.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          entries = data.get("entries") if isinstance(data, dict) else data

          if not isinstance(entries, list) or not entries:
              raise SystemExit("deadcoins_registry.json must contain entries")

          if any(
              str(item.get("id") or "") == "REPLACE_WITH_CANONICAL_ID"
              for item in entries
              if isinstance(item, dict)
          ):
              raise SystemExit(
                  "deadcoins_registry.json still contains the template placeholder"
              )

          print(f"Dead-coin registry entries={len(entries)}")
          PY

      - name: Update DeadOPop data
        shell: bash
        run: |
          set -euo pipefail
          python tools/bpi/update_deadopop.py

      - name: Validate DeadOPop contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(
              Path("bitcoin/bpi/api/deadopop.json").read_text(
                  encoding="utf-8"
              )
          )

          count = int(data.get("total_dead_coins", 0))
          lost = float(data.get("combined_estimated_value_lost_usd", 0))
          peak = float(data.get("combined_peak_market_cap_usd", 0))
          top = data.get("top_dead_coins")

          if count < 1:
              raise SystemExit("DeadOPop contains zero dead coins")

          if not math.isfinite(lost) or lost <= 0:
              raise SystemExit("DeadOPop combined lost value is invalid")

          if not math.isfinite(peak) or peak < 0:
              raise SystemExit("DeadOPop combined peak market cap is invalid")

          if not isinstance(top, list) or not top:
              raise SystemExit("DeadOPop top_dead_coins must be non-empty")

          if data.get("bitcoin_excluded") is not True:
              raise SystemExit("DeadOPop did not explicitly exclude Bitcoin")

          allowed = {
              "bankrupt",
              "insolvent",
              "scam",
              "rug_pull",
              "fraud",
              "collapsed",
              "abandoned",
              "shutdown",
              "dead",
              "delisted_dead",
              "protocol_failure",
              "exchange_failure",
              "zeroed_out",
          }

          for index, item in enumerate(top):
              if not isinstance(item, dict):
                  raise SystemExit(f"top_dead_coins[{index}] is not an object")

              status = str(item.get("status") or "")
              loss = float(item.get("estimated_value_lost_usd") or 0)

              if status not in allowed:
                  raise SystemExit(
                      f"top_dead_coins[{index}] has invalid status: {status}"
                  )

              if not math.isfinite(loss) or loss <= 0:
                  raise SystemExit(
                      f"top_dead_coins[{index}] has invalid lost value"
                  )

          print(
              "DeadOPop contract valid: "
              f"dead_coins={count} "
              f"combined_lost_usd={lost:.2f} "
              f"top={len(top)}"
          )
          PY

      - name: Commit and push DeadOPop data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"

          git add \
            bitcoin/bpi/api/deadopop.json

          if git diff --cached --quiet; then
            printf '%s\n' "No DeadOPop changes."
            exit 0
          fi

          git commit -m "Update DeadOPop data"

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              printf '%s\n' "DeadOPop data pushed."
              exit 0
            fi

            git rebase --abort || true
            printf '%s\n' \
              "DeadOPop push attempt ${attempt} failed; retrying without force."
            sleep 5
          done

          printf '%s\n' \
            "Failed to push DeadOPop data without rewriting main."
          exit 1
