name: ZZX World Factbook Corpus Refresh
on:
  workflow_dispatch:
    inputs:
      start_year: {type: number, default: 1962}
      end_year: {type: number, default: 2027}
  schedule:
    - cron: '27 5 * * *'
permissions:
  contents: write
jobs:
  archive:
    uses: ./.github/workflows/zzx-worldfactbook-archive-sync.yml
    with:
      start_year: ${{ inputs.start_year || 1962 }}
      end_year: ${{ inputs.end_year || 2027 }}
      kind: corpus
    secrets: inherit
