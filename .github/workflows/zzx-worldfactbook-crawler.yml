name: ZZX-WorldFactbook Corpus Crawler

run-name: >-
  ZZX-WorldFactbook / ${{ github.event_name }} / ${{ inputs.start_year || '1962' }}-${{ inputs.end_year || '2027' }} / run-${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental skips complete editions; refresh reprocesses selected editions"
        required: false
        default: "incremental"
        type: choice
        options: [incremental, refresh]
      start_year:
        description: "Oldest edition year to inspect"
        required: false
        default: "1962"
        type: string
      end_year:
        description: "Newest normalized edition year (2026-2027 book = 2027)"
        required: false
        default: "2027"
        type: string
      direction:
        description: "Process latest editions first while manual books are being entered"
        required: false
        default: "newest-first"
        type: choice
        options: [newest-first, oldest-first]
      years_per_job:
        description: "Edition years per resumable runner job"
        required: false
        default: "1"
        type: string
      providers:
        description: "Source providers; manual is local physical-book/transcription input"
        required: false
        default: "manual,ia,wayback"
        type: string
      max_ia_items:
        description: "Maximum Internet Archive title candidates per edition"
        required: false
        default: "8"
        type: string
      max_wayback_pages:
        description: "Maximum country pages per edition when Wayback fallback is needed"
        required: false
        default: "260"
        type: string

  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: zzx-worldfactbook-corpus
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  WFB_CACHE: .cache/worldfactbook-v4
  WFB_PORTAL: worldfactbook/api
  WFB_DB: worldfactbook/db
  WFB_PORTAL_START: "1962"
  WFB_PORTAL_END: "2027"

jobs:
  plan:
    name: Plan resumable edition shards
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        name: Build year windows
        shell: bash
        env:
          START_YEAR: ${{ inputs.start_year || '1962' }}
          END_YEAR: ${{ inputs.end_year || '2027' }}
          DIRECTION: ${{ inputs.direction || 'newest-first' }}
          YEARS_PER_JOB: ${{ inputs.years_per_job || '1' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          start=int(os.environ['START_YEAR']); end=int(os.environ['END_YEAR']); width=max(1,int(os.environ['YEARS_PER_JOB']))
          if os.environ.get('EVENT_NAME') == 'schedule':
              from datetime import datetime, timezone
              now=datetime.now(timezone.utc).year
              start=max(1962, now-1); end=min(2027, now+1)
          if start < 1962 or end > 2027 or start > end:
              raise SystemExit('World Factbook year range must be within 1962..2027')
          chunks=[]
          y=start
          while y <= end:
              chunks.append({'start': y, 'end': min(end, y+width-1)})
              y += width
          if os.environ['DIRECTION'] == 'newest-first':
              chunks.reverse()
          matrix=json.dumps({'include': chunks}, separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + matrix + '\n')
          print(f'Planned {len(chunks)} resumable jobs: {start}-{end}, width={width}, direction={os.environ["DIRECTION"]}')
          PY

  corpus_shard:
    name: Edition shard ${{ matrix.start }}-${{ matrix.end }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout newest main with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags origin main
          git checkout --force -B main origin/main
          git clean -fdx

      - name: Install deterministic local extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils \
            p7zip-full \
            libarchive-tools \
            antiword \
            unrtf \
            djvulibre-bin \
            python3-pil

      - name: Validate crawler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/worldfactbook/formats.py \
            tools/worldfactbook/media.py \
            tools/worldfactbook/shard_store.py \
            tools/worldfactbook/worldfactbook_crawler.py
          python3 tools/worldfactbook/worldfactbook_crawler.py --self-test

      - name: Crawl text corpus for this edition shard
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode || 'incremental' }}
          INPUT_PROVIDERS: ${{ inputs.providers || 'manual,ia,wayback' }}
          INPUT_IA: ${{ inputs.max_ia_items || '8' }}
          INPUT_WAYBACK: ${{ inputs.max_wayback_pages || '260' }}
        run: |
          set -euo pipefail
          python3 tools/worldfactbook/worldfactbook_crawler.py \
            --repo-root . \
            --cache-dir "${WFB_CACHE}" \
            --portal-root "${WFB_PORTAL}" \
            --db-root "${WFB_DB}" \
            --media-root worldfactbook/media \
            --manual-root worldfactbook/manual/editions \
            --country-registry __partials/widgets/global-power-grid/data/countries.json \
            --extra-source-manifest tools/worldfactbook/extra-sources.json \
            --start-year "${{ matrix.start }}" \
            --end-year "${{ matrix.end }}" \
            --portal-start-year "${WFB_PORTAL_START}" \
            --portal-end-year "${WFB_PORTAL_END}" \
            --mode "${INPUT_MODE}" \
            --providers "${INPUT_PROVIDERS}" \
            --max-ia-items "${INPUT_IA}" \
            --max-files-per-edition 1 \
            --max-wayback-pages "${INPUT_WAYBACK}" \
            --max-download-mb 1500 \
            --workers 6 \
            --sleep 0.12 \
            --media-mode none

      - name: Validate shard output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          start=${{ matrix.start }}; end=${{ matrix.end }}
          api=Path('worldfactbook/api')
          idx=json.loads((api/'portal-index.json').read_text(encoding='utf-8'))
          if idx.get('schema') != 'zzx-worldfactbook-portal-index-v1':
              raise SystemExit('bad portal-index schema')
          if int(idx.get('start_year')) != 1962 or int(idx.get('end_year')) != 2027:
              raise SystemExit('portal range regressed')
          statuses={}
          for year in range(start,end+1):
              p=api/'editions'/str(year)/'index.json'
              if not p.is_file():
                  raise SystemExit(f'missing edition checkpoint: {p}')
              edition=json.loads(p.read_text(encoding='utf-8'))
              status=str(edition.get('status') or '')
              if status not in {'available','missing'}:
                  raise SystemExit(f'invalid edition checkpoint status for {year}: {status!r}')
              statuses[year]=(status,str(edition.get('availability_reason') or ''))
          report=json.loads((api/'crawl-report.json').read_text(encoding='utf-8'))
          if report.get('processed_range') != [start,end]:
              raise SystemExit(f'wrong processed range: {report.get("processed_range")}')
          processed={int(row['year']):row for row in report.get('processed_editions') or []}
          for year in range(start,end+1):
              if year not in processed:
                  raise SystemExit(f'crawl report missing processed-edition result for {year}')
              state=str(processed[year].get('status') or '')
              if state in {'discovery-error','extraction-empty','extraction-failed'}:
                  raise SystemExit(f'edition {year} ended in hard failure state: {state}')
              if state == 'source-missing':
                  print(f'::warning title=World Factbook coverage gap::{year} has no source yet; explicit missing checkpoint published for later backfill')
          print('validated resumable shard', start, end, statuses)
          PY

      - name: Publish this completed shard immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-worldfactbook-bot"
          git config user.email "actions@github.com"
          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "World Factbook editions ${{ matrix.start }}-${{ matrix.end }}" \
            --path worldfactbook/api \
            --path worldfactbook/db \
            --attempts 8 \
            --sleep-seconds 6

  rebuild_global_power_grid:
    name: Rebuild Global Power Grid from Factbook corpus
    needs: corpus_shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout newest main with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags origin main
          git checkout --force -B main origin/main
          git clean -fdx

      - name: Rebuild Global Power Grid compatibility databases from corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/worldfactbook/factbook_archive_sync.py \
            tools/worldfactbook/global_power_grid_sync.py
          python3 tools/worldfactbook/global_power_grid_sync.py --self-test
          python3 tools/worldfactbook/global_power_grid_sync.py \
            --country-registry __partials/widgets/global-power-grid/data/countries.json \
            --corpus-root worldfactbook/api/editions \
            --electricity-output worldfactbook/api/electricity-history.json \
            --reference-output worldfactbook/api/reference-index.json \
            --power-grid-output bitcoin/power-grid/api/factbook-history.json \
            --widget-output __partials/widgets/global-power-grid/data/factbook-history.json \
            --start-year 1962 \
            --end-year 2027 \
            --preserve-existing \
            | tee worldfactbook/api/global-power-grid-sync-report.json

      - name: Validate rebuilt Global Power Grid databases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          ledgers = [
              Path('worldfactbook/api/electricity-history.json'),
              Path('bitcoin/power-grid/api/factbook-history.json'),
              Path('__partials/widgets/global-power-grid/data/factbook-history.json'),
          ]
          payloads=[]
          for path in ledgers:
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f'missing/empty Global Power Grid ledger: {path}')
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('schema') != 'zzx-global-power-grid-factbook-history-v2':
                  raise SystemExit(f'bad Global Power Grid schema: {path}: {data.get("schema")}')
              if int(data.get('scan_end_year') or 0) != 2027:
                  raise SystemExit(f'Global Power Grid range not extended through 2027: {path}')
              payloads.append(data)

          canonical=json.dumps(payloads[0], sort_keys=True, separators=(',',':'))
          for path,data in zip(ledgers[1:],payloads[1:]):
              if json.dumps(data, sort_keys=True, separators=(',',':')) != canonical:
                  raise SystemExit(f'Global Power Grid ledger copies diverged: {path}')

          records=payloads[0].get('records') or []
          if not records:
              raise SystemExit('Global Power Grid ledger has zero records')
          bad=[]
          for row in records:
              quality=row.get('quality') or {}
              if str(quality.get('status') or '').lower() != 'verified':
                  bad.append((row.get('country'),row.get('edition_year'),'status'))
              if int(quality.get('parser_version') or 0) < 2:
                  bad.append((row.get('country'),row.get('edition_year'),'parser'))
          if bad:
              raise SystemExit(f'unverified Global Power Grid records: {bad[:10]}')

          ref=Path('worldfactbook/api/reference-index.json')
          ref_data=json.loads(ref.read_text(encoding='utf-8'))
          if ref_data.get('schema') != 'zzx-worldfactbook-reference-index-v2':
              raise SystemExit('bad reference-index schema')
          if int(ref_data.get('scan_end_year') or 0) != 2027:
              raise SystemExit('reference-index range not extended through 2027')

          print(
              'Global Power Grid corpus rebuild validated:',
              f"records={len(records)}",
              f"countries={payloads[0].get('country_count')}",
              f"latest={payloads[0].get('latest_edition')}",
              f"missing={payloads[0].get('corpus_missing_years')}",
          )
          PY

      - name: Publish Global Power Grid databases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-worldfactbook-bot"
          git config user.email "actions@github.com"
          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Rebuild Global Power Grid from World Factbook corpus" \
            --path worldfactbook/api/electricity-history.json \
            --path worldfactbook/api/reference-index.json \
            --path worldfactbook/api/global-power-grid-sync-report.json \
            --path bitcoin/power-grid/api/factbook-history.json \
            --path __partials/widgets/global-power-grid/data/factbook-history.json \
            --path __partials/widgets/global-power-grid/data/worldfactbook-source-catalog.json \
            --path __partials/widgets/global-power-grid/data/sources.json \
            --attempts 8 \
            --sleep-seconds 6
