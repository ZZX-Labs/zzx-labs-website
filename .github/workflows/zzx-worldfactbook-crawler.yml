name: ZZX-WorldFactbook Crawler

run-name: >-
  ZZX-WorldFactbook Crawler / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Incremental keeps verified local editions; rebuild regenerates the 1962-2025 corpus"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - rebuild
      start_year:
        description: "First Factbook edition year"
        required: false
        default: "1962"
        type: string
      end_year:
        description: "Last Factbook edition year"
        required: false
        default: "2025"
        type: string
      max_ia_items:
        description: "Maximum Internet Archive collection candidates examined per edition"
        required: false
        default: "12"
        type: string
      max_wayback_pages:
        description: "Maximum Wayback country pages examined per fallback edition"
        required: false
        default: "320"
        type: string

  workflow_call:
    inputs:
      mode:
        required: false
        type: string
        default: "incremental"
      start_year:
        required: false
        type: string
        default: "1962"
      end_year:
        required: false
        type: string
        default: "2025"
      max_ia_items:
        required: false
        type: string
        default: "12"
      max_wayback_pages:
        required: false
        type: string
        default: "320"
    secrets:
      WORLDFACTBOOK_MARIADB_HOST:
        required: false
      WORLDFACTBOOK_MARIADB_PORT:
        required: false
      WORLDFACTBOOK_MARIADB_USER:
        required: false
      WORLDFACTBOOK_MARIADB_PASSWORD:
        required: false
      WORLDFACTBOOK_MARIADB_DATABASE:
        required: false

  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: zzx-worldfactbook-crawler
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  WFB_CACHE: .cache/worldfactbook-v3
  WFB_PORTAL: worldfactbook/api
  WFB_DB: worldfactbook/db

jobs:
  corpus:
    name: Crawl Complete World Factbook Corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WORLDFACTBOOK_MARIADB_HOST: ${{ secrets.WORLDFACTBOOK_MARIADB_HOST }}
      WORLDFACTBOOK_MARIADB_PORT: ${{ secrets.WORLDFACTBOOK_MARIADB_PORT }}
      WORLDFACTBOOK_MARIADB_USER: ${{ secrets.WORLDFACTBOOK_MARIADB_USER }}
      WORLDFACTBOOK_MARIADB_PASSWORD: ${{ secrets.WORLDFACTBOOK_MARIADB_PASSWORD }}
      WORLDFACTBOOK_MARIADB_DATABASE: ${{ secrets.WORLDFACTBOOK_MARIADB_DATABASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx -e "${WFB_CACHE}/"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install archival format tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils \
            calibre \
            p7zip-full \
            libarchive-tools \
            antiword \
            unrtf \
            djvulibre-bin \
            tesseract-ocr \
            tesseract-ocr-eng \
            fonts-dejavu-core \
            libreoffice-writer \
            mariadb-client

          python -m pip install --upgrade pip
          python -m pip install \
            pypdf \
            pymupdf \
            pillow \
            opencv-python-headless \
            pytesseract \
            beautifulsoup4

      - name: Restore archival source cache
        uses: actions/cache@v4
        with:
          path: .cache/worldfactbook-v3
          key: worldfactbook-corpus-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            worldfactbook-corpus-v3-${{ runner.os }}-
            worldfactbook-corpus-v3-

      - name: Validate World Factbook crawler
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            tools/worldfactbook/formats.py \
            tools/worldfactbook/media.py \
            tools/worldfactbook/shard_store.py \
            tools/worldfactbook/mariadb_sync.py \
            tools/worldfactbook/worldfactbook_crawler.py \
            tools/worldfactbook/worldfactbook_crawler_selftest.py

          python tools/worldfactbook/worldfactbook_crawler.py \
            --self-test

          python tools/worldfactbook/worldfactbook_crawler_selftest.py

          python -m json.tool \
            tools/worldfactbook/extra-sources.json \
            >/dev/null

      - name: Crawl and normalize all World Factbook editions
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode || 'incremental' }}
          INPUT_START: ${{ inputs.start_year || '1962' }}
          INPUT_END: ${{ inputs.end_year || '2025' }}
          INPUT_IA: ${{ inputs.max_ia_items || '12' }}
          INPUT_WAYBACK: ${{ inputs.max_wayback_pages || '320' }}
        run: |
          set -euo pipefail

          python tools/worldfactbook/worldfactbook_crawler.py \
            --repo-root . \
            --cache-dir "${WFB_CACHE}" \
            --portal-root "${WFB_PORTAL}" \
            --db-root "${WFB_DB}" \
            --media-root worldfactbook/media \
            --country-registry __partials/widgets/global-power-grid/data/countries.json \
            --extra-source-manifest tools/worldfactbook/extra-sources.json \
            --start-year "${INPUT_START}" \
            --end-year "${INPUT_END}" \
            --mode "${INPUT_MODE}" \
            --providers ia,wayback \
            --max-ia-items "${INPUT_IA}" \
            --max-files-per-edition 3 \
            --max-wayback-pages "${INPUT_WAYBACK}" \
            --max-download-mb 1500 \
            --workers 6 \
            --sleep 0.15 \
            --ocr-language eng \
            --ocr-timeout-seconds 30 \
            --max-images-per-source 2500

      - name: Validate corpus, portal, and SQL shards
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          portal = Path("worldfactbook/api")
          db = Path("worldfactbook/db")

          index = json.loads(
              (portal / "portal-index.json").read_text(
                  encoding="utf-8"
              )
          )

          report = json.loads(
              (portal / "crawl-report.json").read_text(
                  encoding="utf-8"
              )
          )

          shards = json.loads(
              (db / "manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          media_shards = json.loads(
              (db / "media-manifest.json").read_text(encoding="utf-8")
          )
          media = json.loads(
              (portal / "media-index.json").read_text(encoding="utf-8")
          )
          attribution = json.loads(
              (portal / "attribution-index.json").read_text(encoding="utf-8")
          )

          if (
              index.get("schema")
              != "zzx-worldfactbook-portal-index-v1"
          ):
              raise SystemExit(
                  "wrong World Factbook portal-index schema"
              )

          if (
              report.get("schema")
              != "zzx-worldfactbook-crawl-report-v1"
          ):
              raise SystemExit(
                  "wrong World Factbook crawl-report schema"
              )

          if (
              shards.get("schema")
              != "zzx-worldfactbook-mariadb-shards-v1"
          ):
              raise SystemExit(
                  "wrong World Factbook shard manifest schema"
              )

          if (
              media_shards.get("schema")
              != "zzx-worldfactbook-media-mariadb-shards-v1"
          ):
              raise SystemExit(
                  "wrong World Factbook media shard manifest schema"
              )

          if media.get("schema") != "zzx-worldfactbook-media-index-v1":
              raise SystemExit("wrong World Factbook media-index schema")

          if attribution.get("schema") != "zzx-worldfactbook-attribution-index-v1":
              raise SystemExit("wrong World Factbook attribution-index schema")

          if int(report.get("chunks") or 0) < 1:
              raise SystemExit(
                  "World Factbook corpus contains zero chunks"
              )

          for entry in shards.get("files") or []:
              path = db / entry["path"]

              if (
                  not path.is_file()
                  or path.stat().st_size <= 0
              ):
                  raise SystemExit(
                      f"missing SQL shard: {path}"
                  )

              if path.stat().st_size > 24_000_000:
                  raise SystemExit(
                      f"SQL shard exceeds 24 MB public ceiling: {path}"
                  )

              digest = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

              if digest != entry["sha256"]:
                  raise SystemExit(
                      f"SQL shard hash mismatch: {path}"
                  )

              with gzip.open(
                  path,
                  "rt",
                  encoding="utf-8",
              ) as fh:
                  head = fh.read(4096)

              if "worldfactbook_chunks" not in head:
                  raise SystemExit(
                      f"SQL shard contract missing table: {path}"
                  )

          for entry in media_shards.get("files") or []:
              path = db / entry["path"]

              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"missing media SQL shard: {path}")

              if path.stat().st_size > 24_000_000:
                  raise SystemExit(
                      f"media SQL shard exceeds 24 MB public ceiling: {path}"
                  )

              digest = hashlib.sha256(path.read_bytes()).hexdigest()

              if digest != entry["sha256"]:
                  raise SystemExit(
                      f"media SQL shard hash mismatch: {path}"
                  )

              with gzip.open(path, "rt", encoding="utf-8") as fh:
                  head = fh.read(4096)

              if "worldfactbook_images" not in head:
                  raise SystemExit(
                      f"media SQL shard contract missing table: {path}"
                  )

          image_count = 0
          credited_count = 0

          for year_row in media.get("years") or []:
              year_path = portal / year_row["path"]
              payload = json.loads(year_path.read_text(encoding="utf-8"))

              if payload.get("schema") != "zzx-worldfactbook-media-year-v1":
                  raise SystemExit(f"bad yearly media schema: {year_path}")

              for image in payload.get("images") or []:
                  image_count += 1
                  filename = str(image.get("filename") or "")
                  key = str(image.get("citation_key") or "")

                  if filename != key + ".png":
                      raise SystemExit(
                          f"filename/citation key mismatch: {filename} / {key}"
                      )

                  if not re.fullmatch(
                      r"wfb-\d{4}-[a-z0-9-]+-[a-z0-9-]+-p\d{4}-i\d{3}-[0-9a-f]{12}\.png",
                      filename,
                  ):
                      raise SystemExit(
                          f"invalid World Factbook image filename: {filename}"
                      )

                  image_path = Path(image["path"])

                  if (
                      not image_path.is_file()
                      or image_path.stat().st_size <= 0
                  ):
                      raise SystemExit(f"missing image: {image_path}")

                  if image_path.stat().st_size > 24_000_000:
                      raise SystemExit(
                          f"image exceeds 24 MB public ceiling: {image_path}"
                      )

                  digest = hashlib.sha256(
                      image_path.read_bytes()
                  ).hexdigest()

                  if digest != image.get("sha256"):
                      raise SystemExit(
                          f"image hash mismatch: {image_path}"
                      )

                  metadata_path = Path(
                      image.get("metadata_path") or ""
                  )

                  if not metadata_path.is_file():
                      raise SystemExit(
                          f"missing image metadata: {metadata_path}"
                      )

                  citation = str(image.get("citation") or "")

                  if key not in citation:
                      raise SystemExit(
                          f"citation missing filename key: {key}"
                      )

                  if str(image.get("source_url") or "") not in citation:
                      raise SystemExit(
                          f"citation missing source URL: {key}"
                      )

                  status = image.get("credit_status")
                  credit = str(image.get("credit") or "")

                  if status == "explicit":
                      if not credit:
                          raise SystemExit(
                              f"explicit credit missing text: {key}"
                          )
                      credited_count += 1
                  elif status == "not-found":
                      if credit:
                          raise SystemExit(
                              f"unverified credit text present: {key}"
                          )
                  else:
                      raise SystemExit(
                          f"unknown credit status for {key}: {status}"
                      )

          if image_count != int(media.get("images") or 0):
              raise SystemExit(
                  f"media image count mismatch: "
                  f"index={media.get('images')} scanned={image_count}"
              )

          if image_count != int(report.get("images") or 0):
              raise SystemExit(
                  f"crawl report image count mismatch: "
                  f"report={report.get('images')} scanned={image_count}"
              )

          print(
              "World Factbook corpus valid:",
              f"chunks={report['chunks']}",
              f"images={image_count}",
              f"ocr_images={report.get('ocr_images', 0)}",
              f"credited_images={credited_count}",
              f"available_editions={report['available_editions']}",
              f"sql_shards={len(shards.get('files') or [])}",
              f"media_sql_shards={len(media_shards.get('files') or [])}",
              f"missing={len(report.get('missing_editions') or [])}",
          )
          PY

      - name: Optionally synchronize MariaDB shards
        if: ${{ env.WORLDFACTBOOK_MARIADB_HOST != '' && env.WORLDFACTBOOK_MARIADB_USER != '' }}
        shell: bash
        env:
          WORLDFACTBOOK_MARIADB_HOST: ${{ secrets.WORLDFACTBOOK_MARIADB_HOST }}
          WORLDFACTBOOK_MARIADB_PORT: ${{ secrets.WORLDFACTBOOK_MARIADB_PORT }}
          WORLDFACTBOOK_MARIADB_USER: ${{ secrets.WORLDFACTBOOK_MARIADB_USER }}
          WORLDFACTBOOK_MARIADB_PASSWORD: ${{ secrets.WORLDFACTBOOK_MARIADB_PASSWORD }}
          WORLDFACTBOOK_MARIADB_DATABASE: ${{ secrets.WORLDFACTBOOK_MARIADB_DATABASE }}
        run: |
          set -euo pipefail

          python tools/worldfactbook/mariadb_sync.py \
            --root "${WFB_DB}"

      - name: Publish World Factbook corpus
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-worldfactbook-bot"
          git config user.email "actions@github.com"

          python tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update ZZX World Factbook corpus" \
            --path worldfactbook/api \
            --path worldfactbook/db \
            --path worldfactbook/media \
            --attempts 5 \
            --sleep-seconds 8

  global_power_grid_compatibility:
    name: Rebuild Verified Global Power Grid Factbook Ledger
    needs:
      - corpus
    uses: ./.github/workflows/zzx-worldfactbook-archive-sync.yml
    with:
      rebuild: ${{ (inputs.mode || 'incremental') == 'rebuild' }}
      max_ia_items: ${{ inputs.max_ia_items || '12' }}
      max_wayback_pages: ${{ inputs.max_wayback_pages || '320' }}
