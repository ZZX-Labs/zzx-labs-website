name: ZZX World Factbook Legacy Refresh
on:
  workflow_dispatch:
    inputs:
      start_year: {type: number, default: 1996}
      end_year: {type: number, default: 2026}
  schedule:
    - cron: '47 6 * * 3'
permissions:
  contents: write
jobs:
  archive:
    uses: ./.github/workflows/zzx-worldfactbook-archive-sync.yml
    with:
      start_year: ${{ inputs.start_year || 1996 }}
      end_year: ${{ inputs.end_year || 2026 }}
      kind: legacy
    secrets: inherit
