
name: ZZX Bitcoin Intel Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: zzx-bitcoin-intel-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Python 3.13 (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Mirror Bitcoin engineering and public-reporting sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bitcoin-intel/sync.py --root .

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail
          find bitcoin/intel/api bitcoin/github/api/repos \
            -type f -name '*.json' -print0 |
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Commit mirrors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-bitcoin-intel-bot"
          git config user.email "actions@users.noreply.github.com"

          git add bitcoin/intel/api bitcoin/github/api/repos

          if git diff --cached --quiet; then
            printf '%s\n' "Bitcoin Intel mirrors already current."
            exit 0
          fi

          git commit -m "data: sync Bitcoin Intel mirrors"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
