name: ZZX World Factbook Manual Edition Ingest
on:
  workflow_dispatch:
    inputs:
      edition_year: {description: Year of sources already placed in the private yearly repository, type: number, required: true}
permissions:
  contents: write
jobs:
  archive:
    uses: ./.github/workflows/zzx-worldfactbook-archive-sync.yml
    with:
      start_year: ${{ inputs.edition_year }}
      end_year: ${{ inputs.edition_year }}
      kind: manual
    secrets: inherit
