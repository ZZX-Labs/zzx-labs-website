name: Update BPI Sovereign Data

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: bpi-sovereign-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-sovereign-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Set up Python (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Sync repository before generation
        shell: bash
        run: |
          set -euo pipefail
          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              fetched=1
              break
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying."
            sleep "$(( attempt * 3 ))"
          done
          test "${fetched}" = "1"
          git reset --hard origin/main

      - name: Validate sovereign updater
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/bpi/update_sovereign_data.py
          python3 tools/bpi/update_sovereign_data.py \
            --self-test
          python3 -m json.tool \
            bitcoin/bpi/api/sovereign-countries.json \
            >/dev/null
          python3 -m json.tool \
            bitcoin/bpi/api/sovereign_source_urls.json \
            >/dev/null

      - name: Update sovereign debt and reserve assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bpi/update_sovereign_data.py \
            --minimum-available 10

      - name: Validate sovereign contracts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          api = Path("bitcoin/bpi/api")

          registry = json.loads(
              (api / "sovereign-countries.json").read_text(
                  encoding="utf-8"
              )
          )
          debts = json.loads(
              (api / "national_debts.json").read_text(
                  encoding="utf-8"
              )
          )
          trade = json.loads(
              (api / "national_trade.json").read_text(
                  encoding="utf-8"
              )
          )
          balances = json.loads(
              (api / "national_balances.json").read_text(
                  encoding="utf-8"
              )
          )

          countries = registry.get("countries")
          debt_rows = debts.get("countries")
          trade_rows = trade.get("countries")
          balance_rows = balances.get("countries")

          if not isinstance(countries, list) or len(countries) < 200:
              raise SystemExit(
                  "sovereign country registry is incomplete"
              )

          codes = [
              str(row.get("code") or "")
              for row in countries
              if isinstance(row, dict)
          ]

          if len(codes) != len(set(codes)):
              raise SystemExit(
                  "sovereign country registry contains duplicate codes"
              )

          if not isinstance(debt_rows, list):
              raise SystemExit(
                  "national_debts.json countries must be an array"
              )

          if not isinstance(balance_rows, list):
              raise SystemExit(
                  "national_balances.json countries must be an array"
              )
          if not isinstance(trade_rows, list):
              raise SystemExit(
                  "national_trade.json countries must be an array"
              )

          if len(debt_rows) != len(countries):
              raise SystemExit(
                  "national_debts.json must retain every registry country"
              )

          if len(balance_rows) != len(countries):
              raise SystemExit(
                  "national_balances.json must retain every registry country"
              )
          if len(trade_rows) != len(countries):
              raise SystemExit(
                  "national_trade.json must retain every registry country"
              )

          debt_available = [
              row for row in debt_rows
              if row.get("available") is True
              and isinstance(row.get("debt_usd"), (int, float))
              and math.isfinite(float(row["debt_usd"]))
              and float(row["debt_usd"]) > 0
          ]

          balance_available = [
              row for row in balance_rows
              if row.get("available") is True
              and isinstance(
                  row.get("balance_assets_usd"),
                  (int, float)
              )
              and math.isfinite(
                  float(row["balance_assets_usd"])
              )
              and float(row["balance_assets_usd"]) > 0
          ]

          if len(debt_available) < 10:
              raise SystemExit(
                  "too few usable sovereign debt estimates"
              )

          if len(balance_available) < 10:
              raise SystemExit(
                  "too few usable sovereign reserve-asset estimates"
              )

          print(
              "Sovereign contracts valid: "
              f"registry={len(countries)} "
              f"debt={len(debt_available)} "
              f"balances={len(balance_available)}"
          )
          PY

      - name: Publish generated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-bpi-bot"
          git config user.email "actions@github.com"
          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update BPI sovereign data" \
            --path bitcoin/bpi/api/sovereign-countries.json \
            --path bitcoin/bpi/api/national_debts.json \
            --path bitcoin/bpi/api/national_balances.json \
            --path bitcoin/bpi/api/national_trade.json \
            --attempts 5 \
            --sleep-seconds 5
