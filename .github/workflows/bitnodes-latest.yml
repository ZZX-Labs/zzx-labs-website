name: Bitnodes Snapshot Mirror

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: bitnodes-snapshot-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Validate Bitnodes collector
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bitnodes/collector.py
          test -f tools/bitnodes/update_snapshot.py
          test -f tools/bpi/bpi_git_publish.py

          python -m py_compile \
            tools/bitnodes/collector.py \
            tools/bitnodes/update_snapshot.py \
            tools/bpi/bpi_git_publish.py

          python -m json.tool bitcoin/bitnodes/api/sources.json >/dev/null

      - name: Update shared Bitnodes snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/bitnodes/update_snapshot.py

      - name: Validate generated Bitnodes API
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          api = Path("bitcoin/bitnodes/api")

          required = [
              api / "originalbitnodes/latest.json",
              api / "zzxbitnodes/latest.json",
              api / "aggregate/zzxbitnodes/latest.json",
              api / "snapshots/latest.json",
              api / "history.json",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing generated Bitnodes file: {path}")

              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"invalid JSON {path}: {exc}")

          latest = json.loads(
              (api / "zzxbitnodes/latest.json").read_text(encoding="utf-8")
          )

          total = (
              latest.get("reachable_nodes")
              or latest.get("total_nodes")
              or latest.get("node_count")
          )

          if not isinstance(total, int) or total <= 0:
              raise SystemExit(
                  "generated Bitnodes snapshot has no usable node count"
              )

          nodes = latest.get("nodes")
          if not isinstance(nodes, list):
              raise SystemExit(
                  "zzxbitnodes/latest.json must contain normalized nodes array"
              )

          by_version = latest.get("by_version")
          if not isinstance(by_version, dict):
              raise SystemExit(
                  "zzxbitnodes/latest.json must contain by_version"
              )

          print(
              "Bitnodes mirror valid: "
              f"source={latest.get('source')} "
              f"reachable={latest.get('reachable_nodes')} "
              f"rows={latest.get('node_count')} "
              f"versions={len(by_version)}"
          )
          PY

      - name: Publish shared Bitnodes mirror
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bitnodes-bot"
          git config user.email "actions@github.com"

          python tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update shared Bitnodes snapshot" \
            --path bitcoin/bitnodes/api \
            --attempts 5 \
            --sleep-seconds 3
