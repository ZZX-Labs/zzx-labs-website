name: btcnodes.io Snapshot Mirror

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: btcnodes-snapshot-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Validate btcnodes.io mirror collector
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bitnodes/collector.py
          test -f tools/bitnodes/update_snapshot.py
          test -f tools/bpi/bpi_git_publish.py

          python -m py_compile \
            tools/bitnodes/collector.py \
            tools/bitnodes/update_snapshot.py \
            tools/bpi/bpi_git_publish.py

          python -m json.tool bitcoin/bitnodes/api/sources.json >/dev/null

      - name: Mirror btcnodes.io snapshot
        shell: bash
        run: |
          set -euo pipefail
          python tools/bitnodes/update_snapshot.py

      - name: Validate generated local mirror
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          api = Path("bitcoin/bitnodes/api")
          required = [
              api / "btcnodes/latest.json",
              api / "btcnodes/normalized/latest.json",
              api / "aggregate/btcnodes/latest.json",
              api / "snapshots/btcnodes/latest.json",
              api / "snapshots/latest.json",
              api / "history.json",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing generated btcnodes.io mirror file: {path}")
              json.loads(path.read_text(encoding="utf-8"))

          latest = json.loads(
              (api / "btcnodes/normalized/latest.json").read_text(encoding="utf-8")
          )
          rows = latest.get("nodes")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("normalized btcnodes.io mirror has zero node rows")
          if not latest.get("source"):
              raise SystemExit("normalized btcnodes.io mirror lacks source provenance")

          print(
              "btcnodes.io mirror valid:",
              f"source={latest.get('source')}",
              f"reachable={latest.get('reachable_nodes')}",
              f"rows={len(rows)}",
              f"versions={len(latest.get('by_version') or {})}",
          )
          PY

      - name: Publish fast btcnodes.io mirror
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bitnodes-bot"
          git config user.email "actions@github.com"

          python tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update btcnodes.io local snapshot mirror" \
            --path bitcoin/bitnodes/api/btcnodes \
            --path bitcoin/bitnodes/api/aggregate/btcnodes/latest.json \
            --path bitcoin/bitnodes/api/snapshots/btcnodes/latest.json \
            --path bitcoin/bitnodes/api/snapshots/latest.json \
            --path bitcoin/bitnodes/api/history.json \
            --attempts 5 \
            --sleep-seconds 3
