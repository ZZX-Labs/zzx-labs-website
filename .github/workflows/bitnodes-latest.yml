name: btcnodes.io Snapshot Mirror

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: btcnodes-snapshot-mirror
  cancel-in-progress: false

jobs:
  update:
    # Primary/default ZZX Bitnodes snapshot. btcnodes.io is mirrored into the
    # zzxbitnodes public contract consumed by widgets and subpages.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "0"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"
      - name: Set up Python (system Python; no JavaScript action)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          print(sys.executable)
          print(sys.version)
          PY
      - name: Sync main
        shell: bash
        run: |
          set -euo pipefail

          fetched=0
          for attempt in 1 2 3 4 5; do
            if git fetch --prune origin main; then
              fetched=1
              break
            fi
            printf '%s\n' "git fetch attempt ${attempt}/5 failed; retrying."
            sleep "$(( attempt * 3 ))"
          done

          if [ "${fetched}" != "1" ]; then
            printf '%s\n' "Unable to refresh origin/main after five attempts."
            exit 1
          fi

          git reset --hard origin/main
          git clean -fdx

      - name: Validate btcnodes.io mirror collector
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/bitnodes/collector.py
          test -f tools/bitnodes/update_snapshot.py
          test -f tools/bitnodes/export_json.py
          test -f tools/bitnodes/aggregate.py
          test -f tools/bpi/bpi_git_publish.py

          python3 -m py_compile \
            tools/bitnodes/collector.py \
            tools/bitnodes/update_snapshot.py \
            tools/bitnodes/export_json.py \
            tools/bitnodes/aggregate.py \
            tools/bpi/bpi_git_publish.py

          python3 -m json.tool bitcoin/bitnodes/api/sources.json >/dev/null

      - name: Mirror btcnodes.io snapshot with last-known-good fallback
        id: mirror
        shell: bash
        run: |
          set -euo pipefail

          refreshed=0
          for attempt in 1 2 3; do
            if python3 tools/bitnodes/update_snapshot.py; then
              refreshed=1
              break
            fi
            printf '%s\n' \
              "::warning title=btcnodes.io mirror retry::Snapshot refresh attempt ${attempt}/3 failed."
            sleep "$(( attempt * 5 ))"
          done

          if [ "${refreshed}" = "1" ]; then
            printf '%s\n' "mode=fresh" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # update_snapshot.py writes only after a complete successful acquisition.
          # Therefore the tracked snapshot from origin/main remains a safe fallback.
          RAW="bitcoin/bitnodes/api/btcnodes/latest.json"
          NORMALIZED="bitcoin/bitnodes/api/btcnodes/normalized/latest.json"

          if [ ! -s "${RAW}" ] || [ ! -s "${NORMALIZED}" ]; then
            printf '%s\n' \
              "::error title=btcnodes.io mirror unavailable::Upstream refresh failed and no committed last-known-good mirror exists."
            exit 1
          fi

          python3 - <<'PY_FALLBACK'
          import json
          from pathlib import Path

          raw = Path("bitcoin/bitnodes/api/btcnodes/latest.json")
          normalized = Path("bitcoin/bitnodes/api/btcnodes/normalized/latest.json")
          json.loads(raw.read_text(encoding="utf-8"))
          payload = json.loads(normalized.read_text(encoding="utf-8"))
          rows = payload.get("nodes") if isinstance(payload, dict) else None
          if not isinstance(rows, list) or not rows:
              raise SystemExit("committed btcnodes.io fallback contains zero normalized nodes")
          if not str(payload.get("source") or "").strip():
              raise SystemExit("committed btcnodes.io fallback lacks source provenance")
          print(f"using committed btcnodes.io fallback: rows={len(rows)} raw_bytes={raw.stat().st_size}")
          PY_FALLBACK

          printf '%s\n' "mode=last-known-good" >> "${GITHUB_OUTPUT}"
          printf '%s\n' \
            "::warning title=btcnodes.io degraded mode::Upstream is unavailable; preserving the validated committed last-known-good mirror."

      - name: Build complete zzxbitnodes public API from btcnodes.io snapshot
        shell: bash
        run: |
          set -euo pipefail

          test -s bitcoin/bitnodes/api/zzxbitnodes/latest.json

          # Preserve the complete default API contract consumed by the existing
          # widgets and bitcoin/bitnodes/* subpages.
          python3 tools/bitnodes/export_json.py \
            --input bitcoin/bitnodes/api/zzxbitnodes/latest.json \
            --output bitcoin/bitnodes/api/zzxbitnodes \
            --source zzxbitnodes \
            --archive-dir bitcoin/bitnodes/archive/zzxbitnodes \
            --compact

          mkdir -p bitcoin/bitnodes/data/runtime/state/zzxbitnodes
          python3 tools/bitnodes/aggregate.py \
            --input bitcoin/bitnodes/api/zzxbitnodes/latest.json \
            --output bitcoin/bitnodes/api/aggregate/zzxbitnodes/latest.json \
            --api-dir bitcoin/bitnodes/api \
            --state-dir bitcoin/bitnodes/data/runtime/state/zzxbitnodes \
            --source zzxbitnodes \
            --compact \
            --omit-node-metadata

      - name: Validate generated local mirror
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          api = Path("bitcoin/bitnodes/api")
          required = [
              api / "btcnodes/latest.json",
              api / "btcnodes/normalized/latest.json",
              api / "zzxbitnodes/latest.json",
              api / "zzxbitnodes/nodes.json",
              api / "zzxbitnodes/countries.json",
              api / "zzxbitnodes/asns.json",
              api / "zzxbitnodes/peer-health.json",
              api / "aggregate/btcnodes/latest.json",
              api / "aggregate/zzxbitnodes/latest.json",
              api / "snapshots/btcnodes/latest.json",
              api / "snapshots/latest.json",
              api / "history.json",
          ]

          for path in required:
              if not path.is_file():
                  raise SystemExit(f"missing generated btcnodes.io mirror file: {path}")
              json.loads(path.read_text(encoding="utf-8"))

          latest = json.loads(
              (api / "btcnodes/normalized/latest.json").read_text(encoding="utf-8")
          )
          rows = latest.get("nodes")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("normalized btcnodes.io mirror has zero node rows")
          if not latest.get("source"):
              raise SystemExit("normalized btcnodes.io mirror lacks source provenance")

          print(
              "btcnodes.io mirror valid:",
              f"source={latest.get('source')}",
              f"reachable={latest.get('reachable_nodes')}",
              f"rows={len(rows)}",
              f"versions={len(latest.get('by_version') or {})}",
          )
          PY

      - name: Publish fast btcnodes.io mirror
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-bitnodes-bot"
          git config user.email "actions@github.com"

          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Update btcnodes.io local snapshot mirror" \
            --path bitcoin/bitnodes/api/btcnodes \
            --path bitcoin/bitnodes/api/zzxbitnodes \
            --path bitcoin/bitnodes/api/aggregate/btcnodes/latest.json \
            --path bitcoin/bitnodes/api/aggregate/zzxbitnodes/latest.json \
            --path bitcoin/bitnodes/api/snapshots/btcnodes/latest.json \
            --path bitcoin/bitnodes/api/snapshots/latest.json \
            --path bitcoin/bitnodes/api/history.json \
            --attempts 5 \
            --sleep-seconds 3
