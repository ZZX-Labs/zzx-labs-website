name: ZZX World Factbook Global Power Grid Sync

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: zzx-worldfactbook-global-power-grid-sync
  cancel-in-progress: false

jobs:
  sync-electricity-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout newest main with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags origin main
          git checkout --force -B main origin/main
          git clean -fdx

      - name: Validate local corpus synchronizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/worldfactbook/factbook_archive_sync.py \
            tools/worldfactbook/global_power_grid_sync.py \
            tools/bpi/bpi_git_publish.py
          python3 tools/worldfactbook/global_power_grid_sync.py --self-test

      - name: Rebuild Global Power Grid from normalized World Factbook corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/worldfactbook/global_power_grid_sync.py \
            --country-registry __partials/widgets/global-power-grid/data/countries.json \
            --corpus-root worldfactbook/api/editions \
            --electricity-output worldfactbook/api/electricity-history.json \
            --reference-output worldfactbook/api/reference-index.json \
            --power-grid-output bitcoin/power-grid/api/factbook-history.json \
            --widget-output __partials/widgets/global-power-grid/data/factbook-history.json \
            --start-year 1962 \
            --end-year 2027 \
            --preserve-existing \
            | tee worldfactbook/api/global-power-grid-sync-report.json

      - name: Validate compatibility outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=[
              Path('worldfactbook/api/electricity-history.json'),
              Path('bitcoin/power-grid/api/factbook-history.json'),
              Path('__partials/widgets/global-power-grid/data/factbook-history.json'),
          ]
          docs=[]
          for path in paths:
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('schema') != 'zzx-global-power-grid-factbook-history-v2':
                  raise SystemExit(f'bad schema: {path}')
              if int(data.get('scan_end_year') or 0) != 2027:
                  raise SystemExit(f'bad scan_end_year: {path}')
              docs.append(data)
          if not docs[0].get('records'):
              raise SystemExit('zero Global Power Grid records')
          canonical=json.dumps(docs[0],sort_keys=True,separators=(',',':'))
          if any(json.dumps(doc,sort_keys=True,separators=(',',':')) != canonical for doc in docs[1:]):
              raise SystemExit('Global Power Grid ledgers diverged')
          print('Global Power Grid sync gate passed:', len(docs[0]['records']), 'records')
          PY

      - name: Publish compatibility databases
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-worldfactbook-bot"
          git config user.email "actions@github.com"
          python3 tools/bpi/bpi_git_publish.py \
            --root . \
            --message "Sync Global Power Grid from World Factbook corpus" \
            --path worldfactbook/api/electricity-history.json \
            --path worldfactbook/api/reference-index.json \
            --path worldfactbook/api/global-power-grid-sync-report.json \
            --path bitcoin/power-grid/api/factbook-history.json \
            --path __partials/widgets/global-power-grid/data/factbook-history.json \
            --attempts 8 \
            --sleep-seconds 6
