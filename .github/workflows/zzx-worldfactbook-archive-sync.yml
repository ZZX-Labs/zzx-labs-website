name: ZZX World Factbook Archive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

concurrency:
  group: zzx-worldfactbook-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore World Factbook download cache
        uses: actions/cache@v4
        with:
          path: .cache/worldfactbook
          key: worldfactbook-public-archive-v1-${{ runner.os }}
          restore-keys: |
            worldfactbook-public-archive-v1-

      - name: Synchronize public World Factbook editions
        shell: bash
        run: |
          set -euo pipefail
          python tools/worldfactbook/factbook_archive_sync.py \
            --country-registry __partials/widgets/global-power-grid/data/countries.json \
            --electricity-output worldfactbook/api/electricity-history.json \
            --reference-output worldfactbook/api/reference-index.json \
            --power-grid-output bitcoin/power-grid/api/factbook-history.json \
            --widget-output __partials/widgets/global-power-grid/data/factbook-history.json \
            --cache-dir .cache/worldfactbook \
            --start-year 1962 \
            --end-year 2025 \
            --max-ia-items 6 \
            --min-records-per-edition 25 \
            --workers 4 \
            --max-wayback-pages 300 \
            --sleep 0.20

      - name: Validate JSON outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool worldfactbook/api/electricity-history.json >/dev/null
          python -m json.tool worldfactbook/api/reference-index.json >/dev/null
          python -m json.tool bitcoin/power-grid/api/factbook-history.json >/dev/null
          python -m json.tool __partials/widgets/global-power-grid/data/factbook-history.json >/dev/null

      - name: Commit updated archive indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zzx-worldfactbook-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            worldfactbook/api/electricity-history.json \
            worldfactbook/api/reference-index.json \
            bitcoin/power-grid/api/factbook-history.json \
            __partials/widgets/global-power-grid/data/factbook-history.json
          if git diff --cached --quiet; then
            printf '%s\n' "World Factbook archive already current."
            exit 0
          fi
          git commit -m "data: sync public World Factbook archive"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
