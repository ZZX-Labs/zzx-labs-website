name: ZZX World Factbook Year Archive Sync
on:
  workflow_call:
    inputs:
      start_year: {type: number, default: 1962}
      end_year: {type: number, default: 2027}
      kind: {type: string, default: all}
      max_captures: {type: number, default: 60}
    secrets:
      WORLDFACTBOOK_PRIVATE_DATA_TOKEN: {required: true}
  workflow_dispatch:
    inputs:
      start_year: {description: First edition year, type: number, default: 1962}
      end_year: {description: Final edition year, type: number, default: 2027}
      kind: {description: Collector, type: choice, options: [all, corpus, media, legacy, daily, manual], default: all}
      max_captures: {description: Capture budget per year and feature, type: number, default: 60}
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      years: ${{ steps.plan.outputs.years }}
    steps:
      - id: plan
        shell: bash
        env:
          FIRST: ${{ inputs.start_year || 1962 }}
          LAST: ${{ inputs.end_year || 2027 }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime,json,os
          first,last=int(os.environ['FIRST']),int(os.environ['LAST'])
          if not 1962<=first<=last<=2027:raise SystemExit('Invalid edition range')
          years=list(range(first,last+1))
          if os.environ['EVENT']=='schedule':
              today=datetime.datetime.now(datetime.timezone.utc).date()
              current=min(last,today.year);past=[year for year in years if year<current]
              offset=(today.toordinal()*3)%len(past) if past else 0
              years=sorted(set(([current] if current>=first else [])+[past[(offset+i)%len(past)] for i in range(min(3,len(past)))]))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('years='+json.dumps(years)+'\n')
          PY
  preserve-year:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: ${{ fromJSON(needs.plan.outputs.years) }}
    concurrency:
      group: zzx-worldfactbook-private-year-${{ matrix.year }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require server-side private archive credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.WORLDFACTBOOK_PRIVATE_DATA_TOKEN }}
        run: |
          test -n "$PRIVATE_TOKEN" || { printf '%s\n' 'WORLDFACTBOOK_PRIVATE_DATA_TOKEN is required before crawling.' >&2; exit 1; }
      - name: Install Python extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil python3-fitz poppler-utils libarchive13t64 p7zip-full antiword unrtf djvulibre-bin tesseract-ocr
      - name: Validate archive collector
        run: |
          python3 -m compileall -q tools/worldfactbook
          python3 tools/worldfactbook/worldfactbook_crawler_selftest.py
          python3 tools/worldfactbook/global_power_grid_sync.py --self-test
          python3 -m unittest discover -s tests -p test_year_archive.py
      - name: Refresh and preserve this year's sources and readouts
        env:
          PRIVATE_TOKEN: ${{ secrets.WORLDFACTBOOK_PRIVATE_DATA_TOKEN }}
          OWNER: ${{ vars.WORLDFACTBOOK_ARCHIVE_OWNER || github.repository_owner }}
          YEAR: ${{ matrix.year }}
          KIND: ${{ inputs.kind || 'all' }}
          MAX_CAPTURES: ${{ inputs.max_captures || 60 }}
        run: |
          python3 tools/worldfactbook/year_archive.py run --repo-root . --archive-root "$RUNNER_TEMP/worldfactbook-years" --owner "$OWNER" --year "$YEAR" --kind "$KIND" --max-captures "$MAX_CAPTURES"
      - name: Publish derived indexes and power-grid compatibility ledgers
        env:
          PUBLIC_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          PUBLIC_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 tools/worldfactbook/publish_archive_indexes.py --archive-root "$RUNNER_TEMP/worldfactbook-years" --repository "$PUBLIC_REPOSITORY" --branch "$PUBLIC_BRANCH"
