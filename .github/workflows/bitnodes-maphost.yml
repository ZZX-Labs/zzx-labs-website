name: ZZX-Labs Bitnodes Map Host

on:
  workflow_dispatch:
    inputs:
      max_points:
        description: "Maximum real-coordinate node points published to each public map"
        required: false
        default: "5000"
      include_ayeowch_compat:
        description: "Also build optional Ayeowch/original compatibility map when a real-coordinate snapshot exists"
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows:
      - ZZX-Labs Bitnodes Global Node Crawler
    types:
      - completed
  schedule:
    # Fallback rebuild. Normal publication is event-driven after the crawler.
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: zzx-bitnodes-maphost
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"

  BITNODES_ROOT: bitcoin/bitnodes
  BITNODES_API: bitcoin/bitnodes/api
  BITNODES_DATA: bitcoin/bitnodes/data
  BITNODES_GEOIP: bitcoin/bitnodes/data/geoip
  BITNODES_GEO: bitcoin/bitnodes/data/geo
  BITNODES_MAPS: bitcoin/bitnodes/maps
  BITNODES_LIVE_MAP: bitcoin/bitnodes/live-map

  MAX_PUBLIC_JSON_BYTES: "24000000"
  MAX_COMMIT_FILES: "700"
  MAX_DELETIONS: "2500000"
  MIN_MAP_FEATURES: "1"
  MAP_MAX_POINTS: ${{ inputs.max_points || '5000' }}

jobs:
  maps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync main before map build
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

          CANONICAL_PUBLISHED="${BITNODES_API}/snapshots/latest.json"
          test -s "${CANONICAL_PUBLISHED}"
          BASE_HEAD="$(git rev-parse HEAD)"
          SOURCE_SHA256="$(sha256sum "${CANONICAL_PUBLISHED}" | awk '{print $1}')"
          printf '%s\n' "base_head=${BASE_HEAD}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "source_sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "Map Host baseline: head=${BASE_HEAD} canonical_sha256=${SOURCE_SHA256}"

          printf '%s\n' "Canonical Bitnodes sources available to Map Host:"
          find "${BITNODES_API}" -maxdepth 4 -type f \
            \( -name 'latest.json' -o -name '*report.json' -o -name 'index.json' \) \
            | sort \
            | sed -n '1,260p'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/bitnodes/requirements.txt

      - name: Install map requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/bitnodes/requirements.txt

      - name: Validate canonical map stack
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=(
            tools/bitnodes/map/map.py
            tools/bitnodes/map/maps.py
            tools/bitnodes/map/live-map.py
            tools/bitnodes/map/map_source.py
            tools/bitnodes/map/map_source_selftest.py
            tools/bitnodes/map/compact_vectors.py
            tools/bitnodes/map/compact_vectors_selftest.py
            tools/bitnodes/map/cleanup_optional_maps.py
            tools/bitnodes/map/cleanup_optional_maps_selftest.py
            tools/bitnodes/map/prepare_canonical.py
            tools/bitnodes/map/prepare_canonical_selftest.py
            tools/bitnodes/map/ensure_geo_data.py
            tools/bitnodes/geo_contract.py
            tools/bitnodes/merge_sources.py
            tools/bitnodes/map/mapvectors.py
            tools/bitnodes/map/vector_types.py
            tools/bitnodes/map/mapnodes.py
            tools/bitnodes/map/maplayers.py
            tools/bitnodes/map/mapoverlays.py
            tools/bitnodes/map/mapplotter.py
            tools/bitnodes/map/mappolygons.py
            tools/bitnodes/map/openstreetmaps.py
            tools/bitnodes/map/mapsettings.py
            tools/bitnodes/map/mapthemes.py
            tools/bitnodes/map/mapregions.py
            tools/bitnodes/map/mapcontinents.py
            tools/bitnodes/map/mapcountries.py
            tools/bitnodes/map/mapterritories.py
            tools/bitnodes/map/mapcounties.py
            tools/bitnodes/map/mapcities.py
            tools/bitnodes/map/mapzips.py
            tools/bitnodes/map/maptimezones.py
            tools/bitnodes/map/mapw3waddresses.py
            tools/bitnodes/map/mapzzxgcsaddresses.py
            tools/bitnodes/map/mapgeohashids.py
            tools/bitnodes/map/mapparcels.py
            tools/bitnodes/map/mapbuildings.py
          )

          for FILE in "${REQUIRED[@]}"; do
            test -f "${FILE}"
            python -m py_compile "${FILE}"
          done

          python tools/bitnodes/map/map.py --help >/dev/null
          python tools/bitnodes/map/map_source.py --help >/dev/null
          python tools/bitnodes/map/map_source_selftest.py
          python tools/bitnodes/map/compact_vectors.py --help >/dev/null
          python tools/bitnodes/map/compact_vectors_selftest.py
          python tools/bitnodes/map/cleanup_optional_maps.py --help >/dev/null
          python tools/bitnodes/map/cleanup_optional_maps_selftest.py
          python tools/bitnodes/map/prepare_canonical.py --help >/dev/null
          python tools/bitnodes/map/prepare_canonical_selftest.py
          python tools/bitnodes/map/geodata_bootstrap_selftest.py
          python tools/bitnodes/map/maphost_status_selftest.py
          python tools/bitnodes/map/ensure_geo_data.py --help >/dev/null
          python tools/bitnodes/geo_contract.py --help >/dev/null

      - name: Ensure Map Host IP geolocation datasets
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail

          mkdir -p "${BITNODES_GEOIP}" "${BITNODES_GEO}/sources"

          python tools/bitnodes/map/ensure_geo_data.py \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --months-back 6 \
            --timeout 60 \
            --retries 3 \
            --report "${RUNNER_TEMP}/map-geodata-report.json"

          python tools/bitnodes/map/ensure_geo_data.py \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --verify-only

          python - <<'PY'
          from pathlib import Path
          import geoip2.database
          root=Path("bitcoin/bitnodes/data/geoip")
          city=root/"dbip-city-lite.mmdb"
          country=root/"dbip-country-lite.mmdb"
          asn=root/"dbip-asn-lite.mmdb"
          with geoip2.database.Reader(str(city)) as reader:
              row=reader.city("8.8.8.8")
              if not row.country.iso_code:
                  raise SystemExit("DB-IP city smoke test returned no country")
              print("DB-IP city smoke:",row.country.iso_code,row.city.name,row.location.latitude,row.location.longitude)
          with geoip2.database.Reader(str(country)) as reader:
              row=reader.country("1.1.1.1")
              if not row.country.iso_code:
                  raise SystemExit("DB-IP country smoke test returned no country")
          with geoip2.database.Reader(str(asn)) as reader:
              row=reader.asn("8.8.8.8")
              print("DB-IP ASN smoke:",row.autonomous_system_number,row.autonomous_system_organization)
          PY

      - name: Prepare canonical snapshot for Map Host
        id: canonical
        shell: bash
        run: |
          set -euo pipefail

          CANONICAL="${RUNNER_TEMP}/zzx-bitnodes-canonical.json"
          REPORT="${RUNNER_TEMP}/zzx-bitnodes-canonical-report.json"

          # Defense-in-depth: the preparer can bootstrap by itself, but verify
          # here too so the job log makes missing/stale geodata obvious.
          python tools/bitnodes/map/ensure_geo_data.py \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --verify-only \
          || python tools/bitnodes/map/ensure_geo_data.py \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --months-back 6 \
            --timeout 60 \
            --retries 3 \
            --report "${RUNNER_TEMP}/map-geodata-report-recovery.json"

          python tools/bitnodes/map/prepare_canonical.py \
            --repo-root . \
            --output "${CANONICAL}" \
            --report "${REPORT}" \
            --geoip-dir "${BITNODES_GEOIP}" \
            --geo-root "${BITNODES_GEO}" \
            --geo-months-back 6 \
            --geo-timeout 60 \
            --geo-retries 3 \
            --minimum-nodes 1 \
            --minimum-country 1 \
            --minimum-coordinates 1 \
            --compact

          test -s "${CANONICAL}"
          test -s "${REPORT}"

          printf '%s\n' "canonical=${CANONICAL}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "canonical_report=${REPORT}" >> "${GITHUB_OUTPUT}"

          cat "${REPORT}"

      - name: Validate canonical geography before mapping
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import re
          from pathlib import Path

          import os

          path = Path(os.environ["CANONICAL_SOURCE"])
          payload = json.loads(path.read_text(encoding="utf-8"))

          if not str(payload.get("schema") or "").startswith("zzx-bitnodes-canonical-v"):
              raise SystemExit(f"Map Host requires canonical snapshot; got schema={payload.get('schema')!r}")

          rows = payload.get("nodes")
          if not isinstance(rows, list) or not rows:
              raise SystemExit("canonical snapshot has no normalized node rows")

          counts = {
              "country": 0,
              "city": 0,
              "county": 0,
              "coordinates": 0,
              "synthetic": 0,
          }

          for row in rows:
              if not isinstance(row, dict):
                  continue

              country = str(row.get("country") or row.get("country_code") or "").upper()
              if re.fullmatch(r"[A-Z]{2}", country):
                  counts["country"] += 1
              if row.get("city") and re.fullmatch(r"[A-Z]{2}", country):
                  counts["city"] += 1
              if row.get("county") and row.get("admin2_code") and re.fullmatch(r"[A-Z]{2}", country):
                  counts["county"] += 1

              markers = " ".join(str(row.get(key) or "").lower() for key in (
                  "geoip_confidence", "geoip_source", "geo_confidence", "geo_source"
              ))
              if any(token in markers for token in (
                  "synthetic", "deterministic-fallback", "workflow-map-ready-fallback"
              )):
                  counts["synthetic"] += 1

              try:
                  lat = float(row.get("latitude"))
                  lon = float(row.get("longitude"))
              except Exception:
                  continue

              if math.isfinite(lat) and math.isfinite(lon) and -90 <= lat <= 90 and -180 <= lon <= 180:
                  counts["coordinates"] += 1

          print("canonical geography:", counts)

          if counts["country"] < 1:
              raise SystemExit("canonical snapshot contains no country geolocation")
          if counts["city"] < 1:
              print("WARNING: canonical snapshot currently has no city geolocation; city widget/map layer will report unavailable coverage")
          if counts["county"] < 1:
              print("WARNING: canonical snapshot currently has no county/admin2 geolocation; county widget/map layer will report unavailable coverage")
          if counts["coordinates"] < 1:
              raise SystemExit("canonical snapshot contains no real coordinates")
          if counts["synthetic"] != 0:
              raise SystemExit("canonical snapshot still contains synthetic-coordinate markers")
          PY
        env:
          CANONICAL_SOURCE: ${{ steps.canonical.outputs.canonical }}

      - name: Build real-coordinate-only map input
        id: map_source
        shell: bash
        run: |
          set -euo pipefail

          MAP_SOURCE="${RUNNER_TEMP}/zzx-bitnodes-map-source.json"
          MAP_REPORT="${RUNNER_TEMP}/zzx-bitnodes-map-source-report.json"

          python tools/bitnodes/map/map_source.py \
            --input "${{ steps.canonical.outputs.canonical }}" \
            --output "${MAP_SOURCE}" \
            --report "${MAP_REPORT}" \
            --max-points "${MAP_MAX_POINTS}" \
            --minimum-points "${MIN_MAP_FEATURES}" \
            --compact

          test -s "${MAP_SOURCE}"
          test -s "${MAP_REPORT}"

          printf '%s\n' "map_source=${MAP_SOURCE}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "map_report=${MAP_REPORT}" >> "${GITHUB_OUTPUT}"

          cat "${MAP_REPORT}"

      - name: Build canonical maps and live-map
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "${BITNODES_MAPS}/data" \
            "${BITNODES_LIVE_MAP}/data"

          python tools/bitnodes/map/map.py both \
            --input "${{ steps.map_source.outputs.map_source }}" \
            --api-dir "${BITNODES_API}" \
            --state-dir "${RUNNER_TEMP}/map-state" \
            --map-dir "${BITNODES_MAPS}" \
            --live-map-dir "${BITNODES_LIVE_MAP}" \
            --source zzx-canonical \
            --theme zzx_dark_olive \
            --settings live \
            --tile-provider cartodb_dark \
            --limit "${MAP_MAX_POINTS}" \
            --compact \
            --no-db \
            --fail-empty \
            --vectors-fallback

      - name: Mirror canonical data into zzxbitnodes compatibility paths
        shell: bash
        run: |
          set -euo pipefail

          for ROOT in "${BITNODES_MAPS}" "${BITNODES_LIVE_MAP}"; do
            mkdir -p "${ROOT}/zzxbitnodes/data"
            rm -rf "${ROOT}/zzxbitnodes/data"/*
            cp -a "${ROOT}/data/." "${ROOT}/zzxbitnodes/data/"
          done

      - name: Reset stale optional Ayeowch map outputs
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/map/cleanup_optional_maps.py \
            --root "${BITNODES_MAPS}" \
            --root "${BITNODES_LIVE_MAP}" \
            --subtree originalbitnodes \
            --report "${RUNNER_TEMP}/original-map-cleanup-report.json"

          cat "${RUNNER_TEMP}/original-map-cleanup-report.json"

      - name: Build optional Ayeowch compatibility map
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_ayeowch_compat }}
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${BITNODES_API}/originalbitnodes/latest.json"

          if [ ! -s "${INPUT}" ]; then
            printf '%s\n' "No optional originalbitnodes/latest.json exists; compatibility map skipped."
            exit 0
          fi

          SOURCE="${RUNNER_TEMP}/original-bitnodes-map-source.json"

          if ! python tools/bitnodes/map/map_source.py \
            --input "${INPUT}" \
            --output "${SOURCE}" \
            --max-points "${MAP_MAX_POINTS}" \
            --minimum-points 1 \
            --compact
          then
            printf '%s\n' "Optional Ayeowch snapshot contains no real-coordinate rows; compatibility map skipped."
            exit 0
          fi

          python tools/bitnodes/map/map.py both \
            --input "${SOURCE}" \
            --api-dir "${BITNODES_API}" \
            --state-dir "${RUNNER_TEMP}/original-map-state" \
            --map-dir "${BITNODES_MAPS}/originalbitnodes" \
            --live-map-dir "${BITNODES_LIVE_MAP}/originalbitnodes" \
            --source originalbitnodes \
            --theme zzx_dark_olive \
            --settings live \
            --tile-provider cartodb_dark \
            --limit "${MAP_MAX_POINTS}" \
            --compact \
            --no-db \
            --fail-empty \
            --vectors-fallback

      - name: Compact public map vectors
        shell: bash
        run: |
          set -euo pipefail

          python tools/bitnodes/map/compact_vectors.py \
            --root "${BITNODES_MAPS}" \
            --root "${BITNODES_LIVE_MAP}" \
            --max-bytes "${MAX_PUBLIC_JSON_BYTES}" \
            --report "${RUNNER_TEMP}/map-vector-compaction-report.json"

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["VECTOR_REPORT"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          files = report.get("files")
          if not isinstance(files, list) or not files:
              raise SystemExit("vector compaction report contains no files")

          max_bytes = int(os.environ["MAX_PUBLIC_JSON_BYTES"])
          for row in files:
              path = Path(row["path"])
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f"missing compacted vector file: {path}")
              if path.stat().st_size > max_bytes:
                  raise SystemExit(f"compacted vector file still oversized: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row.get("sha256"):
                  raise SystemExit(f"vector digest mismatch: {path}")
              payload = json.loads(path.read_text(encoding="utf-8"))
              points = payload.get("points")
              if not isinstance(points, list) or not points:
                  raise SystemExit(f"compacted vector file has no points: {path}")
              if int(payload.get("point_count") or 0) != len(points):
                  raise SystemExit(f"vector point_count mismatch: {path}")

          print(
              "Map vector compaction passed:",
              "files=", len(files),
              "before=", report.get("total_before_bytes"),
              "after=", report.get("total_after_bytes"),
          )
          PY
        env:
          VECTOR_REPORT: ${{ runner.temp }}/map-vector-compaction-report.json
          MAX_PUBLIC_JSON_BYTES: ${{ env.MAX_PUBLIC_JSON_BYTES }}

      - name: Validate canonical map output and provenance
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path

          source = json.loads(Path(os.environ["MAP_SOURCE"]).read_text(encoding="utf-8"))
          nodes = source.get("nodes")
          if not isinstance(nodes, dict) or not nodes:
              raise SystemExit("map source has no nodes")

          source_coords = set()
          source_addresses = set()

          for address, row in nodes.items():
              if not isinstance(row, dict):
                  continue
              lat = float(row["latitude"])
              lon = float(row["longitude"])
              source_coords.add((round(lat, 6), round(lon, 6)))
              source_addresses.add(str(row.get("address") or address))

          for base in (
              Path("bitcoin/bitnodes/maps/data"),
              Path("bitcoin/bitnodes/live-map/data"),
          ):
              geo_path = base / "map-points.geojson"
              vector_path = base / "map-vectors.json"

              for path in (geo_path, vector_path):
                  if not path.exists() or path.stat().st_size <= 0:
                      raise SystemExit(f"missing generated map artifact: {path}")

              geo = json.loads(geo_path.read_text(encoding="utf-8"))
              vectors = json.loads(vector_path.read_text(encoding="utf-8"))
              features = geo.get("features")
              points = vectors.get("points")

              if not isinstance(features, list) or not features:
                  raise SystemExit(f"empty GeoJSON: {geo_path}")
              if not isinstance(points, list) or not points:
                  raise SystemExit(f"empty map vectors: {vector_path}")
              if len(points) != len(features):
                  raise SystemExit(
                      f"vector/GeoJSON point-count mismatch in {base}: "
                      f"vectors={len(points)} features={len(features)}"
                  )

              for point in points:
                  if not isinstance(point, dict):
                      raise SystemExit(f"invalid point in {vector_path}")
                  coords = point.get("coordinates")
                  if isinstance(coords, list) and len(coords) >= 2:
                      lon = float(coords[0])
                      lat = float(coords[1])
                  else:
                      lat = float(point.get("lat", point.get("latitude")))
                      lon = float(point.get("lon", point.get("longitude")))
                  if not (math.isfinite(lat) and math.isfinite(lon)):
                      raise SystemExit(f"invalid vector coordinate in {vector_path}")
                  if (round(lat, 6), round(lon, 6)) not in source_coords:
                      raise SystemExit(
                          f"vector emitted coordinate absent from canonical map source: {(lat, lon)}"
                      )

              for feature in features:
                  if not isinstance(feature, dict):
                      raise SystemExit(f"invalid feature in {geo_path}")
                  props = feature.get("properties") if isinstance(feature.get("properties"), dict) else {}
                  marker_text = " ".join(str(props.get(key) or "").lower() for key in (
                      "geoip_confidence", "geoip_source", "geo_confidence", "geo_source"
                  ))
                  if "synthetic" in marker_text or "deterministic-fallback" in marker_text:
                      raise SystemExit(f"synthetic marker in {geo_path}")

                  geometry = feature.get("geometry") if isinstance(feature.get("geometry"), dict) else {}
                  coordinates = geometry.get("coordinates")
                  if not isinstance(coordinates, list) or len(coordinates) < 2:
                      raise SystemExit(f"invalid geometry in {geo_path}")
                  lon = float(coordinates[0])
                  lat = float(coordinates[1])
                  if not (math.isfinite(lat) and math.isfinite(lon) and -90 <= lat <= 90 and -180 <= lon <= 180):
                      raise SystemExit(f"invalid coordinate in {geo_path}")
                  if (round(lat, 6), round(lon, 6)) not in source_coords:
                      raise SystemExit(f"map emitted coordinate absent from canonical map source: {(lat, lon)}")

              print(base, "features=", len(features), "vectors=", len(points))
          PY
        env:
          MAP_SOURCE: ${{ steps.map_source.outputs.map_source }}

      - name: Write Map Host status contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          map_report_path = Path(os.environ["MAP_REPORT"])
          if not map_report_path.is_file() or map_report_path.stat().st_size <= 0:
              raise SystemExit(f"missing Map Host map-source report: {map_report_path}")

          report = json.loads(map_report_path.read_text(encoding="utf-8"))

          try:
              max_points = int(os.environ["MAP_MAX_POINTS"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(
                  f"invalid MAP_MAX_POINTS: {os.environ.get('MAP_MAX_POINTS')!r}"
              ) from exc

          if max_points < 1:
              raise SystemExit(f"MAP_MAX_POINTS must be positive, got {max_points}")

          status = {
              "schema": "zzx-bitnodes-maphost-status-v2",
              "generated_at": int(time.time()),
              "source": "Map Host prepared canonical snapshot",
              "published_source_hint": "bitcoin/bitnodes/api/snapshots/latest.json",
              "published_source_sha256": os.environ["PUBLISHED_SOURCE_SHA256"],
              "source_repository_head": os.environ["SOURCE_REPOSITORY_HEAD"],
              "source_schema": "zzx-bitnodes-canonical-v2",
              "real_coordinates_only": True,
              "synthetic_coordinates": 0,
              "max_points": max_points,
              "map_source": report,
          }

          text = json.dumps(
              status,
              ensure_ascii=False,
              separators=(",", ":"),
          ) + "\n"

          for path in (
              Path("bitcoin/bitnodes/maps/data/maphost-status.json"),
              Path("bitcoin/bitnodes/live-map/data/maphost-status.json"),
              Path("bitcoin/bitnodes/maps/zzxbitnodes/data/maphost-status.json"),
              Path("bitcoin/bitnodes/live-map/zzxbitnodes/data/maphost-status.json"),
          ):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding="utf-8")
          PY
        env:
          MAP_REPORT: ${{ steps.map_source.outputs.map_report }}
          MAP_MAX_POINTS: ${{ env.MAP_MAX_POINTS }}
          PUBLISHED_SOURCE_SHA256: ${{ steps.baseline.outputs.source_sha256 }}
          SOURCE_REPOSITORY_HEAD: ${{ steps.baseline.outputs.base_head }}

      - name: Enforce Map Host artifact policy
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          max_bytes = int(os.environ["MAX_PUBLIC_JSON_BYTES"])
          bad = []

          for root in (
              Path(os.environ["BITNODES_MAPS"]),
              Path(os.environ["BITNODES_LIVE_MAP"]),
          ):
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in {".json", ".geojson", ".css", ".js", ".html", ".svg", ".png", ".webp"}:
                      continue
                  if path.stat().st_size > max_bytes:
                      bad.append((path.stat().st_size, path))

          if bad:
              for size, path in bad:
                  print("oversized Map Host artifact:", size, path)
              raise SystemExit(1)

          print("Map Host artifact size policy passed")
          PY

      - name: Stage Map Host-owned outputs only
        shell: bash
        run: |
          set -euo pipefail

          git reset
          git add -A \
            "${BITNODES_MAPS}" \
            "${BITNODES_LIVE_MAP}"

          OUTSIDE="$({ git diff --cached --name-only || true; } | grep -Ev '^bitcoin/bitnodes/(maps|live-map)/' || true)"
          if [ -n "${OUTSIDE}" ]; then
            printf '%s\n' "Refusing Map Host commit containing non-Map-Host paths:"
            printf '%s\n' "${OUTSIDE}"
            exit 1
          fi

          # Derived display geometry (for example a square footprint centered on a
          # real IP geolocation) may legitimately be marked synthetic. What is
          # forbidden is synthetic provenance on the node coordinates themselves.
          if git grep --cached -n -E \
            'workflow-map-ready-fallback|deterministic-fallback|"(geoip_confidence|geoip_source|geo_confidence|geo_source)"[[:space:]]*:[[:space:]]*"[^"]*synthetic[^"]*"' \
            -- "${BITNODES_MAPS}" "${BITNODES_LIVE_MAP}"
          then
            printf '%s\n' "Refusing staged Map Host artifacts containing synthetic node-coordinate provenance."
            exit 1
          fi

          CHANGED="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          DELETIONS="$(git diff --cached --numstat | awk '{d += $2} END {print d + 0}')"

          printf '%s\n' "Map Host staged files: ${CHANGED}"
          printf '%s\n' "Map Host staged deletions: ${DELETIONS}"

          if [ "${CHANGED}" -gt "${MAX_COMMIT_FILES}" ]; then
            git diff --cached --name-only | sed -n '1,320p'
            exit 1
          fi

          if [ "${DELETIONS}" -gt "${MAX_DELETIONS}" ]; then
            git diff --cached --stat
            exit 1
          fi

      - name: Commit and push Map Host outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "zzx-labs-maphost-bot"
          git config user.email "actions@github.com"

          if git diff --cached --quiet; then
            printf '%s\n' "No map changes."
            exit 0
          fi

          git commit -m "Update canonical Bitnodes maps"
          git reset --hard HEAD
          git clean -fdx

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            EXPECTED_SOURCE_SHA256="${{ steps.baseline.outputs.source_sha256 }}"
            REMOTE_SOURCE_SHA256="$(
              git show "origin/main:${BITNODES_API}/snapshots/latest.json" | sha256sum | awk '{print $1}'
            )"

            if [ "${REMOTE_SOURCE_SHA256}" != "${EXPECTED_SOURCE_SHA256}" ]; then
              printf '%s\n' \
                "Canonical snapshot changed while Map Host was building; refusing stale publication." \
                "expected=${EXPECTED_SOURCE_SHA256}" \
                "remote=${REMOTE_SOURCE_SHA256}"
              exit 1
            fi

            if git rebase origin/main && git push origin HEAD:main; then
              printf '%s\n' "Canonical Bitnodes maps pushed."
              exit 0
            fi

            git rebase --abort || true
            git reset --hard HEAD
            git clean -fdx
            printf '%s\n' "Map Host publish attempt ${attempt} failed; retrying without force."
            sleep 10
          done

          printf '%s\n' "Failed to publish Map Host outputs without rewriting main."
          exit 1
