name: ZZX Data Mirror Master

on:
  workflow_dispatch:
    inputs:
      run_bpi:
        description: "Run the hourly BPI capture/finalization job"
        required: false
        type: boolean
        default: true
      run_bitnodes:
        description: "Refresh the shared Bitnodes mirror"
        required: false
        type: boolean
        default: true
      capture_seconds:
        description: "BPI live-capture duration for manual runs"
        required: false
        default: "3120"

  schedule:
    # Full hourly cycle starts on the hour.
    - cron: "0 * * * *"

    # Lightweight Bitnodes refreshes between BPI starts.
    - cron: "4-59/5 * * * *"

permissions:
  contents: write

jobs:
  bpi:
    name: BPI hourly capture
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_bpi) ||
        github.event.schedule == '0 * * * *'
      }}
    uses: ./.github/workflows/bpi-latest.yml
    with:
      capture_seconds: ${{ inputs.capture_seconds || '3120' }}
    secrets: inherit

  bitnodes:
    name: Bitnodes shared mirror
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_bitnodes) ||
        github.event.schedule == '0 * * * *' ||
        github.event.schedule == '4-59/5 * * * *'
      }}
    uses: ./.github/workflows/bitnodes-latest.yml

  # Future reusable mirror jobs belong here:
  #
  # mempoolspace:
  #   uses: ./.github/workflows/mempoolspace-latest.yml
  #
  # worldfactbook:
  #   uses: ./.github/workflows/worldfactbook-latest.yml
