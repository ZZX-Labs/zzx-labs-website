name: ZZX Live Bitcoin Data Resident 24x7 Service

run-name: >-
  ZZX Live Bitcoin Data / ${{ github.event_name }} / run-${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/bpi/**"
      - "tools/bitnodes/**"
      - "tools/live/**"
      - "tools/site/**"
      - "bitcoin/bpi/api/provider_urls.json"
      - "bitcoin/bpi/api/exchanges.json"
      - "bitcoin/bpi/api/bpi_index_policy.json"
      - "bitcoin/bpi/api/fx_source_urls.json"
      - "bitcoin/bitnodes/api/sources.json"
      - "server/systemd/zzx-bpi.service"
      - "server/systemd/zzx-bitnodes-crawler.service"
      - "server/systemd/zzx-live-data.service"
      - ".github/workflows/bpi-resident.yml"

permissions:
  contents: read

concurrency:
  group: zzx-live-bitcoin-data-resident-deploy
  cancel-in-progress: false

jobs:
  deploy-resident-live-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZZX_HOST: ${{ secrets.ZZX_PRODUCTION_SERVER_HOST || secrets.ZZX_SERVER_HOST }}
      ZZX_USER: ${{ secrets.ZZX_PRODUCTION_SERVER_USER || secrets.ZZX_SERVER_USER }}
      ZZX_PORT: ${{ secrets.ZZX_PRODUCTION_SERVER_PORT || secrets.ZZX_SERVER_PORT }}
      ZZX_SSH_KEY: ${{ secrets.ZZX_PRODUCTION_SERVER_SSH_KEY || secrets.ZZX_SERVER_SSH_KEY }}
      ZZX_KNOWN_HOSTS: ${{ secrets.ZZX_PRODUCTION_SERVER_KNOWN_HOSTS || secrets.ZZX_SERVER_KNOWN_HOSTS }}
      DEPLOY_ROOT: ${{ secrets.ZZX_PRODUCTION_SERVER_PATH || secrets.ZZX_SERVER_PATH || '/srv/zzx-labs' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
      - name: Configure hardened SSH transport
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ZZX_HOST:-}" ] || missing+=(ZZX_SERVER_HOST)
          [ -n "${ZZX_USER:-}" ] || missing+=(ZZX_SERVER_USER)
          [ -n "${ZZX_SSH_KEY:-}" ] || missing+=(ZZX_SERVER_SSH_KEY)
          [ -n "${ZZX_KNOWN_HOSTS:-}" ] || missing+=(ZZX_SERVER_KNOWN_HOSTS)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '%s\n' "::error title=BPI SSH configuration missing::Configure repository secrets: ${missing[*]}"
            exit 78
          fi
          install -d -m 700 "${RUNNER_TEMP}/zzx-ssh"
          printf '%s\n' "${ZZX_SSH_KEY}" > "${RUNNER_TEMP}/zzx-ssh/id_ed25519"
          printf '%s\n' "${ZZX_KNOWN_HOSTS}" > "${RUNNER_TEMP}/zzx-ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/zzx-ssh/id_ed25519" "${RUNNER_TEMP}/zzx-ssh/known_hosts"
          printf 'ZZX_SSH=ssh -i %q -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q -p %q\n' \
            "${RUNNER_TEMP}/zzx-ssh/id_ed25519" "${RUNNER_TEMP}/zzx-ssh/known_hosts" "${ZZX_PORT:-22}" >> "${GITHUB_ENV}"
          ssh -i "${RUNNER_TEMP}/zzx-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${RUNNER_TEMP}/zzx-ssh/known_hosts" \
            -p "${ZZX_PORT:-22}" "${ZZX_USER}@${ZZX_HOST}" 'printf "%s\n" "ZZX SSH preflight OK"'
      - name: Validate Python-only live-data contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/bpi/*.py tools/live/*.py
          python3 tools/bpi/bpi_runtime_healthcheck.py --self-test
          python3 tools/bpi/history_backfill.py --self-test
          python3 tools/bpi/history_semantics_selftest.py
          python3 tools/bpi/backtest_all_exchanges.py --root . --self-test
          python3 tools/bpi/bpi_continuity_selftest.py
          python3 tools/bpi/workflow_contract_selftest.py
          python3 tools/live/live_data_daemon.py --self-test
          python3 tools/live/live_data_healthcheck.py --self-test
          python3 tools/site/no_node_policy.py --root .
          python3 -m json.tool bitcoin/bpi/api/exchanges.json >/dev/null
          python3 -m json.tool bitcoin/bitnodes/api/sources.json >/dev/null

      - name: Deploy live-data code and service definitions over SSH
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "${RUNNER_TEMP}/zzx-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${RUNNER_TEMP}/zzx-ssh/known_hosts" -p "${ZZX_PORT:-22}")
          RSYNC_SSH="ssh -i ${RUNNER_TEMP}/zzx-ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${RUNNER_TEMP}/zzx-ssh/known_hosts -p ${ZZX_PORT:-22}"
          REMOTE="${ZZX_USER}@${ZZX_HOST}"

          "${SSH[@]}" "${REMOTE}" "sudo mkdir -p '${DEPLOY_ROOT}/tools' '${DEPLOY_ROOT}/tools/bitnodes' '${DEPLOY_ROOT}/bitcoin/bpi/api' '${DEPLOY_ROOT}/bitcoin/bitnodes/api' '${DEPLOY_ROOT}/bitcoin/live/api' '${DEPLOY_ROOT}/server/systemd' /var/lib/zzx-bpi/backfill/incoming && sudo chown -R '${ZZX_USER}:${ZZX_USER}' '${DEPLOY_ROOT}/tools' '${DEPLOY_ROOT}/server/systemd' '${DEPLOY_ROOT}/bitcoin/bpi/api' '${DEPLOY_ROOT}/bitcoin/bitnodes/api' '${DEPLOY_ROOT}/bitcoin/live/api'"
          rsync -a --delete -e "${RSYNC_SSH}" tools/bpi/ "${REMOTE}:${DEPLOY_ROOT}/tools/bpi/"
          rsync -a --delete -e "${RSYNC_SSH}" tools/live/ "${REMOTE}:${DEPLOY_ROOT}/tools/live/"
          rsync -a --delete -e "${RSYNC_SSH}" tools/bitnodes/ "${REMOTE}:${DEPLOY_ROOT}/tools/bitnodes/"
          rsync -a --delete -e "${RSYNC_SSH}" tools/site/ "${REMOTE}:${DEPLOY_ROOT}/tools/site/"
          rsync -a -e "${RSYNC_SSH}" server/systemd/zzx-bpi.service server/systemd/zzx-bitnodes-crawler.service server/systemd/zzx-live-data.service "${REMOTE}:${DEPLOY_ROOT}/server/systemd/"
          rsync -a -e "${RSYNC_SSH}" bitcoin/bpi/api/provider_urls.json bitcoin/bpi/api/exchanges.json bitcoin/bpi/api/bpi_index_policy.json bitcoin/bpi/api/fx_source_urls.json "${REMOTE}:${DEPLOY_ROOT}/bitcoin/bpi/api/"
          rsync -a -e "${RSYNC_SSH}" bitcoin/bitnodes/api/sources.json "${REMOTE}:${DEPLOY_ROOT}/bitcoin/bitnodes/api/"

      - name: Install and restart perpetual services remotely
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "${RUNNER_TEMP}/zzx-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${RUNNER_TEMP}/zzx-ssh/known_hosts" -p "${ZZX_PORT:-22}")
          REMOTE="${ZZX_USER}@${ZZX_HOST}"
          "${SSH[@]}" "${REMOTE}" bash -s -- "${DEPLOY_ROOT}" <<'REMOTE'
          set -euo pipefail
          DEPLOY_ROOT="$1"
          if ! id -u zzx >/dev/null 2>&1; then sudo useradd --system --home-dir /var/lib/zzx --create-home --shell /usr/sbin/nologin zzx; fi
          sudo mkdir -p /var/lib/zzx-bpi/backfill/incoming "${DEPLOY_ROOT}/bitcoin/live/api" "${DEPLOY_ROOT}/bitcoin/bitnodes/api"
          sudo chown -R www-data:www-data /var/lib/zzx-bpi "${DEPLOY_ROOT}/bitcoin/bpi/api"
          sudo chown -R zzx:zzx "${DEPLOY_ROOT}/bitcoin/live/api" "${DEPLOY_ROOT}/bitcoin/bitnodes/api"
          for unit in zzx-bpi.service zzx-bitnodes-crawler.service zzx-live-data.service; do
            sudo install -m 0644 "${DEPLOY_ROOT}/server/systemd/${unit}" "/etc/systemd/system/${unit}"
          done
          sudo systemctl daemon-reload
          sudo systemctl enable zzx-bpi.service zzx-bitnodes-crawler.service zzx-live-data.service
          sudo systemctl restart zzx-bpi.service zzx-bitnodes-crawler.service zzx-live-data.service
          REMOTE

      - name: Verify advancing live feeds remotely
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "${RUNNER_TEMP}/zzx-ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="${RUNNER_TEMP}/zzx-ssh/known_hosts" -p "${ZZX_PORT:-22}")
          REMOTE="${ZZX_USER}@${ZZX_HOST}"
          "${SSH[@]}" "${REMOTE}" bash -s -- "${DEPLOY_ROOT}" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          for unit in zzx-bpi zzx-bitnodes-crawler zzx-live-data; do sudo systemctl is-active --quiet "${unit}.service"; done
          python3 "${ROOT}/tools/bpi/bpi_runtime_healthcheck.py" --root "${ROOT}" --max-age-seconds 10 --watch-seconds 12 --max-cycle-gap-seconds 6
          python3 "${ROOT}/tools/live/live_data_healthcheck.py" --root "${ROOT}" --mempool-max-age 15 --mining-max-age 90 --lightning-max-age 90 --nodes-max-age 300
          curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8765/health >/dev/null
          REMOTE
