name: ZZX-Labs Bitnodes Registry Backup

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      BITNODES_REGISTRY_PAT:
        required: false
      BITNODES_REGISTRY_SSH_KEY:
        required: false
    outputs:
      backup_status:
        description: "Private registry backup status: success, skipped-auth, or failed"
        value: ${{ jobs.backup-registry.outputs.backup_status }}
  workflow_run:
    workflows:
      - ZZX-Labs Bitnodes Global Node Crawler
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: zzx-bitnodes-registry-backup
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BITNODES_ROOT: bitcoin/bitnodes
  BITNODES_API: bitcoin/bitnodes/api
  BITNODES_DATA: bitcoin/bitnodes/data
  BITNODES_REGISTRY_OWNER: ZZX-Labs
  BITNODES_REGISTRY_REPO: zzxbitnodesglobalregistry
  MAX_REGISTRY_SHARD_BYTES: "25165824"
  PYTHONUNBUFFERED: "1"

jobs:
  backup-registry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      backup_status: ${{ steps.registry_status.outputs.backup_status }}

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync website repo
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/bitnodes/requirements.txt

      - name: Install registry tools dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/bitnodes/requirements.txt

      - name: Validate registry tools
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            tools/bitnodes/chunk_registry_backup.py \
            tools/bitnodes/update_daily_index.py

          python tools/bitnodes/chunk_registry_backup.py --help
          python tools/bitnodes/update_daily_index.py --help

      - name: Validate committed ZZX registry snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="${BITNODES_API}/zzxbitnodes/latest.json"

          if [ ! -s "${SOURCE}" ]; then
            printf '%s\n' \
              "Committed ZZX registry snapshot is missing or empty: ${SOURCE}"
            exit 1
          fi

          if ! git ls-files --error-unmatch "${SOURCE}" >/dev/null 2>&1; then
            printf '%s\n' \
              "Registry snapshot exists but is not tracked by Git: ${SOURCE}"
            exit 1
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          path = (
              Path(os.environ["BITNODES_API"])
              / "zzxbitnodes"
              / "latest.json"
          )

          payload = json.loads(
              path.read_text(encoding="utf-8")
          )

          nodes = (
              payload.get("nodes")
              if isinstance(payload, dict)
              else None
          )

          if isinstance(nodes, dict):
              count = len(nodes)
          elif isinstance(nodes, list):
              count = len(nodes)
          else:
              count = 0

          if count < 1:
              raise SystemExit(
                  "committed ZZX registry snapshot contains zero nodes"
              )

          source_sha256 = hashlib.sha256(
              path.read_bytes()
          ).hexdigest()

          checkout_commit = (
              subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True,
              )
              .strip()
          )

          source_commit = (
              subprocess.check_output(
                  [
                      "git",
                      "log",
                      "-1",
                      "--format=%H",
                      "--",
                      path.as_posix(),
                  ],
                  text=True,
              )
              .strip()
          )

          source_blob_oid = (
              subprocess.check_output(
                  [
                      "git",
                      "hash-object",
                      path.as_posix(),
                  ],
                  text=True,
              )
              .strip()
          )

          if not source_commit:
              raise SystemExit(
                  "could not resolve the commit that last changed "
                  f"{path}"
              )

          with Path(
              os.environ["GITHUB_OUTPUT"]
          ).open(
              "a",
              encoding="utf-8",
          ) as handle:
              handle.write(
                  f"registry_source={path.as_posix()}\n"
              )
              handle.write(
                  f"source_nodes={count}\n"
              )
              handle.write(
                  f"source_sha256={source_sha256}\n"
              )
              handle.write(
                  f"source_commit={source_commit}\n"
              )
              handle.write(
                  f"checkout_commit={checkout_commit}\n"
              )
              handle.write(
                  f"source_blob_oid={source_blob_oid}\n"
              )

          print(
              "committed ZZX registry snapshot:",
              f"nodes={count}",
              f"sha256={source_sha256}",
              f"source_commit={source_commit}",
              f"checkout_commit={checkout_commit}",
              f"blob={source_blob_oid}",
          )
          PY

          printf '%s\n' \
            "Selected exact committed registry snapshot: ${SOURCE}"
          printf '%s\n' \
            "Full pre-prune runtime/MariaDB history remains the crawler's responsibility."

      - name: Preflight private registry authentication
        id: registry_auth
        shell: bash
        env:
          REGISTRY_PAT: ${{ secrets.BITNODES_REGISTRY_PAT }}
          REGISTRY_SSH_KEY: ${{ secrets.BITNODES_REGISTRY_SSH_KEY }}
        run: |
          set -euo pipefail

          READY="false"
          METHOD="none"
          REASON="no-credential"

          if [ -n "${REGISTRY_PAT:-}" ]; then
            AUTH_JSON="${RUNNER_TEMP}/bitnodes-registry-auth.json"

            set +e
            HTTP_STATUS="$(
              curl \
                --silent \
                --show-error \
                --location \
                --output "${AUTH_JSON}" \
                --write-out '%{http_code}' \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer ${REGISTRY_PAT}" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${BITNODES_REGISTRY_OWNER}/${BITNODES_REGISTRY_REPO}"
            )"
            CURL_STATUS="$?"
            set -e

            if [ "${CURL_STATUS}" -eq 0 ] && [ "${HTTP_STATUS}" = "200" ]; then
              CAN_PUSH="$(
                python - "${AUTH_JSON}" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.loads(path.read_text(encoding="utf-8"))
          permissions = payload.get("permissions") or {}
          print("true" if permissions.get("push") is True else "false")
          PY
              )"

              if [ "${CAN_PUSH}" = "true" ]; then
                READY="true"
                METHOD="pat"
                REASON="pat-ok"
              else
                REASON="pat-no-push-permission"
              fi
            else
              REASON="pat-http-${HTTP_STATUS:-000}"
            fi
          fi

          if [ "${READY}" != "true" ] && [ -n "${REGISTRY_SSH_KEY:-}" ]; then
            READY="true"
            METHOD="ssh"
            REASON="ssh-fallback"
          fi

          printf '%s\n' \
            "ready=${READY}" \
            "method=${METHOD}" \
            "reason=${REASON}" \
            >> "${GITHUB_OUTPUT}"

          if [ "${READY}" = "true" ]; then
            printf '%s\n' \
              "Private Bitnodes registry authentication ready: method=${METHOD}."
          else
            printf '%s\n' \
              "::warning title=Bitnodes registry backup skipped::Private registry authentication is unavailable (${REASON}). The public crawler, API snapshots, maps, live-map, subpages, and widgets are not blocked. Rotate BITNODES_REGISTRY_PAT or configure BITNODES_REGISTRY_SSH_KEY."
          fi

      - name: Backup committed registry snapshot to private repo
        id: registry_backup
        if: ${{ steps.registry_auth.outputs.ready == 'true' }}
        shell: bash
        env:
          REGISTRY_PAT: ${{ secrets.BITNODES_REGISTRY_PAT }}
          REGISTRY_SSH_KEY: ${{ secrets.BITNODES_REGISTRY_SSH_KEY }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_NODES: ${{ steps.source.outputs.source_nodes }}
          SOURCE_SHA256: ${{ steps.source.outputs.source_sha256 }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          CHECKOUT_COMMIT: ${{ steps.source.outputs.checkout_commit }}
          SOURCE_BLOB_OID: ${{ steps.source.outputs.source_blob_oid }}
          REGISTRY_SOURCE: ${{ steps.source.outputs.registry_source }}
        run: |
          set -euo pipefail

          if ! [[ "${SOURCE_NODES}" =~ ^[0-9]+$ ]] || [ "${SOURCE_NODES}" -lt 1 ]; then
            printf '%s\n' \
              "Validated source node count is missing or invalid: ${SOURCE_NODES}"
            exit 1
          fi

          if ! [[ "${SOURCE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            printf '%s\n' \
              "Validated source SHA256 is missing or invalid."
            exit 1
          fi

          if ! [[ "${SOURCE_COMMIT}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf '%s\n' \
              "Validated source-file commit SHA is missing or invalid."
            exit 1
          fi

          if ! [[ "${CHECKOUT_COMMIT}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf '%s\n' \
              "Validated checkout commit SHA is missing or invalid."
            exit 1
          fi

          if ! [[ "${SOURCE_BLOB_OID}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            printf '%s\n' \
              "Validated source Git blob OID is missing or invalid."
            exit 1
          fi

          TODAY="$(date -u +%Y-%m-%d)"
          SOURCE_RUN_ID="${TRIGGER_RUN_ID}-${TRIGGER_RUN_ATTEMPT}"
          RUN_ID="${SOURCE_RUN_ID}-${SOURCE_COMMIT:0:12}"

          BACKUP_ROOT="$(mktemp -d)"
          ASKPASS="$(mktemp)"
          SSH_KEY_FILE="$(mktemp)"
          KNOWN_HOSTS="$(mktemp)"

          export TODAY
          export SOURCE_RUN_ID
          export RUN_ID
          export BACKUP_ROOT

          cleanup() {
            rm -f "${ASKPASS}" "${SSH_KEY_FILE}" "${KNOWN_HOSTS}"
            rm -rf "${BACKUP_ROOT}"
          }

          trap cleanup EXIT

          AUTH_METHOD="${{ steps.registry_auth.outputs.method }}"

          case "${AUTH_METHOD}" in
            pat)
              cat > "${ASKPASS}" <<'ASKPASS'
          #!/usr/bin/env bash
          case "${1:-}" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "${REGISTRY_PAT}" ;;
            *) printf '%s\n' "" ;;
          esac
          ASKPASS
              chmod 700 "${ASKPASS}"
              export GIT_ASKPASS="${ASKPASS}"
              export GIT_TERMINAL_PROMPT=0
              REGISTRY_REMOTE="https://github.com/${BITNODES_REGISTRY_OWNER}/${BITNODES_REGISTRY_REPO}.git"
              ;;
            ssh)
              printf '%s\n' "${REGISTRY_SSH_KEY}" | tr -d '\r' > "${SSH_KEY_FILE}"
              chmod 600 "${SSH_KEY_FILE}"
              ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "${KNOWN_HOSTS}" 2>/dev/null
              export GIT_SSH_COMMAND="ssh -i ${SSH_KEY_FILE} -o IdentitiesOnly=yes -o UserKnownHostsFile=${KNOWN_HOSTS} -o StrictHostKeyChecking=yes"
              export GIT_TERMINAL_PROMPT=0
              REGISTRY_REMOTE="git@github.com:${BITNODES_REGISTRY_OWNER}/${BITNODES_REGISTRY_REPO}.git"
              ;;
            *)
              printf '%s\n' "Unsupported registry authentication method: ${AUTH_METHOD}"
              exit 1
              ;;
          esac

          git clone \
            --filter=blob:none \
            --single-branch \
            --branch main \
            "${REGISTRY_REMOTE}" \
            "${BACKUP_ROOT}"

          REMOTE_URL="$(
            git -C "${BACKUP_ROOT}" remote get-url origin
          )"

          if [ -n "${REGISTRY_PAT:-}" ] && printf '%s' "${REMOTE_URL}" | grep -Fq "${REGISTRY_PAT}"; then
            printf '%s\n' \
              "Refusing registry remote containing embedded credentials."
            exit 1
          fi

          mkdir -p \
            "${BACKUP_ROOT}/registry/${TODAY}/${RUN_ID}" \
            "${BACKUP_ROOT}/latest" \
            "${BACKUP_ROOT}/manifests"

          # chunk_registry_backup.py recursively merges every supported file
          # supplied through --input and --api. Passing the entire zzxbitnodes
          # API directory would create a union, not an exact latest.json backup.
          #
          # Both required arguments intentionally point to the same validated
          # latest.json. collect_input_files() deduplicates the resolved path.
          python tools/bitnodes/chunk_registry_backup.py \
            --input "${REGISTRY_SOURCE}" \
            --api "${REGISTRY_SOURCE}" \
            --output "${BACKUP_ROOT}/registry/${TODAY}/${RUN_ID}" \
            --latest-output "${BACKUP_ROOT}/latest" \
            --max-mb 24 \
            --source zzxbitnodes

          python tools/bitnodes/update_daily_index.py \
            --repo-root "${BACKUP_ROOT}/registry" \
            --db-root "${BACKUP_ROOT}/latest" \
            --output-dir "${BACKUP_ROOT}/manifests" \
            --index-date "${TODAY}" \
            --max-mb 24 \
            --compact

          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(
              os.environ["BACKUP_ROOT"]
          )

          today = os.environ["TODAY"]
          run_id = os.environ["RUN_ID"]

          run_dir = (
              root
              / "registry"
              / today
              / run_id
          )

          latest_dir = (
              root
              / "latest"
          )

          manifest_dir = (
              root
              / "manifests"
          )

          max_bytes = int(
              os.environ[
                  "MAX_REGISTRY_SHARD_BYTES"
              ]
          )

          expected_nodes = int(
              os.environ["SOURCE_NODES"]
          )

          expected_source_sha256 = (
              os.environ["SOURCE_SHA256"]
          )

          source_commit = (
              os.environ["SOURCE_COMMIT"]
          )

          checkout_commit = (
              os.environ["CHECKOUT_COMMIT"]
          )

          source_blob_oid = (
              os.environ["SOURCE_BLOB_OID"]
          )

          trigger_run_id = (
              os.environ["TRIGGER_RUN_ID"]
          )

          trigger_run_attempt = (
              os.environ[
                  "TRIGGER_RUN_ATTEMPT"
              ]
          )

          trigger_head_sha = (
              os.environ.get(
                  "TRIGGER_HEAD_SHA",
                  "",
              )
          )

          required = [
              run_dir
              / "manifest.sql.gz",

              latest_dir
              / "manifest.sql.gz",

              latest_dir
              / "latest.sql.gz",

              manifest_dir
              / "latest-index.sql.gz",

              manifest_dir
              / "bitnodes-index-control.sql.gz",
          ]

          for path in required:
              if (
                  not path.is_file()
                  or path.stat().st_size <= 0
              ):
                  raise SystemExit(
                      "missing or empty registry artifact: "
                      f"{path}"
                  )

          run_shards = sorted(
              run_dir.glob(
                  "nodes-*.sql.gz"
              )
          )

          latest_shards = sorted(
              latest_dir.glob(
                  "nodes-*.sql.gz"
              )
          )

          if not run_shards:
              raise SystemExit(
                  "registry backup produced zero dated node shards"
              )

          if not latest_shards:
              raise SystemExit(
                  "registry backup produced zero latest node shards"
              )

          run_names = [
              path.name
              for path
              in run_shards
          ]

          latest_names = [
              path.name
              for path
              in latest_shards
          ]

          if run_names != latest_names:
              raise SystemExit(
                  "dated/latest node shard names do not match"
              )

          all_gzip_artifacts = sorted(
              {
                  *run_dir.glob(
                      "*.sql.gz"
                  ),
                  *latest_dir.glob(
                      "*.sql.gz"
                  ),
                  *manifest_dir.glob(
                      "*.sql.gz"
                  ),
              },
              key=lambda path: (
                  path
                  .relative_to(root)
                  .as_posix()
              ),
          )

          if not all_gzip_artifacts:
              raise SystemExit(
                  "registry backup produced zero gzip SQL artifacts"
              )

          sql_node_rows = 0
          files = []

          for path in all_gzip_artifacts:
              size = path.stat().st_size

              if size <= 0:
                  raise SystemExit(
                      "empty registry artifact: "
                      f"{path}"
                  )

              if size > max_bytes:
                  raise SystemExit(
                      "registry artifact exceeds 24 MiB ceiling: "
                      f"{size} {path}"
                  )

              try:
                  with gzip.open(
                      path,
                      "rt",
                      encoding="utf-8",
                      errors="strict",
                  ) as handle:
                      text = handle.read()

              except Exception as exc:
                  raise SystemExit(
                      "invalid gzip/text registry artifact: "
                      f"{path}: {exc}"
                  )

              if path in run_shards:
                  sql_node_rows += len(
                      re.findall(
                          r"INSERT\s+INTO\s+bitnodes_registry_nodes\b",
                          text,
                          flags=re.IGNORECASE,
                      )
                  )

              digest = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

              files.append(
                  {
                      "path": (
                          path
                          .relative_to(root)
                          .as_posix()
                      ),
                      "size_bytes": size,
                      "sha256": digest,
                  }
              )

          # chunk_registry_backup.py emits one node-table INSERT per normalized
          # node. This catches truncation, accidental source unioning, and
          # silent loss between the selected JSON and SQL shards.
          if sql_node_rows != expected_nodes:
              raise SystemExit(
                  "registry node-row mismatch: "
                  f"source_nodes={expected_nodes} "
                  f"sql_node_rows={sql_node_rows}"
              )

          # latest/nodes-*.sql.gz is the moving alias of this dated run.
          # It must be byte-for-byte identical to the dated shard set.
          for dated, latest in zip(
              run_shards,
              latest_shards,
              strict=True,
          ):
              dated_sha = hashlib.sha256(
                  dated.read_bytes()
              ).hexdigest()

              latest_sha = hashlib.sha256(
                  latest.read_bytes()
              ).hexdigest()

              if dated_sha != latest_sha:
                  raise SystemExit(
                      "dated/latest shard mismatch: "
                      f"{dated.name}"
                  )

          verification = {
              "schema": (
                  "zzx-bitnodes-registry-"
                  "backup-verification-v2"
              ),

              "date":
                  today,

              "run_id":
                  run_id,

              "trigger_workflow_run_id":
                  trigger_run_id,

              "trigger_workflow_run_attempt":
                  trigger_run_attempt,

              "trigger_head_sha":
                  trigger_head_sha,

              "source_file_commit_sha":
                  source_commit,

              "checkout_commit_sha":
                  checkout_commit,

              "source_git_blob_oid":
                  source_blob_oid,

              "source_snapshot_sha256":
                  expected_source_sha256,

              "source_node_count":
                  expected_nodes,

              "sql_node_row_count":
                  sql_node_rows,

              "node_shard_count":
                  len(run_shards),

              "files":
                  files,
          }

          verification_path = (
              manifest_dir
              / "backup-verification.json"
          )

          verification_path.write_text(
              json.dumps(
                  verification,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              "registry backup verified:",
              f"source_nodes={expected_nodes}",
              f"sql_node_rows={sql_node_rows}",
              f"node_shards={len(run_shards)}",
              f"gzip_artifacts={len(all_gzip_artifacts)}",
              f"source_commit={source_commit}",
              f"checkout_commit={checkout_commit}",
          )
          PY

          cd "${BACKUP_ROOT}"

          git config \
            user.name \
            "zzx-labs-bitnodes-bot"

          git config \
            user.email \
            "actions@github.com"

          git add -A \
            registry \
            latest \
            manifests

          if [ -f README.md ]; then
            git add README.md
          fi

          if git diff --cached --quiet; then
            printf '%s\n' \
              "No private registry backup changes to commit."
            exit 0
          fi

          git commit -m \
            "Backup global Bitnodes registry ${TODAY} ${RUN_ID}"

          if [ -n "$(git status --porcelain)" ]; then
            printf '%s\n' \
              "Refusing to publish from a dirty private registry worktree."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true

              printf '%s\n' \
                "Private registry rebase attempt ${attempt} failed; retrying without force."

              git reset --hard HEAD
              git clean -fdx
              sleep 10
              continue
            fi

            if git push origin HEAD:main; then
              printf '%s\n' \
                "Private Bitnodes registry backup pushed."
              exit 0
            fi

            printf '%s\n' \
              "Private registry push attempt ${attempt} failed; retrying without force."

            git reset --hard HEAD
            git clean -fdx
            sleep 10
          done

          printf '%s\n' \
            "Failed to push private Bitnodes registry backup without rewriting main."
          exit 1

      - name: Report private registry backup status
        id: registry_status
        if: ${{ always() }}
        shell: bash
        env:
          AUTH_READY: ${{ steps.registry_auth.outputs.ready }}
          AUTH_METHOD: ${{ steps.registry_auth.outputs.method }}
          AUTH_REASON: ${{ steps.registry_auth.outputs.reason }}
          BACKUP_OUTCOME: ${{ steps.registry_backup.outcome }}
        run: |
          set -euo pipefail

          if [ "${AUTH_READY}" != "true" ]; then
            STATUS="skipped-auth"
          elif [ "${BACKUP_OUTCOME}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi

          printf '%s\n' "backup_status=${STATUS}" >> "${GITHUB_OUTPUT}"

          {
            printf '%s\n' "### Bitnodes private registry backup"
            printf '%s\n' ""
            printf '%s\n' "- status: \`${STATUS}\`"
            printf '%s\n' "- auth method: \`${AUTH_METHOD:-none}\`"
            printf '%s\n' "- auth reason: \`${AUTH_REASON:-unknown}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          printf '%s\n' \
            "Private registry backup status=${STATUS} auth=${AUTH_METHOD:-none} reason=${AUTH_REASON:-unknown}."

