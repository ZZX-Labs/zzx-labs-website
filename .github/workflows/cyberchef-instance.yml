name: ZZX-CyberChef Local Frontends

on:
  workflow_dispatch:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or an explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Deploy the validated site to GitHub Pages"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or an explicit version/tag"
        required: false
        type: string
        default: "latest"
      deploy_pages:
        description: "Deploy the validated site to GitHub Pages"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: zzx-labs-pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CYBERCHEF_REQUESTED_VERSION: ${{ inputs.cyberchef_version || 'latest' }}

jobs:
  build:
    name: Build Native + ZZX CyberChef Frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Checked out $(git rev-parse HEAD)"

      - name: Validate CyberChef builder and ZZX overlay source
        shell: bash
        run: |
          set -euo pipefail

          test -f tools/cyberchef/cyberchef.py
          python3 -m py_compile tools/cyberchef/cyberchef.py

          OVERLAY_FILES=(
            cyberchef/styles.css
            cyberchef/upgrades.css
            cyberchef/modifications.css
            cyberchef/hook.js
            cyberchef/script.js
            cyberchef/container.js
            cyberchef/upgrades.js
            cyberchef/modifications.js
          )

          for file in "${OVERLAY_FILES[@]}"; do
            test -s "${file}"
          done

          printf '%s\n' "CyberChef builder and ZZX overlay source validated."

      - name: Stage complete Pages site except generated CyberChef runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --delete \
            --exclude "/.git/" \
            --exclude "/.github/" \
            --exclude "/_site/" \
            --exclude "/build/" \
            --exclude "/cyberchef/" \
            ./ _site/

          # Keep the public /tools/ website tree. Only the CyberChef Python
          # build helper is repository tooling and must not be published.
          rm -f _site/tools/cyberchef/cyberchef.py
          find _site/tools/cyberchef -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          find _site/tools/cyberchef -type f \(-name '*.pyc' -o -name '*.pyo' \) -delete 2>/dev/null || true

      - name: Build latest official CyberChef twice from one release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 tools/cyberchef/cyberchef.py \
            --version "${CYBERCHEF_REQUESTED_VERSION}" \
            --overlay-dir cyberchef \
            --output-dir _site/cyberchef

      - name: Verify native and customized CyberChef routes
        shell: bash
        run: |
          set -euo pipefail

          test -s _site/cyberchef/index.html
          test -s _site/cyberchef/app/index.html
          test -s _site/cyberchef/app/native.html
          test -s _site/cyberchef/runtime-manifest.json

          test -d _site/cyberchef/assets
          test -d _site/cyberchef/app/assets
          test -d _site/cyberchef/zzx

          find _site/cyberchef/assets -type f -print -quit | grep -q .
          find _site/cyberchef/app/assets -type f -print -quit | grep -q .

          # Root is a real upstream CyberChef page with ZZX assets layered on top.
          grep -q 'name="zzx-cyberchef-overlay"' _site/cyberchef/index.html
          grep -q 'zzx/styles.css' _site/cyberchef/index.html
          grep -q 'zzx/modifications.js' _site/cyberchef/index.html

          # Existing site links under /tools/cyberchef/ remain valid via a
          # lightweight redirect to the customized runtime.
          test -s _site/tools/cyberchef/index.html
          grep -q '../../cyberchef/' _site/tools/cyberchef/index.html

          # The API documentation links to both published runtime routes.
          test -s _site/api/cyberchef/index.html
          grep -q '../../cyberchef/' _site/api/cyberchef/index.html
          grep -q '../../cyberchef/app/' _site/api/cyberchef/index.html

          # /app/ is deliberately untouched by the ZZX overlay.
          if grep -q 'name="zzx-cyberchef-overlay"' _site/cyberchef/app/index.html; then
            printf '%s\n' "ERROR: native /cyberchef/app/ contains ZZX overlay markup."
            exit 1
          fi

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("_site/cyberchef")
          manifest = json.loads((root / "runtime-manifest.json").read_text(encoding="utf-8"))

          if manifest.get("schema") != "zzx-cyberchef-runtime-v2":
              raise SystemExit("Unexpected CyberChef runtime manifest schema")

          release = manifest.get("release", {})
          if not release.get("version") or not release.get("tag") or not release.get("sha256"):
              raise SystemExit("CyberChef manifest release metadata incomplete")

          native = manifest.get("native_frontend", {})
          if native.get("overlay_applied") is not False:
              raise SystemExit("Native frontend incorrectly marked as customized")

          digest = hashlib.sha256((root / "app" / "index.html").read_bytes()).hexdigest()
          if digest != native.get("index_sha256"):
              raise SystemExit("Native CyberChef index hash mismatch")

          print("Resolved CyberChef:", release["tag"])
          print("Custom route: /cyberchef/")
          print("Native route: /cyberchef/app/")
          PY

      - name: Deploy validated site to gh-pages with native Git
        if: ${{ inputs.deploy_pages }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d _site

          DEPLOY_DIR="$(mktemp -d)"
          trap 'rm -rf "${DEPLOY_DIR}"' EXIT
          cp -a _site/. "${DEPLOY_DIR}/"
          cd "${DEPLOY_DIR}"

          git init .
          git checkout --orphan gh-pages
          git config user.name "zzx-pages-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy site with CyberChef ${GITHUB_SHA}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git push --force origin HEAD:gh-pages

      - name: Request GitHub Pages build
        if: ${{ inputs.deploy_pages }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pages/builds"
          request = urllib.request.Request(
              url,
              data=b"{}",
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "zzx-native-pages-deployer",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in {200, 201, 202}:
                      raise SystemExit(f"Unexpected Pages build status: {response.status}")
                  print("GitHub Pages build requested:", response.status)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              if exc.code == 409:
                  print("GitHub Pages build already queued/in progress; continuing.")
              else:
                  raise SystemExit(f"GitHub Pages build request failed: HTTP {exc.code}: {body}")
          PY
