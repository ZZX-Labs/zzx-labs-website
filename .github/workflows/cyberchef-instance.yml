name: ZZX-CyberChef Local Frontends

on:
  workflow_dispatch:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or an explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Deploy the validated build to GitHub Pages"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or an explicit version/tag"
        required: false
        type: string
        default: "latest"
      deploy_pages:
        description: "Deploy the validated build to GitHub Pages"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: zzx-labs-pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CYBERCHEF_REQUESTED_VERSION: ${{ inputs.cyberchef_version || 'latest' }}

jobs:
  build:
    name: Build ZZX + Native CyberChef Frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout ZZX-Labs website (native Git; no JavaScript action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZZX_FETCH_DEPTH: "1"
        run: |
          set -euo pipefail
          command -v git >/dev/null
          git init .
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          if [ "${ZZX_FETCH_DEPTH}" = "0" ]; then
            git fetch --force --prune --no-tags origin "${GITHUB_SHA}"
          else
            git fetch --force --prune --no-tags --depth="${ZZX_FETCH_DEPTH}" origin "${GITHUB_SHA}"
          fi
          git checkout --force --detach FETCH_HEAD
          git clean -fdx
          printf '%s\n' "Native Git checkout complete: $(git rev-parse HEAD)"

      - name: Resolve official CyberChef release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          requested = os.environ.get("CYBERCHEF_REQUESTED_VERSION", "latest").strip()
          token = os.environ.get("GH_TOKEN", "").strip()

          if not requested:
              requested = "latest"

          if requested.lower() in {"latest", "stable"}:
              api_url = "https://api.github.com/repos/gchq/CyberChef/releases/latest"
          else:
              tag = requested if requested.startswith("v") else f"v{requested}"
              api_url = (
                  "https://api.github.com/repos/gchq/CyberChef/releases/tags/"
                  + urllib.parse.quote(tag, safe="")
              )

          headers = {
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zzx-cyberchef-release-resolver",
          }

          if token:
              headers["Authorization"] = f"Bearer {token}"

          request = urllib.request.Request(api_url, headers=headers)

          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          tag = str(release.get("tag_name", "")).strip()
          release_page = str(release.get("html_url", "")).strip()
          release_name = str(release.get("name", "") or tag).strip()

          if not tag:
              raise SystemExit("CyberChef release API returned no tag_name.")

          version = tag[1:] if tag.startswith("v") else tag

          if not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z._+-]*", version):
              raise SystemExit(f"Unsafe CyberChef release version: {version!r}")

          assets = release.get("assets") or []
          preferred_names = (
              f"CyberChef_{tag}.zip",
              f"CyberChef_v{version}.zip",
              f"CyberChef_{version}.zip",
          )

          asset = next(
              (
                  item
                  for name in preferred_names
                  for item in assets
                  if str(item.get("name", "")) == name
              ),
              None,
          )

          if asset is None:
              candidates = [
                  item
                  for item in assets
                  if str(item.get("name", "")).lower().startswith("cyberchef")
                  and str(item.get("name", "")).lower().endswith(".zip")
              ]

              if len(candidates) == 1:
                  asset = candidates[0]
              elif len(candidates) > 1:
                  names = ", ".join(str(item.get("name", "")) for item in candidates)
                  raise SystemExit(
                      "CyberChef release has multiple ZIP assets and no canonical match: "
                      + names
                  )

          if asset is None:
              names = ", ".join(
                  str(item.get("name", ""))
                  for item in assets
                  if item.get("name")
              )
              raise SystemExit(
                  "No CyberChef release ZIP asset found. Assets: "
                  + (names or "<none>")
              )

          asset_name = str(asset.get("name", "")).strip()
          asset_url = str(asset.get("browser_download_url", "")).strip()

          if not re.fullmatch(r"[0-9A-Za-z._+-]+\.zip", asset_name):
              raise SystemExit(f"Unsafe CyberChef asset name: {asset_name!r}")

          parsed = urllib.parse.urlparse(asset_url)

          if parsed.scheme != "https" or parsed.hostname != "github.com":
              raise SystemExit(f"Unexpected CyberChef asset URL: {asset_url!r}")

          env_file = Path(os.environ["GITHUB_ENV"])

          values = {
              "CYBERCHEF_VERSION": version,
              "CYBERCHEF_TAG": tag,
              "CYBERCHEF_RELEASE_NAME": release_name,
              "CYBERCHEF_RELEASE_PAGE": release_page,
              "CYBERCHEF_RELEASE_ASSET": asset_name,
              "CYBERCHEF_RELEASE_URL": asset_url,
          }

          with env_file.open("a", encoding="utf-8") as fh:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Unsafe newline in {key}.")
                  fh.write(f"{key}={value}\n")

          print(f"Resolved CyberChef request {requested!r} -> {tag}")
          print(f"Release asset: {asset_name}")
          print(f"Release page: {release_page}")
          PY
      - name: Validate CyberChef source trees
        shell: bash
        run: |
          set -euo pipefail

          case "${CYBERCHEF_VERSION}" in
            *[!0-9A-Za-z._+-]*|"")
              printf '%s\n' "Invalid CyberChef version: ${CYBERCHEF_VERSION}"
              exit 1
              ;;
          esac

          test -d cyberchef
          test -d tools/cyberchef
          test -f tools/cyberchef/cyberchef.py
          python3 -m py_compile tools/cyberchef/cyberchef.py

          ROOT_FILES=(
            cyberchef/index.html
            cyberchef/styles.css
            cyberchef/script.js
            cyberchef/hook.js
            cyberchef/container.js
            cyberchef/upgrades.css
            cyberchef/upgrades.js
            cyberchef/modifications.css
            cyberchef/modifications.js
            cyberchef/cyberchef.html
            cyberchef/ATTRIBUTION.md
            cyberchef/LICENSE-NOTICE.md
          )

          for file in "${ROOT_FILES[@]}"; do
            test -s "${file}"
          done

          grep -q 'id="cz-runtime"' cyberchef/index.html
          grep -q 'CyberChefZZX' cyberchef/index.html

          printf '%s\n' "CyberChef source trees validated."

      - name: Record protected ZZX frontend hashes
        shell: bash
        run: |
          set -euo pipefail

          ROOT_FILES=(
            cyberchef/index.html
            cyberchef/styles.css
            cyberchef/script.js
            cyberchef/hook.js
            cyberchef/container.js
            cyberchef/upgrades.css
            cyberchef/upgrades.js
            cyberchef/modifications.css
            cyberchef/modifications.js
            cyberchef/cyberchef.html
            cyberchef/ATTRIBUTION.md
            cyberchef/LICENSE-NOTICE.md
          )

          : > "${RUNNER_TEMP}/zzx-cyberchef-root.sha256"

          for file in "${ROOT_FILES[@]}"; do
            sha256sum "${file}" >> "${RUNNER_TEMP}/zzx-cyberchef-root.sha256"
          done

          sort -o \
            "${RUNNER_TEMP}/zzx-cyberchef-root.sha256" \
            "${RUNNER_TEMP}/zzx-cyberchef-root.sha256"

      - name: Stage complete Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            _site \
            _cyberchef-download \
            _cyberchef-extract

          mkdir -p _site

          rsync -a \
            --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "_site" \
            --exclude "_cyberchef-download" \
            --exclude "_cyberchef-extract" \
            --exclude "cyberchef/app" \
            --exclude "cyberchef/assets" \
            ./ _site/

          # tools/cyberchef is repository tooling, not a public runtime.
          rm -rf _site/tools

      - name: Download resolved upstream CyberChef release
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _cyberchef-download

          ARCHIVE="_cyberchef-download/${CYBERCHEF_RELEASE_ASSET}"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 5 \
            --output "${ARCHIVE}" \
            "${CYBERCHEF_RELEASE_URL}"

          test -s "${ARCHIVE}"
          unzip -tqq "${ARCHIVE}"

          sha256sum "${ARCHIVE}" \
            | tee "${RUNNER_TEMP}/cyberchef-release.sha256"

          printf '%s\n' "release_url=${CYBERCHEF_RELEASE_URL}" >> "${GITHUB_ENV}"
          printf '%s\n' "release_archive=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Install isolated native CyberChef runtime
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _cyberchef-extract
          rm -rf _site/cyberchef/app _site/cyberchef/assets
          mkdir -p _site/cyberchef/app

          unzip -q \
            -o "${release_archive}" \
            -d _cyberchef-extract

          if [ -d "_cyberchef-extract/CyberChef" ]; then
            SOURCE_DIR="_cyberchef-extract/CyberChef"
          else
            SOURCE_DIR="_cyberchef-extract"
          fi

          CYBERCHEF_HTML="$(
            find "${SOURCE_DIR}" \
              -maxdepth 5 \
              -type f \
              \( -name 'CyberChef*.html' -o -name 'Cyberchef*.html' \) \
              -print \
              | sort \
              | head -n 1
          )"

          if [ -z "${CYBERCHEF_HTML}" ]; then
            printf '%s\n' \
              "ERROR: no upstream CyberChef HTML entrypoint found."
            find "${SOURCE_DIR}" -maxdepth 6 -type f | sort
            exit 1
          fi

          HTML_DIR="$(dirname "${CYBERCHEF_HTML}")"

          if [ ! -d "${HTML_DIR}/assets" ]; then
            printf '%s\n' \
              "ERROR: upstream CyberChef assets directory not found beside entrypoint."
            find "${SOURCE_DIR}" -maxdepth 6 -type d | sort
            exit 1
          fi

          cp -a "${HTML_DIR}/." _site/cyberchef/app/

          cp "${CYBERCHEF_HTML}" \
            _site/cyberchef/app/index.html

          cp "${CYBERCHEF_HTML}" \
            _site/cyberchef/app/native.html

          cp -a \
            _site/cyberchef/app/assets \
            _site/cyberchef/assets

          test -s _site/cyberchef/app/index.html
          test -s _site/cyberchef/app/native.html
          test -d _site/cyberchef/app/assets
          test -n "$(find _site/cyberchef/app/assets -type f -name '*.js' -print -quit)"
          test -n "$(find _site/cyberchef/app/assets -type f -name '*.css' -print -quit)"

      - name: Generate native runtime storage and dark-mode shim
        shell: bash
        run: |
          set -euo pipefail

          cat > _site/cyberchef/app/script.js <<'EOF'
          (function () {
              "use strict";

              function memoryStorage() {
                  var mem = {};

                  return {
                      getItem: function (k) {
                          return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
                      },
                      setItem: function (k, v) {
                          mem[k] = String(v);
                      },
                      removeItem: function (k) {
                          delete mem[k];
                      },
                      clear: function () {
                          mem = {};
                      },
                      key: function (i) {
                          return Object.keys(mem)[i] || null;
                      },
                      get length() {
                          return Object.keys(mem).length;
                      }
                  };
              }

              function installStorage(name) {
                  try {
                      var s = window[name];
                      var k = "__zzx_storage_test__";
                      s.setItem(k, "1");
                      s.removeItem(k);
                  } catch (e) {
                      try {
                          Object.defineProperty(window, name, {
                              configurable: true,
                              value: memoryStorage()
                          });
                      } catch (ignored) {}
                  }
              }

              installStorage("localStorage");
              installStorage("sessionStorage");

              try {
                  var originalSetItem = Storage.prototype.setItem;

                  Storage.prototype.setItem = function (key, value) {
                      try {
                          return originalSetItem.call(this, key, value);
                      } catch (e) {
                          if (
                              e &&
                              (
                                  e.name === "QuotaExceededError" ||
                                  e.name === "NS_ERROR_DOM_QUOTA_REACHED"
                              )
                          ) {
                              return null;
                          }

                          throw e;
                      }
                  };
              } catch (ignored) {}

              function forceDark() {
                  try {
                      var existing = localStorage.getItem("options");
                      var options = existing ? JSON.parse(existing) : {};

                      options.theme = "dark";
                      options.themeName = "dark";
                      options.darkMode = true;
                      options.wordWrap = true;
                      options.showErrors = true;
                      options.updateUrl = true;

                      localStorage.setItem("options", JSON.stringify(options));
                      localStorage.setItem("theme", "dark");
                      localStorage.setItem("cyberchef-theme", "dark");
                  } catch (ignored) {}

                  try {
                      document.documentElement.classList.remove(
                          "classic",
                          "geocities",
                          "solarizedDark",
                          "solarizedLight"
                      );

                      document.documentElement.classList.add("dark");
                  } catch (ignored) {}
              }

              forceDark();

              document.addEventListener("DOMContentLoaded", function () {
                  forceDark();
                  setTimeout(forceDark, 50);
                  setTimeout(forceDark, 250);
                  setTimeout(forceDark, 1000);
              });

              window.addEventListener("load", function () {
                  forceDark();
                  setTimeout(forceDark, 250);
                  setTimeout(forceDark, 1000);
                  setTimeout(forceDark, 2500);
              });
          })();
          EOF

      - name: Insert native shim before upstream runtime scripts
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def insert(path: Path) -> None:
              html = path.read_text(
                  encoding="utf-8",
                  errors="strict",
              )

              shim_src = "script.js"

              if f'src="{shim_src}"' in html or f"src='{shim_src}'" in html:
                  return

              pattern = r'(<script[^>]+src=["\'][^"\']+["\'][^>]*></script>)'

              patched = re.sub(
                  pattern,
                  rf'<script src="{shim_src}"></script>\n\1',
                  html,
                  count=1,
                  flags=re.I,
              )

              if patched == html:
                  patched = html.replace(
                      "</head>",
                      f'<script src="{shim_src}"></script>\n</head>',
                      1,
                  )

              if patched == html:
                  raise SystemExit(
                      f"could not inject native CyberChef shim into {path}"
                  )

              path.write_text(
                  patched,
                  encoding="utf-8",
              )

          for file_name in (
              "index.html",
              "native.html",
          ):
              insert(
                  Path("_site/cyberchef/app") / file_name
              )
          PY

      - name: Write local runtime manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          archive = Path(os.environ["release_archive"])
          root = Path("_site/cyberchef")

          protected = [
              "index.html",
              "styles.css",
              "script.js",
              "hook.js",
              "container.js",
              "upgrades.css",
              "upgrades.js",
              "modifications.css",
              "modifications.js",
              "cyberchef.html",
              "ATTRIBUTION.md",
              "LICENSE-NOTICE.md",
          ]

          files = {}

          for relative in protected:
              path = root / relative
              files[relative] = hashlib.sha256(
                  path.read_bytes()
              ).hexdigest()

          payload = {
              "schema": "zzx-cyberchef-runtime-v1",
              "generated_at": datetime.now(
                  timezone.utc
              ).replace(microsecond=0).isoformat().replace(
                  "+00:00",
                  "Z",
              ),
              "repository_commit": os.environ.get(
                  "GITHUB_SHA",
                  "",
              ),
              "zzx_frontend": {
                  "path": "/cyberchef/",
                  "protected_files": files,
              },
              "native_frontend": {
                  "path": "/cyberchef/app/",
                  "requested_version": os.environ.get(
                      "CYBERCHEF_REQUESTED_VERSION",
                      "latest",
                  ),
                  "version": os.environ["CYBERCHEF_VERSION"],
                  "tag": os.environ["CYBERCHEF_TAG"],
                  "release_name": os.environ["CYBERCHEF_RELEASE_NAME"],
                  "release_page": os.environ["CYBERCHEF_RELEASE_PAGE"],
                  "release_asset": os.environ["CYBERCHEF_RELEASE_ASSET"],
                  "release_url": os.environ["release_url"],
                  "release_sha256": hashlib.sha256(
                      archive.read_bytes()
                  ).hexdigest(),
              },
              "assets_alias": "/cyberchef/assets/",
          }

          (root / "runtime-manifest.json").write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify protected ZZX frontend was not overwritten
        shell: bash
        run: |
          set -euo pipefail

          while read -r EXPECTED SOURCE; do
            RELATIVE="${SOURCE#cyberchef/}"
            TARGET="_site/cyberchef/${RELATIVE}"

            test -s "${TARGET}"

            ACTUAL="$(
              sha256sum "${TARGET}" \
                | awk '{print $1}'
            )"

            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
              printf '%s\n' \
                "Protected ZZX CyberChef file changed during build: ${RELATIVE}"
              exit 1
            fi
          done < "${RUNNER_TEMP}/zzx-cyberchef-root.sha256"

          printf '%s\n' \
            "ZZX CyberChef root frontend preserved byte-for-byte."

      - name: Validate complete CyberChef deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          ROOT_FILES=(
            _site/cyberchef/index.html
            _site/cyberchef/styles.css
            _site/cyberchef/script.js
            _site/cyberchef/hook.js
            _site/cyberchef/container.js
            _site/cyberchef/upgrades.css
            _site/cyberchef/upgrades.js
            _site/cyberchef/modifications.css
            _site/cyberchef/modifications.js
            _site/cyberchef/cyberchef.html
            _site/cyberchef/ATTRIBUTION.md
            _site/cyberchef/LICENSE-NOTICE.md
            _site/cyberchef/runtime-manifest.json
          )

          for file in "${ROOT_FILES[@]}"; do
            test -s "${file}"
          done

          test -s _site/cyberchef/app/index.html
          test -s _site/cyberchef/app/native.html
          test -s _site/cyberchef/app/script.js
          test -d _site/cyberchef/app/assets
          test -d _site/cyberchef/assets
          test -n "$(find _site/cyberchef/app/assets -type f -name '*.css' -print -quit)"
          test -n "$(find _site/cyberchef/app/assets -type f -name '*.js' -print -quit)"
          test -n "$(find _site/cyberchef/assets -type f -name '*.css' -print -quit)"
          test -n "$(find _site/cyberchef/assets -type f -name '*.js' -print -quit)"

          grep -q 'CyberChefZZX' _site/cyberchef/index.html
          grep -q 'id="cz-runtime"' _site/cyberchef/index.html
          grep -q '__zzx_storage_test__' _site/cyberchef/app/script.js
          grep -q 'script.js' _site/cyberchef/app/index.html

          python3 -m json.tool \
            _site/cyberchef/runtime-manifest.json \
            >/dev/null

          printf '%s\n' \
            "ZZX root frontend and isolated native CyberChef runtime verified."

      - name: Deploy validated site and request GitHub Pages build
        if: ${{ inputs.deploy_pages }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -d _site

          DEPLOY_DIR="$(mktemp -d)"
          trap 'rm -rf "${DEPLOY_DIR}"' EXIT
          cp -a _site/. "${DEPLOY_DIR}/"
          cd "${DEPLOY_DIR}"

          git init .
          git checkout --orphan gh-pages
          git config user.name "zzx-pages-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy ZZX-CyberChef ${GITHUB_SHA}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git push --force origin HEAD:gh-pages

          printf '%s\n' \
            "Published validated site to gh-pages."

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/pages/builds"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "zzx-native-pages-deployer",
          }
          request = urllib.request.Request(
              url,
              data=b"",
              headers=headers,
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  body = response.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              if exc.code == 409:
                  print(
                      "GitHub Pages build is already queued or in progress; "
                      "the gh-pages branch publication succeeded."
                  )
                  raise SystemExit(0)
              if exc.code == 404:
                  raise SystemExit(
                      "GitHub Pages build request returned HTTP 404. "
                      "Configure this repository once in Settings -> Pages to "
                      "publish from the gh-pages branch at /, then rerun. "
                      f"Response: {body}"
                  )
              raise SystemExit(
                  f"GitHub Pages build request failed: HTTP {exc.code}: {body}"
              )

          if status not in (200, 201, 202):
              raise SystemExit(
                  f"Unexpected GitHub Pages build response: HTTP {status}: {body}"
              )

          print(f"GitHub Pages build requested successfully: HTTP {status}")
          PY
