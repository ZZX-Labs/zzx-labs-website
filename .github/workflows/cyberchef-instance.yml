name: ZZX-CyberChef Runtime

on:
  workflow_dispatch:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Publish generated /cyberchef/app/ to the current website branch"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      cyberchef_version:
        description: "GCHQ CyberChef release: latest (default) or explicit version/tag"
        required: false
        default: "latest"
        type: string
      deploy_pages:
        description: "Publish generated /cyberchef/app/ to the current website branch"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write

concurrency:
  group: zzx-cyberchef-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CYBERCHEF_REQUESTED_VERSION: ${{ inputs.cyberchef_version || 'latest' }}

jobs:
  build:
    name: Install Official CyberChef Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout the website branch with native Git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ -z "${TARGET_BRANCH}" ]; then
            printf '%s\n' 'Unable to determine website branch.'
            exit 1
          fi

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"
          git fetch --force --prune --no-tags --depth=1 origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" FETCH_HEAD

          printf 'TARGET_BRANCH=%s\n' "${TARGET_BRANCH}" >> "${GITHUB_ENV}"
          printf 'Checked out %s at %s\n' "${TARGET_BRANCH}" "$(git rev-parse HEAD)"

      - name: Validate ZZX CyberChef source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/cyberchef/cyberchef.py

          ROOT_FILES=(
            cyberchef/index.html
            cyberchef/styles.css
            cyberchef/upgrades.css
            cyberchef/modifications.css
          )

          PAGE_CSS=(
            cyberchef/css/page/base.css
            cyberchef/css/page/runtime.css
            cyberchef/css/page/controls.css
            cyberchef/css/page/modes.css
            cyberchef/css/page/modifications.css
            cyberchef/css/page/responsive.css
          )

          FRAME_CSS=(
            cyberchef/css/frame/shim.css
            cyberchef/css/frame/tokens.css
            cyberchef/css/frame/fonts.css
            cyberchef/css/frame/core.css
            cyberchef/css/frame/themes.css
            cyberchef/css/frame/typography.css
            cyberchef/css/frame/layouts.css
            cyberchef/css/frame/components.css
            cyberchef/css/frame/operations.css
            cyberchef/css/frame/scrollbars.css
          )

          JS_MODULES=(
            cyberchef/js/config.js
            cyberchef/js/storage.js
            cyberchef/js/quota.js
            cyberchef/js/status.js
            cyberchef/js/themes.js
            cyberchef/js/layouts.js
            cyberchef/js/runtime.js
            cyberchef/js/manifest.js
            cyberchef/js/resize.js
            cyberchef/js/operations.js
            cyberchef/js/rotary.js
            cyberchef/js/page-modes.js
            cyberchef/js/modifications.js
            cyberchef/js/bootstrap.js
          )

          for file in "${ROOT_FILES[@]}" "${PAGE_CSS[@]}" "${FRAME_CSS[@]}" "${JS_MODULES[@]}"; do
            test -s "${file}"
          done

          grep -q 'id="cz-frame"' cyberchef/index.html
          grep -q 'src="about:blank"' cyberchef/index.html
          grep -q './js/quota.js' cyberchef/index.html
          grep -q 'nativeUrl: "./app/index.html"' cyberchef/js/config.js
          grep -q 'id="cz-control-deck"' cyberchef/index.html
          grep -q './css/frame/shim.css' cyberchef/js/config.js
          grep -q '@import url("./tokens.css")' cyberchef/css/frame/shim.css
          grep -q '@import url("./scrollbars.css")' cyberchef/css/frame/shim.css

          if grep -nE '/cyberchef/shim/|shim/shim\.css|cyberchef/rotary\.js' \
              tools/cyberchef/cyberchef.py cyberchef/index.html cyberchef/js/*.js; then
            printf '%s\n' 'ERROR: stale pre-v9 CyberChef shim paths remain in active source.'
            exit 1
          fi

      - name: Resolve latest official release and build /cyberchef/app/
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 tools/cyberchef/cyberchef.py \
            --version "${CYBERCHEF_REQUESTED_VERSION}" \
            --output-dir cyberchef

      - name: Validate native and modified routes
        shell: bash
        run: |
          set -euo pipefail

          test -s cyberchef/index.html
          test -s cyberchef/runtime-manifest.json
          test -s cyberchef/app/index.html
          test -d cyberchef/app/assets
          find cyberchef/app/assets -type f -print -quit | grep -q .

          grep -qi '<title[^>]*>CyberChef' cyberchef/app/index.html

          if grep -q 'CyberChefZZX' cyberchef/app/index.html; then
            printf '%s\n' 'ERROR: native CyberChef HTML was modified.'
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('cyberchef/runtime-manifest.json').read_text())
          assert manifest['schema'] == 'zzx-cyberchef-runtime-v11'
          assert manifest['native_frontend']['upstream_html_unchanged'] is True
          assert manifest['native_frontend']['index_sha256'] == manifest['native_frontend']['upstream_entry_sha256']
          upstream_entry = Path('cyberchef/app') / manifest['release']['entrypoint']
          assert upstream_entry.is_file()
          import hashlib
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(Path('cyberchef/app/index.html')) == sha(upstream_entry)
          assert manifest['custom_frontend']['shim'] == '/cyberchef/css/frame/shim.css'
          assert manifest['custom_frontend']['css_layers'] == [
              '/cyberchef/css/frame/tokens.css',
              '/cyberchef/css/frame/fonts.css',
              '/cyberchef/css/frame/core.css',
              '/cyberchef/css/frame/themes.css',
              '/cyberchef/css/frame/typography.css',
              '/cyberchef/css/frame/layouts.css',
              '/cyberchef/css/frame/components.css',
              '/cyberchef/css/frame/operations.css',
              '/cyberchef/css/frame/scrollbars.css',
          ]
          assert manifest['custom_frontend']['js_modules'] == [
              '/cyberchef/js/config.js',
              '/cyberchef/js/storage.js',
              '/cyberchef/js/quota.js',
              '/cyberchef/js/status.js',
              '/cyberchef/js/themes.js',
              '/cyberchef/js/layouts.js',
              '/cyberchef/js/runtime.js',
              '/cyberchef/js/manifest.js',
              '/cyberchef/js/resize.js',
              '/cyberchef/js/operations.js',
              '/cyberchef/js/rotary.js',
              '/cyberchef/js/page-modes.js',
              '/cyberchef/js/modifications.js',
              '/cyberchef/js/bootstrap.js',
          ]
          print('CyberChef:', manifest['release']['tag'])
          print('Asset:', manifest['release']['asset_name'])
          PY

      - name: Commit runtime to the website branch
        if: ${{ inputs.deploy_pages }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "zzx-cyberchef-bot"
          git config user.email "actions@github.com"

          git add -A cyberchef/app cyberchef/runtime-manifest.json

          if git diff --cached --quiet; then
            printf '%s\n' 'CyberChef runtime already current; no commit required.'
            exit 0
          fi

          VERSION="$(python3 -c "import json; print(json.load(open('cyberchef/runtime-manifest.json'))['release']['tag'])")"
          git commit -m "Update CyberChef runtime ${VERSION} [skip ci]"

          # Never force the website branch. If it changed during this run, fail
          # instead of overwriting unrelated website work.
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Request Pages rebuild for configured source
        if: ${{ inputs.deploy_pages }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages/builds",
              data=b'{}',
              method='POST',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'zzx-cyberchef-pages-build',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print('Pages build request:', response.status)
          except urllib.error.HTTPError as exc:
              print('Pages build request nonfatal:', exc.code, exc.read().decode('utf-8', 'replace'))
          PY
