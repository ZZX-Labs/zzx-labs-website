<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#121212"><meta name="description" content="ProtoTag is a prototype video tagging environment for designing and testing MetaTagDB schemas, metadata rules, and user workflows in both CLI and PyQt5 GUI modes."><title>ProtoTag · Projects · Software | ZZX-Labs R&amp;D</title><link rel="stylesheet" href="/static/styles.css"><script src="/static/script.js" defer></script><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./hook.css"><link rel="stylesheet" href="./prototag.css"><script src="./hook.js" defer></script><script src="./script.js" defer></script><script src="./prototag.js" defer></script></head><body class="project project-prototag"><header><div id="zzx-header"></div></header><main>
<section class="zzx-project-hero"><div class="container hero-inner"><img class="project-logo" src="./logo.png" alt="ProtoTag logo" onerror="this.hidden=true"><p class="kicker">METATAGDB PROTOTYPING // SCHEMA DESIGN</p><h1>ProtoTag</h1><p class="blurb">ProtoTag is a prototype video tagging environment for designing and testing MetaTagDB schemas, metadata rules, and user workflows in both CLI and PyQt5 GUI modes.</p></div></section>
<section id="demo" class="demo-section"><div class="container section demo-container"><div class="workbench"><aside class="tool-list-wrap"><h3>ProtoTag</h3><div class="tool-list"><button class="tool-tab mode-tab active" data-mode="schema">Schema</button><button class="tool-tab mode-tab" data-mode="rules">Rules</button><button class="tool-tab mode-tab" data-mode="sample">Sample</button><button class="tool-tab mode-tab" data-mode="export">Export</button></div></aside><section class="tool-workspace">
<div id="mode-schema" class="z-mode-panel mode-panel active"><div class="tool-card"><div class="fx-row"><label>Schema name<input id="schema-name" value="VideoRecord"></label><label>Version<input id="schema-version" value="1.0"></label></div><div class="fx-row-3"><label>Field name<input id="field-name"></label><label>Type<select id="field-type"><option>string</option><option>number</option><option>boolean</option><option>array</option><option>object</option><option>any</option></select></label><label><input id="field-required" type="checkbox"> Required</label><label>Default<input id="field-default"></label><label>Description<input id="field-desc"></label></div><button id="add-field" class="btn">ADD FIELD</button><div class="fx-kpis"><div><span>Fields</span><strong id="field-count">0</strong></div></div><div id="fields"></div><pre id="schema-output" class="z-log"></pre></div></div>
<div id="mode-rules" class="z-mode-panel mode-panel"><div class="tool-card"><div class="fx-row-3"><label>Field<input id="rule-field"></label><label>Operator<select id="rule-op"><option>equals</option><option>contains</option><option>gt</option><option>lt</option></select></label><label>Value<input id="rule-value"></label><label>Apply tag<input id="rule-tag"></label></div><button id="add-rule" class="btn">ADD RULE</button><pre id="rules-output" class="z-log"></pre></div></div>
<div id="mode-sample" class="z-mode-panel mode-panel"><div class="tool-card"><label>Sample record JSON<textarea id="sample" rows="10">{{"title":"Blue whale clip","duration":38.4,"species":["Balaenoptera musculus"],"reviewed":true}}</textarea></label><div class="button-row"><button id="validate-sample" class="btn">VALIDATE AGAINST SCHEMA</button><button id="apply-rules" class="btn ghost">APPLY TAG RULES</button></div><pre id="validation" class="z-log"></pre><pre id="rule-result" class="z-log"></pre></div></div>
<div id="mode-export" class="z-mode-panel mode-panel"><div class="tool-card"><div class="button-row"><button id="export-schema" class="btn">EXPORT SCHEMA</button><button id="export-rules" class="btn ghost">EXPORT RULES</button></div></div></div>
</section></div></div></section></main><footer><div id="zzx-footer"></div></footer></body></html>
